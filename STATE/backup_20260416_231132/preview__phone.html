<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09111f" />
  <title>Parabula Phone Viewer</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./mobile.css" />
  <link rel="stylesheet" href="./ux-polish.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button id="toggleLibraryBtn" class="icon-btn" type="button" aria-expanded="false" aria-controls="libraryPanel">☰</button>
      <div class="header-copy">
        <strong>דפי העבודה שלי</strong>
        <span id="headerMeta">טוען דפים...</span>
      </div>
      <a class="icon-btn link-btn" href="./index.html" target="_blank" rel="noreferrer">מלא</a>
    </header>

    <aside id="libraryPanel" class="library-panel" aria-label="ספריית דפים">
      <div class="library-head">
        <strong>כל הדפים</strong>
        <button id="closeLibraryBtn" class="icon-btn" type="button">✕</button>
      </div>

      <div class="library-tools">
        <input id="searchBox" type="search" placeholder="חיפוש לפי כותרת, נושא או מספר עמוד" />
        <select id="topicFilter">
          <option value="__all__">כל הנושאים</option>
        </select>
      </div>

      <div id="pagesList" class="pages-list"></div>
    </aside>

    <main class="viewer-panel">
      <section class="viewer-head">
        <div class="viewer-title-wrap">
          <strong id="currentTitle">טוען…</strong>
          <span id="currentMeta">—</span>
        </div>
        <div class="viewer-head-actions">
          <button id="showLibraryBtn" class="soft-btn" type="button">רשימה</button>
          <button id="openPageBtn" class="soft-btn" type="button">פתח עמוד</button>
          <button id="openSiteBtn" class="soft-btn" type="button">אתר חי</button>
          <button id="printPageBtn" class="soft-btn primary" type="button">הדפס / PDF</button>
        </div>
      </section>

      <section class="a4-stage" aria-label="תצוגת עמוד A4">
        <div class="a4-frame">
          <iframe id="pageFrame" title="Worksheet preview" src="about:blank"></iframe>
        </div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="ניווט נוח">
    <button id="bottomLibraryBtn" type="button">דפים</button>
    <button id="prevBtn" type="button">הקודם</button>
    <button id="nextBtn" type="button">הבא</button>
    <button id="bottomPrintBtn" type="button">PDF</button>
  </nav>

  <script src="./phone.js"></script>
</body>
</html>
