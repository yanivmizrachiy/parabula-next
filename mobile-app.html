<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>ספר דפי העבודה של יניב</title>
  <link rel="manifest" href="./mobile-app.webmanifest?v=20260712002" />
  <link rel="icon" href="./icon.svg?v=20260712002" type="image/svg+xml" />
  <link rel="stylesheet" href="./reader-actions.css?v=20260712002" />
  <link rel="stylesheet" href="./mobile-app.css?v=20260712002" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-main">
        <strong class="app-title">ספר דפי העבודה של יניב</strong>
        <div id="appMeta" class="app-meta" role="status" aria-live="polite">טוען…</div>
      </div>
      <div class="topbar-actions">
        <button id="installAppBtn" type="button" hidden>התקן במסך הבית</button>
        <button id="toggleTopicsBtn" type="button" aria-controls="topicsPanel" aria-expanded="true">נושאים ודפים</button>
      </div>
    </header>

    <section id="topicsPanel" class="topics-panel" aria-label="נושאים ודפים">
      <div class="topics-head">
        <div class="section-title" id="topicsTitle">כל הנושאים</div>
        <button id="selectModeBtn" class="mini-chip" type="button" aria-pressed="false">☑ בחירה</button>
      </div>
      <div id="topicStrip" class="topic-strip" role="group" aria-labelledby="topicsTitle"></div>
      <input id="globalSearch" type="search" inputmode="search" autocomplete="off" placeholder="חיפוש בכל הספר — נושא, כותרת או מספר עמוד" aria-label="חיפוש גלובלי בכל הדפים והנושאים" />
      <div id="searchMeta" class="search-meta" role="status" aria-live="polite" hidden></div>
      <section id="topicPages" class="pages-list" aria-label="רשימת דפים"></section>
    </section>

    <section class="reader-box" aria-label="תצוגת דף העבודה">
      <div class="reader-head">
        <div class="reader-copy">
          <strong id="currentPageTitle" aria-live="polite">טוען…</strong>
          <span id="currentPageMeta">—</span>
        </div>
        <div class="reader-progress">
          <span id="topicProgress">—</span>
          <span id="globalProgress">—</span>
        </div>
      </div>

      <div id="mobileLoadingState" class="loading-state" role="status" aria-live="polite" hidden>טוען דף…</div>

      <div class="frame-wrap">
        <iframe id="mobilePageFrame" title="ספר דפי עבודה" src="about:blank" loading="eager"></iframe>
      </div>

      <div class="zoom-dock" role="group" aria-label="הגדלת הדף לקריאה נוחה">
        <button id="zoomOutBtn" type="button" aria-label="הקטנת התצוגה">−</button>
        <button id="zoomResetBtn" type="button" aria-label="התאמה לרוחב המסך">100%</button>
        <button id="zoomInBtn" type="button" aria-label="הגדלת התצוגה">+</button>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="ניווט ופעולות">
      <button id="prevPageBtn" type="button" aria-label="הדף הקודם">◄ הקודם</button>
      <button id="actionsBtn" type="button" aria-label="פעולות: הדפסה, PDF והורדה">⚙ פעולות</button>
      <button id="openLiveBtn" type="button" aria-label="פתיחת הדף המלא בכרטיסייה חדשה">פתח מלא</button>
      <button id="nextPageBtn" type="button" aria-label="הדף הבא">הבא ►</button>
    </nav>
  </div>

  <!-- ═══ סרגל בחירה מרובה ═══ -->
  <div id="selectionBar" class="selection-bar" hidden role="region" aria-label="דפים נבחרים">
    <span id="selectionCount" class="sel-count">נבחרו 0 דפים</span>
    <div class="sel-actions">
      <button id="selPrint" type="button">🖨 הדפס נבחרים</button>
      <button id="selClear" type="button">נקה</button>
    </div>
  </div>

  <!-- ═══ גיליון פעולות ═══ -->
  <div id="actionsSheet" class="actions-sheet" hidden role="dialog" aria-modal="true" aria-label="פעולות על הדף">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-title" id="sheetPageTitle">פעולות</div>

      <div class="sheet-group-label">מצב קריאה</div>
      <div id="modeSwitch" class="sheet-modes" role="group" aria-label="מצב דפדוף">
        <button data-mode="single" class="sheet-mode is-active" type="button">עמוד בודד</button>
        <button data-mode="scroll" class="sheet-mode" type="button">גלילה רציפה</button>
      </div>

      <div class="sheet-group-label">הדף הנוכחי</div>
      <div class="sheet-actions">
        <button id="aPrint" class="sheet-act primary" type="button">🖨 הדפסה</button>
        <button id="aPdf" class="sheet-act" type="button">⬇ שמירה כ-PDF</button>
        <button id="aHtml" class="sheet-act" type="button">⬇ הורדת HTML</button>
        <button id="aOpen" class="sheet-act" type="button">↗ פתח בטאב</button>
      </div>

      <div class="sheet-group-label">הפרק הנוכחי</div>
      <div class="sheet-actions">
        <button id="aPrintTopic" class="sheet-act" type="button">🖨 הדפס את כל הפרק</button>
        <button id="aSelectTopic" class="sheet-act" type="button">☑ בחר את כל הפרק</button>
      </div>

      <button id="sheetCloseBtn" class="sheet-close" type="button">סגירה</button>
    </div>
  </div>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const fullMode = params.get('mode') === 'full';
      const requestedFile = params.get('file') || '';
      const openButton = document.getElementById('openLiveBtn');

      if (fullMode) {
        document.body.classList.add('full-mode');
        openButton.textContent = 'חזרה';
        openButton.setAttribute('aria-label', 'חזרה לאפליקציית הספר');
      }

      openButton.addEventListener('click', event => {
        event.preventDefault();
        event.stopImmediatePropagation();

        if (fullMode) {
          window.close();
          setTimeout(() => {
            if (!window.closed) window.location.assign('./mobile-app.html');
          }, 0);
          return;
        }

        const frame = document.getElementById('mobilePageFrame');
        let file = '';
        try {
          file = decodeURIComponent(frame.contentWindow.location.pathname.split('/').pop() || '');
        } catch {}
        if (!/^עמוד-\d+\.html$/.test(file)) return;

        const target = new URL('./mobile-app.html', window.location.href);
        target.searchParams.set('mode', 'full');
        target.searchParams.set('file', file);
        window.open(target.href, '_blank', 'noopener,noreferrer');
      }, true);

      if (fullMode && /^עמוד-\d+\.html$/.test(requestedFile)) {
        const openRequestedPage = () => {
          const search = document.getElementById('globalSearch');
          if (!search) {
            setTimeout(openRequestedPage, 40);
            return;
          }
          search.value = requestedFile;
          search.dispatchEvent(new Event('input', { bubbles: true }));
          requestAnimationFrame(() => {
            const card = document.querySelector(`.page-card[data-file="${CSS.escape(requestedFile)}"]`);
            if (card) card.click();
            else setTimeout(openRequestedPage, 40);
          });
        };
        window.addEventListener('load', openRequestedPage, { once: true });
        setTimeout(openRequestedPage, 0);
      }
    })();
  </script>
  <script src="./reader-actions.js?v=20260712002"></script>
  <script src="./mobile-app.js?v=20260712002"></script>
</body>
</html>
