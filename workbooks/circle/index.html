<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>חוברת המעגל — חוברת אחת מדורגת</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-family:Arial,sans-serif;color:#152033}.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #d8e2ef;box-shadow:0 2px 12px rgba(30,50,80,.06);padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.brand{font-weight:900;font-size:20px;margin-inline-end:8px}.sub{font-size:12px;color:#64748b}.control,.link,select,input{font:inherit;border:1px solid #b8c7da;background:#fff;border-radius:10px;padding:8px 10px;color:#152033}.control{cursor:pointer}.control:hover,.link:hover{background:#eef4fb}.link{text-decoration:none}input{width:72px;text-align:center}select{max-width:245px}.progress{font-weight:700;white-space:nowrap}.stage-note{width:100%;text-align:center;font-size:12px;color:#52627a;margin-top:-2px}.viewer{max-width:1060px;margin:14px auto;padding:0 10px}.viewer iframe{display:block;width:100%;height:calc(100vh - 120px);min-height:760px;border:1px solid #cdd9e8;border-radius:15px;background:#fff;box-shadow:0 10px 34px rgba(36,56,86,.08)}@media(max-width:760px){.brand{width:100%;text-align:center}.sub{display:none}.toolbar{gap:6px;padding:8px}.stage-note{font-size:11px}select{max-width:190px}.viewer{margin-top:8px;padding:0 4px}.viewer iframe{height:calc(100vh - 190px);min-height:620px;border-radius:10px}}</style></head><body><nav class="toolbar" aria-label="ניווט בחוברת המעגל"><span class="brand">חוברת המעגל</span><span class="sub">חוברת אחת · מדורגת · ממוספרת</span><select id="stage" aria-label="בחירת שלב לימודי"><option>טוען שלבים…</option></select><button class="control" id="prev" type="button">הקודם</button><span class="progress">עמוד <input id="page" type="number" min="1" value="1" inputmode="numeric" aria-label="מספר עמוד"> מתוך <strong id="total">—</strong></span><button class="control" id="next" type="button">הבא</button><a id="open" class="link" href="page-1.html" target="_blank" rel="noopener">פתח דף מלא</a><a class="link" href="../index.html">כל החוברות</a><div class="stage-note" id="stage-note">טוען את מבנה החוברת…</div></nav><main class="viewer"><iframe id="sheet" title="חוברת המעגל — עמוד 1" src="page-1.html"></iframe></main><script>const input=document.getElementById('page'),frame=document.getElementById('sheet'),open=document.getElementById('open'),totalEl=document.getElementById('total'),stage=document.getElementById('stage'),stageNote=document.getElementById('stage-note');let total=1,stages=[];function currentStage(n){return stages.find(s=>n>=s.from&&n<=s.to)}function syncStage(n){const s=currentStage(n);if(!s)return;stage.value=s.id;stageNote.textContent=`${s.title} · עמודים ${s.from}–${s.to}`}function go(value){const n=Math.max(1,Math.min(total,Number(value)||1));input.value=String(n);const url=`page-${n}.html`;frame.src=url;frame.title=`חוברת המעגל — עמוד ${n}`;open.href=url;syncStage(n);history.replaceState(null,'',`#page=${n}`)}document.getElementById('prev').onclick=()=>go(Number(input.value)-1);document.getElementById('next').onclick=()=>go(Number(input.value)+1);input.onchange=()=>go(input.value);stage.onchange=()=>{const s=stages.find(x=>x.id===stage.value);if(s)go(s.from)};fetch('manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(m=>{total=Number(m.pageCount);stages=m.stages||[];input.max=String(total);totalEl.textContent=String(total);stage.replaceChildren(...stages.map(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=`${s.title} (${s.from}–${s.to})`;return o}));const match=location.hash.match(/page=(\d+)/);go(match?match[1]:1)}).catch(error=>{console.error(error);totalEl.textContent='שגיאה';stageNote.textContent='לא ניתן לטעון את מבנה החוברת'});</script></body></html>
