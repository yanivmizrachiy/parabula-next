<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>חוברת יחס ופרופורציה</title>
<style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#fff}#status{min-height:100vh;display:grid;place-items:center;color:#1f2a44;font-size:18px;text-align:center;padding:24px;box-sizing:border-box}</style>
</head>
<body>
<div id="status">טוען את חוברת היחס…</div>
<script>
(async()=>{
  const target='/ratio-workbook/?v=20260821-release';
  try{
    const response=await fetch(target,{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    let html=await response.text();
    html=html.replace(/<head([^>]*)>/i,'<head$1><base href="/ratio-workbook/">');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('status').innerHTML='לא ניתן היה לטעון את החוברת כרגע.<br><a href="/ratio-workbook/">פתיחת החוברת</a>';
  }
})();
</script>
</body>
</html>
