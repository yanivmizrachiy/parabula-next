<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2f66" />
  <meta name="description" content="פתיחה חכמה של חוברת מערכת משוואות בשני נעלמים בקורא המתאים למחשב או לטלפון." />
  <title>מערכת משוואות בשני נעלמים — פתיחת החוברת</title>
  <link rel="stylesheet" href="vendor/fonts/rubik.css" />
  <style>
    :root { color-scheme: light; font-family: Rubik, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: #eef4ff; color: #102a56; }
    main { width: min(560px, 100%); padding: 32px; border: 1px solid #c9d8f2; border-radius: 24px; background: #fff; box-shadow: 0 18px 50px rgba(15, 47, 102, .14); text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 5vw, 2.2rem); }
    p { margin: 0 0 22px; line-height: 1.7; }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 12px; background: #0f4fa8; color: #fff; font-weight: 700; text-decoration: none; }
    a.secondary { background: #e8f0ff; color: #123e7c; }
  </style>
</head>
<body>
  <main>
    <h1>מערכת משוואות בשני נעלמים</h1>
    <p id="status" role="status" aria-live="polite">פותח את החוברת בקורא המתאים למכשיר…</p>
    <div class="links">
      <a id="mobileFallback" href="./mobile-app.html?file=%D7%A2%D7%9E%D7%95%D7%93-609.html">פתיחה באפליקציה</a>
      <a class="secondary" href="./עמוד-609.html">פתיחת הדף הראשון</a>
    </div>
  </main>

  <script>
    (() => {
      const ENTRY_FILE = 'עמוד-609.html';
      const params = new URLSearchParams(window.location.search);
      const requested = /^עמוד-\d+\.html$/.test(params.get('file') || '')
        ? params.get('file')
        : ENTRY_FILE;

      const viewportIsCompact = window.matchMedia?.('(max-width: 820px)').matches || false;
      const coarsePointer = window.matchMedia?.('(pointer: coarse)').matches || false;
      const touchDevice = Number(navigator.maxTouchPoints || 0) > 0;
      const uaMobile = navigator.userAgentData?.mobile === true || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
      const shortScreenSide = Math.min(Number(screen.width || 0), Number(screen.height || 0));
      const phoneLikeTouchDevice = coarsePointer && touchDevice && shortScreenSide > 0 && shortScreenSide <= 1024;
      const isMobile = viewportIsCompact || uaMobile || phoneLikeTouchDevice;

      const target = new URL(isMobile ? './mobile-app.html' : './catalog.html', window.location.href);
      if (isMobile) {
        target.searchParams.set('file', requested);
      } else {
        try { localStorage.setItem('parabula-catalog:last-file', requested); }
        catch { /* אחסון חסום אינו מונע פתיחה של הקורא */ }
      }
      target.hash = window.location.hash;
      document.getElementById('mobileFallback').href = `./mobile-app.html?file=${encodeURIComponent(requested)}`;
      window.location.replace(target.href);
    })();
  </script>

  <noscript>
    <p><a href="./עמוד-609.html">פתיחת הדף הראשון ללא JavaScript</a></p>
  </noscript>
</body>
</html>
