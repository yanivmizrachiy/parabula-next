name: Pythagoras foundations v2 canonical sync

on:
  push:
    branches:
      - gpt/pythagoras-foundations-v2
    paths:
      - .github/workflows/pythagoras-foundations-v2-sync.yml
      - scripts/extend-pythagoras-foundations-v2-once.mjs

permissions:
  contents: write

concurrency:
  group: pythagoras-foundations-v2-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check one-shot extender
        run: node --check scripts/extend-pythagoras-foundations-v2-once.mjs

      - name: Apply additive Pythagoras v2 improvements
        run: node scripts/extend-pythagoras-foundations-v2-once.mjs

      - name: Rebuild curriculum metadata
        run: node scripts/build-curriculum.mjs

      - name: Focused Pythagoras contracts
        run: node --test tests/contracts/pythagoras-foundations.test.mjs tests/contracts/root-pages.test.mjs

      - name: Canonical page verification
        run: node scripts/verify.mjs

      - name: Metadata and curriculum validation
        run: |
          node scripts/generate-pages-registry.mjs
          node scripts/validate-meta-schema.mjs
          node scripts/build-curriculum.mjs --check
          node scripts/validate-curriculum.mjs

      - name: Canonical rules and HTML
        run: |
          node scripts/single-rules-source-check.mjs
          npx html-validate "עמוד-*.html"

      - name: Commit canonical outputs back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(pythagoras): add worked solution foundations v2"
          git push origin HEAD:gpt/pythagoras-foundations-v2
