name: One-time migrate geometry suite into razpages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-migrate-geometry-suite.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build verified unified geometry suite branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="agent/final-geometry-suite-migration-20260818"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          git remote add legacy https://github.com/yanivmizrachiy/smartschool-hebrew-voice-notes.git
          git fetch legacy main --tags
          LEGACY_SHA="$(git rev-parse legacy/main)"
          mkdir -p /tmp/legacy-geometry
          git archive legacy/main | tar -x -C /tmp/legacy-geometry
          OLD=/tmp/legacy-geometry

          test -f "$OLD/index.html"
          test -f "$OLD/viewer/app.js"
          test -f "$OLD/circle/page-1.html"
          test -f "$OLD/cylinder/page-1.html"
          test -f "$OLD/content/workbook.json"
          test -f "$OLD/worksheets/page-17.html"
          grep -q 'מעגל · גליל · חרוט' "$OLD/index.html"
          grep -q 'מושגים בסיסיים' "$OLD/circle/page-1.html"

          SRC_CIRCLE="$(find "$OLD/circle" -maxdepth 1 -type f -name 'page-*.html' | wc -l | tr -d ' ')"
          SRC_CYLINDER="$(find "$OLD/cylinder" -maxdepth 1 -type f -name 'page-*.html' | wc -l | tr -d ' ')"
          SRC_CONE="$(node -e "const w=require('$OLD/content/workbook.json'); process.stdout.write(String(w.printSheetCount || (w.printSequence||[]).length))")"
          test "$SRC_CIRCLE" -gt 0
          test "$SRC_CYLINDER" -gt 0
          test "$SRC_CONE" -gt 0

          rm -rf workbooks sources/geometry-workbooks
          mkdir -p workbooks/cone sources/geometry-workbooks/legacy-docs sources/geometry-workbooks/legacy-tooling sources/geometry-workbooks/legacy-extra

          cp -a "$OLD/circle" workbooks/circle
          cp -a "$OLD/cylinder" workbooks/cylinder
          cp -a "$OLD/viewer" workbooks/viewer
          cp "$OLD/index.html" workbooks/index.html

          for name in content print visual-assets visual-pages worksheets; do
            if [ -e "$OLD/$name" ]; then cp -a "$OLD/$name" "workbooks/cone/$name"; fi
          done
          if [ -f "$OLD/print.html" ]; then cp "$OLD/print.html" workbooks/cone/print.html; fi

          for name in design questions research; do
            if [ -e "$OLD/$name" ]; then cp -a "$OLD/$name" "sources/geometry-workbooks/legacy-docs/$name"; fi
          done
          for name in src tests tools qa; do
            if [ -e "$OLD/$name" ]; then cp -a "$OLD/$name" "sources/geometry-workbooks/legacy-tooling/$name"; fi
          done
          if [ -f "$OLD/README.md" ]; then cp "$OLD/README.md" sources/geometry-workbooks/legacy-docs/README.md.archive; fi
          if [ -f "$OLD/RULES.md" ]; then cp "$OLD/RULES.md" sources/geometry-workbooks/legacy-docs/RULES.md.archive; fi
          if [ -f "$OLD/package.json" ]; then cp "$OLD/package.json" sources/geometry-workbooks/legacy-tooling/package.legacy.json; fi
          if [ -f "$OLD/.gitignore" ]; then cp "$OLD/.gitignore" sources/geometry-workbooks/legacy-tooling/gitignore.legacy; fi
          if [ -d "$OLD/.github" ]; then cp -a "$OLD/.github" sources/geometry-workbooks/legacy-tooling/github; fi

          # Preserve documentation without creating a second active rules/memory source.
          while IFS= read -r -d '' f; do mv "$f" "$f.archive"; done < <(find sources/geometry-workbooks -type f \( -name '*.md' -o -name '*.txt' -o -name '*.rst' -o -name '*.adoc' \) -print0)
          while IFS= read -r -d '' f; do mv "$f" "$f.archive"; done < <(find sources/geometry-workbooks/legacy-tooling/github -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 2>/dev/null || true)

          mkdir -p workbooks/assets
          curl -fsSL https://raw.githubusercontent.com/yanivmizrachiy/zaviyot-digital-workbook/main/public/logo.png -o workbooks/assets/logo.png

          node <<'NODE'
          const fs = require('node:fs');

          let html = fs.readFileSync('workbooks/index.html', 'utf8');
          html = html.replace(/https:\/\/raw\.githubusercontent\.com\/yanivmizrachiy\/zaviyot-digital-workbook\/main\/public\/logo\.png/g, 'assets/logo.png');
          html = html.replace('172 דפי A4 · שלוש חוברות מתמטיקה', '<span data-total-pages>—</span> דפי A4 · שלוש חוברות מתמטיקה');
          html = html.replace('<span>88 דפי A4</span><span>מעגל ועיגול</span>', '<span data-page-count="circle">— דפי A4</span><span>מעגל ועיגול</span>');
          html = html.replace('<span>38 דפי A4</span><span>גליל ישר</span>', '<span data-page-count="cylinder">— דפי A4</span><span>גליל ישר</span>');
          html = html.replace('<span>46 דפי A4</span><span>חרוט ישר</span>', '<span data-page-count="cone">— דפי A4</span><span>חרוט ישר</span>');
          html = html.replace('<div><strong>172</strong><span>דפי A4 בסך הכול</span></div>', '<div><strong data-total-pages>—</strong><span>דפי A4 בסך הכול</span></div>');
          fs.writeFileSync('workbooks/index.html', html);

          let app = fs.readFileSync('workbooks/viewer/app.js', 'utf8');
          app = app.replace(
            /const TOPICS = \{[\s\S]*?\n\};/,
            `const TOPICS = {\n  cone: { label: 'חרוט' },\n  circle: { label: 'מעגל', folder: 'circle' },\n  cylinder: { label: 'גליל', folder: 'cylinder' }\n};`
          );
          app = app.replace("fetch('content/workbook.json', { cache: 'no-store' })", "fetch('cone/content/workbook.json', { cache: 'no-store' })");
          app = app.replace('url: `worksheets/${page.slug}.html`', 'url: `cone/worksheets/${page.slug}.html`');
          app = app.replace('url: `visual-pages/${page.slug}.html`', 'url: `cone/visual-pages/${page.slug}.html`');
          const manifestLoader = `\nasync function loadManifest() {\n  const response = await fetch('manifest.json', { cache: 'no-store' });\n  if (!response.ok) throw new Error(\`manifest HTTP \${response.status}\`);\n  const manifest = await response.json();\n  let total = 0;\n  for (const key of Object.keys(TOPICS)) {\n    const count = Number(manifest.workbooks?.[key]?.pages);\n    if (!Number.isInteger(count) || count < 1) throw new Error(\`מספר דפים לא תקין עבור \${key}\`);\n    TOPICS[key].count = count;\n    total += count;\n    document.querySelectorAll(\`[data-page-count="\${key}"]\`).forEach(node => { node.textContent = \`\${count} דפי A4\`; });\n  }\n  document.querySelectorAll('[data-total-pages]').forEach(node => { node.textContent = String(total); });\n}\n`;
          app = app.replace('\nasync function loadEntries() {', manifestLoader + '\nasync function loadEntries() {');
          app = app.replace('\nloadEntries()\n  .then(result => {', '\nloadManifest()\n  .then(() => loadEntries())\n  .then(result => {');
          fs.writeFileSync('workbooks/viewer/app.js', app);
          NODE

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const countPages = dir => fs.readdirSync(dir).filter(name => /^page-\d+\.html$/.test(name)).length;
          const cone = JSON.parse(fs.readFileSync('workbooks/cone/content/workbook.json', 'utf8'));
          const manifest = {
            canonicalRepository: 'yanivmizrachiy/razpages',
            canonicalRoot: 'workbooks',
            sourceOfTruth: true,
            sharedSite: 'workbooks/index.html',
            workbooks: {
              circle: { title: 'מעגל', pages: countPages('workbooks/circle'), entry: 'workbooks/index.html?topic=circle&sheet=1#workbook', firstPage: 'workbooks/circle/page-1.html' },
              cylinder: { title: 'גליל', pages: countPages('workbooks/cylinder'), entry: 'workbooks/index.html?topic=cylinder&sheet=1#workbook', firstPage: 'workbooks/cylinder/page-1.html' },
              cone: { title: 'חרוט', pages: Number(cone.printSheetCount || (cone.printSequence || []).length), entry: 'workbooks/index.html?topic=cone&sheet=1#workbook', registry: 'workbooks/cone/content/workbook.json' }
            }
          };
          fs.writeFileSync('workbooks/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

          make_redirect() {
            local topic="$1" title="$2" file="workbooks/$1/index.html"
            mkdir -p "workbooks/$topic"
            cat > "$file" <<EOF
          <!doctype html>
          <html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><meta http-equiv="refresh" content="0;url=../?topic=${topic}&sheet=1#workbook"><script>location.replace('../?topic=${topic}&sheet=1#workbook');</script></head><body><a href="../?topic=${topic}&sheet=1#workbook">פתיחת חוברת ${title}</a></body></html>
          EOF
          }
          make_redirect circle מעגל
          make_redirect cylinder גליל
          make_redirect cone חרוט

          cat > tests/contracts/geometry-workbooks-unified.test.mjs <<'NODE'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const wb = path.join(root, 'workbooks');
          const read = rel => fs.readFileSync(path.join(root, rel), 'utf8');
          const exists = rel => fs.existsSync(path.join(root, rel));
          const pageFiles = rel => fs.readdirSync(path.join(root, rel)).filter(n => /^page-\d+\.html$/.test(n)).sort((a,b)=>Number(a.match(/\d+/)[0])-Number(b.match(/\d+/)[0]));
          const manifest = JSON.parse(read('workbooks/manifest.json'));

          test('geometry suite has one canonical shared site and derived counts', () => {
            assert.equal(manifest.canonicalRepository, 'yanivmizrachiy/razpages');
            assert.equal(manifest.sourceOfTruth, true);
            const circle = pageFiles('workbooks/circle');
            const cylinder = pageFiles('workbooks/cylinder');
            const cone = JSON.parse(read('workbooks/cone/content/workbook.json'));
            assert.equal(manifest.workbooks.circle.pages, circle.length);
            assert.equal(manifest.workbooks.cylinder.pages, cylinder.length);
            assert.equal(manifest.workbooks.cone.pages, Number(cone.printSheetCount || cone.printSequence.length));
            assert.equal(circle[0], 'page-1.html');
            assert.equal(circle.at(-1), `page-${circle.length}.html`);
            assert.equal(cylinder[0], 'page-1.html');
            assert.equal(cylinder.at(-1), `page-${cylinder.length}.html`);
          });

          test('shared home preserves the designed Zaviyot-style geometry experience', () => {
            const html = read('workbooks/index.html');
            for (const marker of ['מעגל · גליל · חרוט', 'workbook-card--circle', 'workbook-card--cylinder', 'workbook-card--cone', 'id="booklet-sheets"', 'id="page-jump"']) assert.ok(html.includes(marker), marker);
            assert.ok(html.includes('assets/logo.png'));
            assert.ok(!html.includes('raw.githubusercontent.com'));
            const app = read('workbooks/viewer/app.js');
            assert.ok(app.includes("fetch('manifest.json'"));
            assert.ok(app.includes("fetch('cone/content/workbook.json'"));
            assert.ok(app.includes('cone/worksheets/${page.slug}.html'));
            assert.ok(app.includes('cone/visual-pages/${page.slug}.html'));
          });

          test('circle starts with the remembered basic circle/disk concepts', () => {
            const first = read('workbooks/circle/page-1.html');
            assert.ok(first.includes('מושגים בסיסיים'));
            assert.ok(first.includes('מעגל'));
            assert.ok(first.includes('עיגול'));
          });

          test('protected cone source and local assets survived migration', () => {
            const cone = JSON.parse(read('workbooks/cone/content/workbook.json'));
            const locked = cone.pages.find(p => p.contentLocked === true);
            assert.ok(locked, 'missing content-locked cone source page');
            assert.ok(exists(`workbooks/cone/worksheets/${locked.slug}.html`));
            assert.ok(exists('workbooks/assets/logo.png'));
          });

          test('topic folder indexes are aliases to the shared site, not competing viewers', () => {
            for (const [topic, title] of [['circle','מעגל'], ['cylinder','גליל'], ['cone','חרוט']]) {
              const html = read(`workbooks/${topic}/index.html`);
              assert.ok(html.includes(`?topic=${topic}&sheet=1#workbook`), title);
              assert.ok(!html.includes('booklet-sheets'), `${title} must not duplicate the shared viewer`);
            }
          });

          test('published geometry tree has no dependency on the deleted legacy repository', () => {
            const stack = [wb];
            const textExt = new Set(['.html','.css','.js','.mjs','.json','.svg','.webmanifest']);
            while (stack.length) {
              const dir = stack.pop();
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const abs = path.join(dir, entry.name);
                if (entry.isDirectory()) stack.push(abs);
                else if (textExt.has(path.extname(entry.name))) {
                  const text = fs.readFileSync(abs, 'utf8');
                  assert.ok(!text.includes('smartschool-hebrew-voice-notes'), path.relative(root, abs));
                }
              }
            }
          });

          test('local HTML and CSS references in published workbooks resolve', () => {
            const files = [];
            const stack = [wb];
            while (stack.length) {
              const dir = stack.pop();
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const abs = path.join(dir, entry.name);
                if (entry.isDirectory()) stack.push(abs);
                else if (/\.(?:html|css)$/i.test(entry.name)) files.push(abs);
              }
            }
            const refs = /(?:href|src)=["']([^"']+)["']|url\(["']?([^)'"?#]+)["']?\)/g;
            for (const file of files) {
              const text = fs.readFileSync(file, 'utf8');
              let m;
              while ((m = refs.exec(text))) {
                const raw = (m[1] || m[2] || '').trim();
                if (!raw || /^(?:https?:|data:|mailto:|tel:|javascript:|#|\?)/i.test(raw)) continue;
                const clean = raw.split('#')[0].split('?')[0];
                if (!clean) continue;
                const target = path.resolve(path.dirname(file), clean);
                assert.ok(fs.existsSync(target) || fs.existsSync(path.join(target, 'index.html')), `${path.relative(root,file)} -> ${raw}`);
              }
            }
          });
          NODE

          TARGET_CIRCLE="$(find workbooks/circle -maxdepth 1 -type f -name 'page-*.html' | wc -l | tr -d ' ')"
          TARGET_CYLINDER="$(find workbooks/cylinder -maxdepth 1 -type f -name 'page-*.html' | wc -l | tr -d ' ')"
          TARGET_CONE="$(node -e "const w=require('./workbooks/cone/content/workbook.json'); process.stdout.write(String(w.printSheetCount || (w.printSequence||[]).length))")"
          test "$TARGET_CIRCLE" = "$SRC_CIRCLE"
          test "$TARGET_CYLINDER" = "$SRC_CYLINDER"
          test "$TARGET_CONE" = "$SRC_CONE"

          npm ci
          node --test tests/contracts/geometry-workbooks-unified.test.mjs
          node scripts/single-rules-source-check.mjs
          npm run build
          test -f dist/workbooks/index.html
          test -f dist/workbooks/viewer/app.js
          test -f dist/workbooks/circle/page-1.html
          test -f dist/workbooks/cylinder/page-1.html
          test -f dist/workbooks/cone/content/workbook.json

          cat > workbooks/migration-provenance.json <<EOF
          {
            "legacyCommit": "$LEGACY_SHA",
            "historyPreserved": true,
            "canonicalRepository": "yanivmizrachiy/razpages",
            "canonicalRoot": "workbooks"
          }
          EOF

          git add workbooks sources/geometry-workbooks tests/contracts/geometry-workbooks-unified.test.mjs
          git commit -m "feat: unify complete circle cylinder and cone site in razpages"
          git merge --allow-unrelated-histories -s ours legacy/main -m "chore: preserve legacy geometry repository history"
          git remote remove legacy
          git push -u origin "$BRANCH"
