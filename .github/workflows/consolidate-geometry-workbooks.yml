name: Consolidate geometry workbooks into migration branch

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/consolidate-circle-cylinder-cone'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidate-circle-cylinder-cone
          fetch-depth: 0

      - name: Consolidate and validate all geometry workbooks
        run: python scripts/consolidate-geometry-workbooks.py

      - name: Commit complete migration to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workbooks geometry-workbooks.html scripts/copy-static-site.mjs
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "feat: consolidate circle cylinder and cone in razpages"
          git push origin HEAD:agent/consolidate-circle-cylinder-cone
