name: Consolidate geometry workbooks into migration branch

on:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/consolidate-geometry-workbooks.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidate-circle-cylinder-cone
          fetch-depth: 0

      - name: Fetch canonical geometry source
        run: |
          rm -rf /tmp/geometry-source
          git clone --depth 1 https://github.com/yanivmizrachiy/smartschool-hebrew-voice-notes.git /tmp/geometry-source

      - name: Copy complete circle, cylinder and cone material
        run: |
          set -euo pipefail
          rm -rf workbooks/circle workbooks/cylinder workbooks/cone workbooks/visual-assets
          mkdir -p workbooks/circle workbooks/cylinder workbooks/cone
          cp -a /tmp/geometry-source/circle/. workbooks/circle/
          cp -a /tmp/geometry-source/cylinder/. workbooks/cylinder/
          cp /tmp/geometry-source/print/harut-a4.html workbooks/cone/index.html
          cp /tmp/geometry-source/print/styles.css workbooks/cone/styles.css
          cp -a /tmp/geometry-source/print/assets workbooks/cone/assets
          cp -a /tmp/geometry-source/visual-assets workbooks/visual-assets

      - name: Build unified readers and manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root=Path('workbooks')
          def reader(title,total,subtitle):
              return f'''<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title}</title><style>*{{box-sizing:border-box}}body{{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}}.bar{{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #d9e2ef;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}}.title{{font-weight:800;font-size:18px;margin-inline-end:12px}}.sub{{font-size:13px;color:#52627a}}button,a,input{{font:inherit}}button,.link{{border:1px solid #b9c8da;background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;color:#172033}}input{{width:72px;border:1px solid #b9c8da;border-radius:9px;padding:8px;text-align:center}}.frame-wrap{{max-width:1050px;margin:14px auto;padding:0 10px}}iframe{{display:block;width:100%;height:calc(100vh - 92px);min-height:760px;border:1px solid #ced9e8;border-radius:14px;background:#fff}}@media(max-width:700px){{.title{{width:100%;text-align:center}}.sub{{display:none}}iframe{{height:calc(100vh - 135px);min-height:620px}}}}</style></head><body><nav class="bar"><span class="title">{title}</span><span class="sub">{subtitle}</span><button id="prev">הקודם</button><span>עמוד <input id="page" type="number" min="1" max="{total}" value="1"> מתוך {total}</span><button id="next">הבא</button><a id="open" class="link" href="page-1.html" target="_blank">פתח דף מלא</a><a class="link" href="../index.html">כל החוברות</a></nav><div class="frame-wrap"><iframe id="sheet" title="{title} — עמוד 1" src="page-1.html"></iframe></div><script>const total={total};const input=document.getElementById('page'),frame=document.getElementById('sheet'),open=document.getElementById('open');function go(n){{n=Math.max(1,Math.min(total,Number(n)||1));input.value=n;const u=`page-${{n}}.html`;frame.src=u;frame.title=`{title} — עמוד ${{n}}`;open.href=u;history.replaceState(null,'',`#page=${{n}}`);}}document.getElementById('prev').onclick=()=>go(+input.value-1);document.getElementById('next').onclick=()=>go(+input.value+1);input.onchange=()=>go(input.value);const m=location.hash.match(/page=(\d+)/);if(m)go(m[1]);</script></body></html>'''

          (root/'circle'/'index.html').write_text(reader('חוברת המעגל',88,'מעגל ועיגול — מהעמוד הראשון ועד האחרון'),encoding='utf-8')
          (root/'cylinder'/'index.html').write_text(reader('חוברת הגליל',38,'כל דפי הגליל ברצף אחד'),encoding='utf-8')
          (root/'index.html').write_text('''<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>חוברות גאומטריה — מעגל, גליל וחרוט</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:980px;margin:auto;padding:34px 18px}h1{font-size:clamp(28px,5vw,46px);margin:0 0 8px}.lead{color:#52627a;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{display:block;background:#fff;border:1px solid #d6e0ec;border-radius:18px;padding:24px;text-decoration:none;color:inherit}.n{font-size:34px;font-weight:900}.t{font-size:22px;font-weight:800;margin:6px 0}.d{color:#5a6980;line-height:1.5}.badge{display:inline-block;margin-top:14px;border:1px solid #c6d4e5;border-radius:999px;padding:6px 10px;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>חוברות גאומטריה</h1><p class="lead">מקור האמת היחיד ב־razpages: מעגל, גליל וחרוט.</p><div class="grid"><a class="card" href="circle/index.html"><div class="n">88</div><div class="t">מעגל</div><div class="d">מתחיל במושגים הבסיסיים: מעגל לעומת עיגול, וממשיך ברצף עד העמוד האחרון.</div><span class="badge">פתח חוברת</span></a><a class="card" href="cylinder/index.html"><div class="n">38</div><div class="t">גליל</div><div class="d">כל דפי הגליל ברצף אחד.</div><span class="badge">פתח חוברת</span></a><a class="card" href="cone/index.html"><div class="n">46</div><div class="t">חרוט</div><div class="d">חוברת החרוט המלאה וכל נכסי האיור.</div><span class="badge">פתח חוברת</span></a></div></main></body></html>''',encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps({'canonicalRepository':'yanivmizrachiy/razpages','canonicalRoot':'workbooks','sourceOfTruth':True,'workbooks':{'circle':{'title':'מעגל','pages':88,'entry':'workbooks/circle/index.html','firstPage':'workbooks/circle/page-1.html'},'cylinder':{'title':'גליל','pages':38,'entry':'workbooks/cylinder/index.html','firstPage':'workbooks/cylinder/page-1.html'},'cone':{'title':'חרוט','pages':46,'entry':'workbooks/cone/index.html'}}},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('geometry-workbooks.html').write_text('''<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>חוברות גאומטריה</title><meta http-equiv="refresh" content="0;url=workbooks/index.html"><script>location.replace('workbooks/index.html'+location.hash)</script></head><body><a href="workbooks/index.html">מעבר לחוברות הגאומטריה</a></body></html>''',encoding='utf-8')
          PY

      - name: Include workbooks in Pages artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/copy-static-site.mjs'); s=p.read_text(encoding='utf-8')
          old="const dirs = ['styles', 'meta', 'preview', 'pages', 'vendor', 'assets'];"
          new="const dirs = ['styles', 'meta', 'preview', 'pages', 'vendor', 'assets', 'workbooks'];"
          if new not in s:
              if old not in s: raise SystemExit('canonical dirs declaration not found')
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY

      - name: Validate complete sequences
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          nums=lambda d:sorted(int(p.stem.split('-')[1]) for p in Path(d).glob('page-*.html'))
          assert nums('workbooks/circle')==list(range(1,89))
          assert nums('workbooks/cylinder')==list(range(1,39))
          first=Path('workbooks/circle/page-1.html').read_text(encoding='utf-8')
          assert 'מושגים בסיסיים' in first and 'המעגל הוא קו הגבול' in first and 'העיגול הוא התחום' in first
          cone=Path('workbooks/cone/index.html').read_text(encoding='utf-8')
          assert sorted(set(map(int,re.findall(r'data-local-page="(\d+)"',cone))))==list(range(1,47))
          assert Path('workbooks/cone/assets/ayelet-original-cone.png').is_file()
          assert Path('workbooks/visual-assets/cone-3d-upright.svg').is_file()
          print('OK circle=88 cylinder=38 cone=46')
          PY

      - name: Commit migration to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workbooks geometry-workbooks.html scripts/copy-static-site.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: consolidate circle cylinder and cone in razpages"
          git push origin HEAD:agent/consolidate-circle-cylinder-cone
