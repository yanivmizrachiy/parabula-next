name: Ratio Preview Hardening

on:
  push:
    branches:
      - agent/ratio-preview-hardening-20260819
    paths:
      - 'sources/lovable/ratio-workbook/**'
      - 'vendor/fonts/**'
      - '.github/workflows/ratio-preview-hardening.yml'
  pull_request:
    branches:
      - agent/ratio-safe-upgrade-20260818
    paths:
      - 'sources/lovable/ratio-workbook/**'
      - 'vendor/fonts/**'
      - '.github/workflows/ratio-preview-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ratio-preview-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert production repository is not part of this workflow
        shell: bash
        run: |
          test "${GITHUB_REPOSITORY}" = "yanivmizrachiy/razpages"
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          test "$branch" = "agent/ratio-preview-hardening-20260819"
          echo "Preview-only guard OK: no ratio-workbook/main write step exists."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sources/lovable/ratio-workbook/package-lock.json

      - name: Install ratio workbook dependencies
        run: npm ci --prefix sources/lovable/ratio-workbook --legacy-peer-deps

      - name: Install browser verification dependency locally
        run: npm install --no-save --prefix sources/lovable/ratio-workbook playwright@1.61.1

      - name: Install Chromium
        run: npx --prefix sources/lovable/ratio-workbook playwright install --with-deps chromium

      - name: Run TypeScript, structure and semantic guards
        run: npm run quality:check --prefix sources/lovable/ratio-workbook

      - name: Write reviewed content manifest into preview workspace
        run: npm run manifest:write --prefix sources/lovable/ratio-workbook

      - name: Build standalone self-contained preview
        run: npm run preview:build --prefix sources/lovable/ratio-workbook

      - name: Verify A4, numbering, teacher-page exclusion and offline behavior
        run: npm run preview:verify --prefix sources/lovable/ratio-workbook

      - name: Verify preview metadata
        shell: bash
        run: |
          test -s preview/ratio-preview/full-workbook.html
          test -s preview/ratio-preview/audit/audit.json
          test -s preview/ratio-preview/audit/ratio-workbook-preview.pdf
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('preview/ratio-preview/audit/audit.json', 'utf8'));
          if (audit.status !== 'pass') throw new Error(`Preview audit failed: ${JSON.stringify(audit.failures)}`);
          if (audit.teacherPages !== 0) throw new Error(`Expected 0 teacher pages, got ${audit.teacherPages}`);
          if (audit.firstStudentPage !== 1) throw new Error(`Expected first page 1, got ${audit.firstStudentPage}`);
          if (audit.semanticPages !== 55) throw new Error(`Expected 55 student semantic pages, got ${audit.semanticPages}`);
          console.log(JSON.stringify({
            status: audit.status,
            semanticPages: audit.semanticPages,
            physicalPages: audit.physicalPages,
            teacherPages: audit.teacherPages,
            firstStudentPage: audit.firstStudentPage,
            contentSha256: audit.contentSha256,
          }, null, 2));
          NODE

      - name: Upload complete preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratio-student-preview-${{ github.run_number }}
          path: |
            preview/ratio-preview/full-workbook.html
            preview/ratio-preview/full-workbook-artifact.html
            preview/ratio-preview/audit/audit.json
            preview/ratio-preview/audit/ratio-workbook-preview.pdf
            preview/ratio-preview/audit/pages/*.png
            sources/lovable/ratio-workbook/content-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload one-time verified source migration bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ratio-source-migration-${{ github.run_number }}
          path: |
            sources/lovable/ratio-workbook/src
            sources/lovable/ratio-workbook/scripts/_build-full-workbook.mjs
            sources/lovable/ratio-workbook/scripts/generate-content-manifest.mjs
            sources/lovable/ratio-workbook/scripts/verify-full-workbook.mjs
            sources/lovable/ratio-workbook/package.json
            sources/lovable/ratio-workbook/package-lock.json
            sources/lovable/ratio-workbook/postcss.config.js
            sources/lovable/ratio-workbook/tailwind.config.ts
            sources/lovable/ratio-workbook/tsconfig.app.json
            sources/lovable/ratio-workbook/tsconfig.json
            sources/lovable/ratio-workbook/tsconfig.node.json
            sources/lovable/ratio-workbook/vite.config.ts
            sources/lovable/ratio-workbook/vitest.config.ts
            sources/lovable/ratio-workbook/index.html
            vendor/fonts
          if-no-files-found: error
          retention-days: 7
