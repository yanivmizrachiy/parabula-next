name: Repository Health

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run verify
        run: npm run verify

      - name: Run recovery audit
        run: node scripts/recovery-audit.mjs

      - name: Run single rules source check
        run: npm run rules:check

      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: repository-health-audits
          path: |
            meta/audit/recovery-audit.json
