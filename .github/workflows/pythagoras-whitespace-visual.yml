name: Pythagoras whitespace visual diagnostics

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture flagged pages
        shell: bash
        run: |
          mkdir -p meta/audit/pythagoras-whitespace-screens
          PORT=5187 node preview/server.mjs > /tmp/preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:5187/preview >/dev/null && break
            sleep 0.5
          done
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const pages = [638,640,642,652,643,644,645,646,653,648,650,12,13,14,15,16,376,377];
          const browser = await chromium.launch();
          const p = await browser.newPage({ viewport: { width: 1000, height: 1400 }, deviceScaleFactor: 1 });
          for (const n of pages) {
            await p.goto(`http://127.0.0.1:5187/${encodeURIComponent(`עמוד-${n}.html`)}`, { waitUntil: 'networkidle' });
            await p.locator('.preview-nav').evaluate((el) => { el.style.display = 'none'; });
            await p.locator('main.a4-page').screenshot({ path: `meta/audit/pythagoras-whitespace-screens/page-${n}.png` });
          }
          await browser.close();
          NODE
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pythagoras-whitespace-screens
          path: meta/audit/pythagoras-whitespace-screens
          if-no-files-found: error
          retention-days: 2
