name: Pythagoras foundations targeted A4 visual gate

on:
  push:
    branches:
      - gpt/pythagoras-foundations-v1
    paths:
      - .github/workflows/pythagoras-foundations-visual-gate.yml
      - styles/pages/עמוד-634.css
      - styles/pages/עמוד-635.css
      - styles/pages/עמוד-636.css
      - styles/pages/עמוד-637.css
      - styles/pages/עמוד-638.css

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Limit audit registry to Pythagoras foundations
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p='meta/topics.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); for (const t of m.topics) t.pages=(t.pages||[]).filter(x=>x.number>=634&&x.number<=650); fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');"

      - name: Run canonical A4 visual audit on 17 foundations
        run: npm run audit:a4:visual

      - name: Upload screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pythagoras-foundations-a4-visual
          path: STATE/reports/a4-visual-audit/
          if-no-files-found: error
