name: Strict Preview Cleanup

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run strict preview cleanup
        run: node scripts/strict-preview-cleanup.mjs
      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/app.html preview/README.md preview/APP_CONTRACT.md PROJECT_RULES.md || true
          git diff --cached --quiet || (git commit -m "automation: strict preview cleanup [skip ci]" && git push)
