name: System State Generation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate machine-readable system state
        run: node scripts/generate-system-state-auto.mjs

      - name: Upload generated system state
        uses: actions/upload-artifact@v4
        with:
          name: generated-system-state
          path: meta/audit/generated-system-state.json
