name: Equations App Validation

on:
  push:
    branches: ["main"]
    paths:
      - "preview/equations.html"
      - "preview/equations.css"
      - "preview/equations.js"
      - "preview/print.html"
      - "preview/print.css"
      - "preview/print.js"
      - "meta/topics.json"
      - "styles/pages/עמוד-*.css"
      - "scripts/validate-equations-app.mjs"
      - "scripts/validate-equations-design-pass-strict.mjs"
      - "scripts/validate-equations-print-scope.mjs"
      - "package.json"
      - ".github/workflows/equations-app-validation.yml"
  pull_request:
    paths:
      - "preview/equations.html"
      - "preview/equations.css"
      - "preview/equations.js"
      - "preview/print.html"
      - "preview/print.css"
      - "preview/print.js"
      - "meta/topics.json"
      - "styles/pages/עמוד-*.css"
      - "scripts/validate-equations-app.mjs"
      - "scripts/validate-equations-design-pass-strict.mjs"
      - "scripts/validate-equations-print-scope.mjs"
      - "package.json"
      - ".github/workflows/equations-app-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-equations-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate dedicated equations app
        run: npm run validate:equations

      - name: Validate strict equations design pass
        run: npm run validate:equations:strict

      - name: Validate equations-only print scope
        run: npm run validate:equations:print-scope

      - name: Validate access layer
        run: npm run validate:access
