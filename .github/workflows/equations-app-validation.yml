name: Equations App Validation

on:
  push:
    branches:
      - "main"
      - "test/open-full-all-98-pages-20260710"
    paths:
      - "CLAUDE.md"
      - "preview/equations.html"
      - "preview/equations.css"
      - "preview/equations.js"
      - "preview/print.html"
      - "preview/print.css"
      - "preview/print.js"
      - "preview/topics.html"
      - "preview/topics.css"
      - "preview/topics.js"
      - "meta/topics.json"
      - "styles/topics/equations.css"
      - "styles/pages/עמוד-*.css"
      - "עמוד-*.html"
      - "pages/משוואות/assets/page-*.svg"
      - "scripts/validate-equations-app.mjs"
      - "scripts/validate-equations-design-pass-strict.mjs"
      - "scripts/validate-equations-print-scope.mjs"
      - "scripts/validate-equations-pilot-page-1.mjs"
      - "scripts/validate-equations-suite.mjs"
      - "package.json"
      - ".github/workflows/equations-app-validation.yml"
  pull_request:
    paths:
      - "CLAUDE.md"
      - "preview/equations.html"
      - "preview/equations.css"
      - "preview/equations.js"
      - "preview/print.html"
      - "preview/print.css"
      - "preview/print.js"
      - "preview/topics.html"
      - "preview/topics.css"
      - "preview/topics.js"
      - "meta/topics.json"
      - "styles/topics/equations.css"
      - "styles/pages/עמוד-*.css"
      - "עמוד-*.html"
      - "pages/משוואות/assets/page-*.svg"
      - "scripts/validate-equations-app.mjs"
      - "scripts/validate-equations-design-pass-strict.mjs"
      - "scripts/validate-equations-print-scope.mjs"
      - "scripts/validate-equations-pilot-page-1.mjs"
      - "scripts/validate-equations-suite.mjs"
      - ".github/workflows/equations-app-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-canonical-rules:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test/open-full-all-98-pages-20260710' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/open-full-all-98-pages-20260710
          fetch-depth: 0

      - name: Repair and commit CLAUDE.md
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CLAUDE.md')
          text = path.read_text(encoding='utf-8')
          old = '''`meta/topics.json` הוא מקור האמת היחיד למבנה התוכן. לאחר שינויו:

1. מריצים ``.
2. מריצים ``.
3. מריצים בדיקות מלאות.
4. מאמתים שמספרי הנושאים והדפים זהים בנייח ובנייד.
'''
          new = '''`meta/topics.json` הוא מקור האמת היחיד למבנה התוכן. לאחר שינויו:

1. מריצים `npm run validate:meta`.
2. מריצים `npm run validate:schema`.
3. מריצים `npm run validate:mobile` ואת שערי הדפדפן הרלוונטיים.
4. מאמתים שמספרי הנושאים והדפים זהים בנייח ובנייד.
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one empty-command block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md
          git commit -m "docs: restore canonical metadata validation commands"
          git push origin HEAD:test/open-full-all-98-pages-20260710

  validate-equations-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run complete equations validation suite
        run: npm run validate:equations:all
