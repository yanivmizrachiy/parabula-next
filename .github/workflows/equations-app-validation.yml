name: Equations App Validation

on:
  push:
    branches: ["main"]
    paths:
      - "preview/equations.html"
      - "preview/equations.css"
      - "preview/equations.js"
      - "preview/print.html"
      - "preview/print.css"
      - "preview/print.js"
      - "preview/topics.html"
      - "preview/topics.css"
      - "preview/topics.js"
      - "meta/topics.json"
      - "styles/topics/equations.css"
      - "styles/pages/עמוד-*.css"
      - "עמוד-*.html"
      - "pages/משוואות/assets/page-*.svg"
      - "scripts/validate-equations-suite.mjs"
      - "package.json"
      - ".github/workflows/equations-app-validation.yml"
  pull_request:
    paths:
      - "preview/equations.html"
      - "preview/equations.css"
      - "preview/equations.js"
      - "preview/print.html"
      - "preview/print.css"
      - "preview/print.js"
      - "preview/topics.html"
      - "preview/topics.css"
      - "preview/topics.js"
      - "meta/topics.json"
      - "styles/topics/equations.css"
      - "styles/pages/עמוד-*.css"
      - "עמוד-*.html"
      - "pages/משוואות/assets/page-*.svg"
      - "scripts/validate-equations-suite.mjs"
      - ".github/workflows/equations-app-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-equations-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run complete equations validation suite
        run: npm run validate:equations:all
