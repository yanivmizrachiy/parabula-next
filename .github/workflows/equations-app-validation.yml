name: Equations App Validation

on:
  push:
    branches: ["main"]
    paths:
      - "preview/equations.html"
      - "preview/equations.css"
      - "preview/equations.js"
      - "preview/print.html"
      - "preview/print.css"
      - "preview/print.js"
      - "preview/topics.html"
      - "preview/topics.css"
      - "preview/topics.js"
      - "meta/topics.json"
      - "pages/משוואות/assets/page-*.svg"
      - "scripts/validate-equations-suite.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/equations-app-validation.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "preview/equations.html"
      - "preview/equations.css"
      - "preview/equations.js"
      - "preview/print.html"
      - "preview/print.css"
      - "preview/print.js"
      - "preview/topics.html"
      - "preview/topics.css"
      - "preview/topics.js"
      - "meta/topics.json"
      - "pages/משוואות/assets/page-*.svg"
      - "scripts/validate-equations-suite.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/equations-app-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-equations-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete equations application validation suite
        run: npm run validate:equations:all
