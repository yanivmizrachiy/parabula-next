name: Audit Equations SVG Captions

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/audit-equations-svg-captions.mjs"
      - ".github/workflows/audit-equations-svg-captions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-equations-svg-captions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG caption audit
        run: node scripts/audit-equations-svg-captions.mjs

      # פלט audit אינו נשמר בגיט (CLAUDE.md §6) — הוא נשמר כארטיפקט של הריצה
      - name: Upload SVG caption audit report
        uses: actions/upload-artifact@v4
        with:
          name: equations-svg-captions
          path: meta/audit/equations-svg-captions.md
          if-no-files-found: error
