name: Balance ratio answer space

on:
  push:
    branches:
      - agent/ratio-max-quality-v1
    paths:
      - .github/workflows/ratio-answer-space-balance.yml

permissions:
  contents: write

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified balance patch
        run: |
          python .github/scripts/ratio-answer-space-balance.py
          sed -i 's/שבבסיסו/שבסיסו/' sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter3Corrections.tsx

      - name: Verify exact scope
        run: |
          grep -Fq 'className="ratio-page-11"' sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter2Corrections.tsx
          grep -Fq 'className="ratio-page-18"' sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter3Corrections.tsx
          grep -Fq 'className="ratio-page-22"' sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter3Corrections.tsx
          grep -Fq 'שבסיסו 7 וגובהו 6' sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter3Corrections.tsx
          git rm .github/workflows/ratio-answer-space-balance.yml
          git rm .github/scripts/ratio-answer-space-balance.py
          git add sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter2Corrections.tsx
          git add sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter3Corrections.tsx
          test "$(git diff --cached --name-only | wc -l)" -eq 4

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ratio): balance answer space on dense pages'
          git push origin HEAD:agent/ratio-max-quality-v1
