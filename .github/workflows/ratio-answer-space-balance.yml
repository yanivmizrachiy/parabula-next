name: Balance ratio answer space

on:
  push:
    branches:
      - agent/ratio-max-quality-v1
    paths:
      - '.github/workflows/ratio-answer-space-balance.yml'

permissions:
  contents: write

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Balance dense-page response space
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(path, start_marker, end_marker, replacement):
              text = path.read_text(encoding='utf-8')
              if text.count(start_marker) != 1 or text.count(end_marker) != 1:
                  raise SystemExit(f'{path}: marker count mismatch')
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              path.write_text(text[:start] + replacement.rstrip() + '\n\n' + text[end:], encoding='utf-8')

          chapter2 = Path('sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter2Corrections.tsx')
          text = chapter2.read_text(encoding='utf-8')
          old_import = "  Frac,\n  PageLayout,\n  QSep,\n  Question,\n  SubQuestion,\n} from '../pages/PageLayout';"
          new_import = "  FinalAnswer,\n  Frac,\n  PageLayout,\n  QSep,\n  Question,\n  RatioAnswer,\n  SubQuestion,\n  WorkArea,\n} from '../pages/PageLayout';"
          if text.count(old_import) != 1:
              raise SystemExit('Chapter2Corrections import anchor mismatch')
          chapter2.write_text(text.replace(old_import, new_import), encoding='utf-8')

          replace_between(
              chapter2,
              'export function RatioPage11() {',
              'export function RatioPage13() {',
              r'''export function RatioPage11() {
  return (
    <PageLayout pageNumber={11} chapter={CH} className="ratio-page-11">
      <Question>
        <p>ביום קיץ הגיעו לבית הספר יותר מ־65 תלמידים. היחס בין מספר התלמידים שנעלו נעלי ספורט למספר התלמידים שנעלו סנדלים היה 5 : 3.</p>
        <SubQuestion label="א."><p>הסבירו מדוע לא ייתכן שהגיעו 83 תלמידים.</p></SubQuestion>
        <SubQuestion label="ב."><p>כתבו אפשרות אחת למספר התלמידים שהגיעו.</p></SubQuestion>
        <div className="response-set ratio-page-11-response ratio-page-11-response--explanation">
          <WorkArea label="א. נימוק:" lines={2} />
          <FinalAnswer label="ב." />
        </div>
      </Question>

      <QSep />

      <Question>
        <p>מחירם של סלט וכריך יחד הוא 40 ש״ח. היחס בין מחיר הסלט למחיר הכריך הוא 4 : 1.</p>
        <SubQuestion label="א."><p>חשבו את מחיר הסלט ואת מחיר הכריך.</p></SubQuestion>
        <SubQuestion label="ב."><p>דניאל קנה סלט וארבעה כריכים. מהו היחס בין מחיר הסלט לסכום הכולל ששילם?</p></SubQuestion>
        <div className="response-set ratio-page-11-response">
          <WorkArea lines={1} />
          <FinalAnswer label="א. סלט:" unit="ש״ח" />
          <FinalAnswer label="א. כריך:" unit="ש״ח" />
          <RatioAnswer label="ב." />
        </div>
      </Question>

      <QSep />

      <Question>
        <p>יוסי שילם במוסך 2,240 ש״ח. היחס בין שכר העבודה למחיר חלקי החילוף הוא 5 : 2.</p>
        <SubQuestion label="א."><p>מה היה שכר העבודה?</p></SubQuestion>
        <SubQuestion label="ב."><p>מה היה מחיר חלקי החילוף?</p></SubQuestion>
        <div className="response-set ratio-page-11-response">
          <WorkArea lines={1} />
          <FinalAnswer label="א." unit="ש״ח" />
          <FinalAnswer label="ב." unit="ש״ח" />
        </div>
      </Question>

      <QSep />

      <Question>
        <p>בכיתה ח׳1 יש 30 תלמידים ובכיתה ח׳2 יש 32 תלמידים. מחיר הטיול <strong>לכל תלמיד</strong> היה זהה, והעלות הכוללת לשתי הכיתות הייתה 2,480 ש״ח.</p>
        <SubQuestion label="א."><p>מה היה המחיר לתלמיד?</p></SubQuestion>
        <SubQuestion label="ב."><p>מה הייתה עלות הטיול לכל אחת מהכיתות?</p></SubQuestion>
        <div className="response-set ratio-page-11-response">
          <WorkArea lines={1} />
          <FinalAnswer label="א." unit="ש״ח" />
          <FinalAnswer label="ב. ח׳1:" unit="ש״ח" />
          <FinalAnswer label="ב. ח׳2:" unit="ש״ח" />
        </div>
      </Question>

      <QSep />

      <Question>
        <p>בחנות תבלינים מכינים תערובת קינמון ווניל ביחס קבוע. הגרף מתאר את הקשר בין הכמויות.</p>
        <SpiceGraph />
        <SubQuestion label="א."><p>מהו היחס בין כמות הקינמון לכמות הווניל?</p></SubQuestion>
        <SubQuestion label="ב."><p>כמה גרם מכל תבלין יש בתערובת שמשקלה 560 גרם?</p></SubQuestion>
        <div className="response-set ratio-page-11-response">
          <WorkArea lines={1} />
          <RatioAnswer label="א." />
          <FinalAnswer label="ב. קינמון:" unit="גרם" />
          <FinalAnswer label="ב. וניל:" unit="גרם" />
        </div>
      </Question>
    </PageLayout>
  );
}'''
          )

          chapter3 = Path('sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter3Corrections.tsx')
          text = chapter3.read_text(encoding='utf-8')
          old_import = "  QSep,\n  Question,\n  SubQuestion,\n  WorksheetTable,"
          new_import = "  QSep,\n  Question,\n  RatioAnswer,\n  SubQuestion,\n  WorksheetTable,"
          if text.count(old_import) != 1:
              raise SystemExit('Chapter3Corrections import anchor mismatch')
          chapter3.write_text(text.replace(old_import, new_import), encoding='utf-8')

          replace_between(
              chapter3,
              'export function RatioPage18() {',
              'export function RatioPage19() {',
              r'''export function RatioPage18() {
  return (
    <PageLayout pageNumber={18} chapter={CH} className="ratio-page-18">
      <Question>
        <p>בדגם הריצוף יש 6 אריחים לבנים ו־4 אריחים כחולים. מהו היחס בין מספר האריחים הלבנים למספר האריחים הכחולים?</p>
        <TilingModel />
        <div className="options-row"><span>א. 3 : 2</span><span>ב. 3 : 5</span><span>ג. 2 : 5</span><span>ד. 2 : 3</span></div>
      </Question>

      <QSep />

      <Question>
        <p>במחרוזת יש 4 חרוזים אדומים ו־6 חרוזים כחולים.</p>
        <div className="svg-center svg-center--tight"><NecklaceModel red={4} blue={6} /></div>
        <SubQuestion label="א."><p>מהו היחס בין האדומים לכחולים? <RatioAnswer inline /></p></SubQuestion>
        <SubQuestion label="ב."><p>באיזו מחרוזת נשמר אותו יחס? <Blank /></p></SubQuestion>
        <div className="svg-figure-row">
          <div className="svg-cell"><span>1</span><NecklaceModel red={6} blue={9} /></div>
          <div className="svg-cell"><span>2</span><NecklaceModel red={6} blue={8} /></div>
          <div className="svg-cell"><span>3</span><NecklaceModel red={8} blue={10} /></div>
        </div>
        <SubQuestion label="ג."><p>במחרוזת של רותם 16 חרוזים אדומים באותו יחס. כמה חרוזים כחולים יש?</p></SubQuestion>
      </Question>

      <QSep />

      <Question>
        <p>במשפחת ארז 5 בנות ובן אחד.</p>
        <SubQuestion label="א."><p>מהו היחס בין מספר הבנות למספר הילדים? <RatioAnswer inline /></p></SubQuestion>
        <SubQuestion label="ב."><p>מהו היחס בין מספר הבנים למספר הילדים? <RatioAnswer inline /></p></SubQuestion>
        <SubQuestion label="ג."><p>איזה חלק מהילדים הן בנות? <Blank /></p></SubQuestion>
      </Question>

      <QSep />

      <Question>
        <p>צמצמו: 8 : 24, 20 : 100, 48 : 6, 18 : 3.</p>
        <AnswerLine label="תשובות:" />
      </Question>

      <QSep />

      <Question>
        <p>באוטובוס 8 מבוגרים ו־6 ילדים. כתבו יחס מצומצם.</p>
        <SubQuestion label="א."><p>מבוגרים : ילדים <RatioAnswer inline /></p></SubQuestion>
        <SubQuestion label="ב."><p>ילדים : מבוגרים <RatioAnswer inline /></p></SubQuestion>
        <SubQuestion label="ג."><p>ילדים : כלל הנוסעים <RatioAnswer inline /></p></SubQuestion>
      </Question>

      <QSep />

      <Question>
        <p>התרשים מתאר את התפלגות האוכלוסייה בשנים 1955 ו־2006.</p>
        <PopulationChart />
        <WorksheetTable
          headers={['לא נכונה', 'נכונה', 'טענה']}
          rows={[
            [<Checkbox />, <Checkbox />, 'אחוז הבוגרים בשנת 1955 היה 60%.'],
            [<Checkbox />, <Checkbox />, 'אחוז הקשישים גדל פי 2.'],
            [<Checkbox />, <Checkbox />, 'בשנת 2006 היחס בין צעירים לקשישים היה 14 : 5.'],
          ]}
        />
      </Question>
    </PageLayout>
  );
}'''
          )

          replace_between(
              chapter3,
              'export function RatioPage22() {',
              'function AngleCard(',
              r'''export function RatioPage22() {
  return (
    <PageLayout pageNumber={22} chapter={CH} className="ratio-page-22">
      <Question>
        <p>במלבן שאורכו 16 ורוחבו 2 מסורטט משולש שבסיסו 6 וגובהו 2. חשבו את היחס בין שטח המשולש לשטח המלבן.</p>
        <SubQuestion label="א."><p>שטח המשולש: <Blank /></p></SubQuestion>
        <SubQuestion label="ב."><p>שטח המלבן: <Blank /></p></SubQuestion>
        <SubQuestion label="ג."><p>היחס המצומצם: <Blank /></p></SubQuestion>
      </Question>

      <QSep />

      <Question>
        <p>במלבן שאורכו 14 ורוחבו 6 מסורטט משולש שבסיסו 7 וגובהו 6.</p>
        <SubQuestion label="א."><p>מהו היחס בין שטח המשולש לשטח המלבן? <RatioAnswer inline /></p></SubQuestion>
        <SubQuestion label="ב."><p>מהו היחס בין שטח המשולש לשטח הלבן שנותר? <RatioAnswer inline /></p></SubQuestion>
      </Question>

      <QSep />

      <Question>
        <p>החלון הוא ריבוע שצלעו 8 ס״מ. הריבוע המנוקד במרכז הוא בעל צלע 4 ס״מ, ובכל פינה ריבוע אפור שצלעו 2 ס״מ.</p>
        <WindowModel />
        <div className="options-grid-2col gap-sm">
          <span>א. מנוקד : חלון כולו = <Blank /></span>
          <span>ב. מנוקד : אפור = <Blank /></span>
          <span>ג. היקף מנוקד : היקף חלון = <Blank /></span>
          <span>ד. לבן : כל השטח שאינו מנוקד = <Blank /></span>
        </div>
      </Question>

      <QSep />

      <Question>
        <p>במלבן ABCD: ‏AB=12,‏ AD=8, והנקודה E על AB כך ש־AE=8 ו־EB=4.</p>
        <RectangleEModel />
        <SubQuestion label="א."><p>מהו היחס בין שטח △BCE לשטח △CDE? <RatioAnswer inline /></p></SubQuestion>
        <SubQuestion label="ב."><p>מהו היחס בין שטח המלבן לשטח △CDE? <RatioAnswer inline /></p></SubQuestion>
        <SubQuestion label="ג."><p>מהו היחס בין שטח המרובע AECD לשטח △BCE? <RatioAnswer inline /></p></SubQuestion>
      </Question>
    </PageLayout>
  );
}'''
          )
          PY

      - name: Verify exact scope and self-remove
        shell: bash
        run: |
          grep -Fq 'className="ratio-page-11"' sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter2Corrections.tsx
          grep -Fq 'className="ratio-page-18"' sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter3Corrections.tsx
          grep -Fq 'className="ratio-page-22"' sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter3Corrections.tsx
          git rm -f .github/workflows/ratio-answer-space-balance.yml
          git add \
            sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter2Corrections.tsx \
            sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter3Corrections.tsx
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/ratio-answer-space-balance.yml \
            sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter2Corrections.tsx \
            sources/lovable/ratio-workbook/src/components/worksheet/corrected/Chapter3Corrections.tsx | sort)"
          if [ "$staged" != "$expected" ]; then
            echo 'Unexpected staged files; refusing to commit.'
            printf 'Staged:\n%s\n' "$staged"
            exit 1
          fi

      - name: Commit balanced response space
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ratio): balance answer space on dense pages'
          git push origin HEAD:agent/ratio-max-quality-v1
