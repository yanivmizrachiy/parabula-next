name: Apply ratio source intro

on:
  push:
    branches:
      - feat/ratio-source-intro
    paths:
      - 'scripts/apply-ratio-source-intro.mjs'
      - '.github/workflows/apply-ratio-source-intro.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-ratio-source-intro.mjs'
      - '.github/workflows/apply-ratio-source-intro.yml'

permissions:
  contents: write

concurrency:
  group: apply-ratio-source-intro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'yanivmizrachiy/razpages'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ratio-source-intro
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source task and attribution migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-ratio-source-intro.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('credit line 2 must follow credit line 1', 'credit line 2 must follow line 1')
          old = """const previousTopic = topics.topics[topicIndex - 1] ?? null;
          const previousBookPage = previousTopic?.pages?.at(-1)?.number ?? null;
          const originalFirstRatioPage = ratioTopic.pages?.[0]?.number;
          if (!originalFirstRatioPage) throw new Error('Ratio topic has no existing pages.');"""
          new = r"""const originalFirstRatioPage = ratioTopic.pages?.[0]?.number;
          if (!originalFirstRatioPage) throw new Error('Ratio topic has no existing pages.');
          const firstRatioHtml = read(`עמוד-${originalFirstRatioPage}.html`);
          const previousMatch = firstRatioHtml.match(/href="עמוד-(\d+)\.html">הקודם<\/a>/);
          const previousBookPage = previousMatch ? Number(previousMatch[1]) : null;"""
          if old not in text:
              raise SystemExit('migration neighbor anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check scripts/apply-ratio-source-intro.mjs
          node scripts/apply-ratio-source-intro.mjs

          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/import-ratio-workbook.mjs')
          text = path.read_text(encoding='utf-8')
          old = """const previousTopic = topicList[priorRatioIndex - 1];
          const nextTopic = topicList[priorRatioIndex + 1];
          const previousTopicPages = previousTopic?.pages || [];
          const nextTopicPages = nextTopic?.pages || [];
          const previousBookPage = previousTopicPages.at(-1)?.number ?? null;
          const nextBookPage = nextTopicPages[0]?.number ?? null;"""
          new = r"""const firstSourceHtml = existingText(`עמוד-${startPage}.html`) ?? '';
          const lastSourceHtml = existingText(`עמוד-${endPage}.html`) ?? '';
          const previousMatch = firstSourceHtml.match(/href="עמוד-(\d+)\.html">הקודם<\/a>/);
          const nextMatch = lastSourceHtml.match(/href="עמוד-(\d+)\.html">הבא<\/a>/);
          const previousBookPage = previousMatch ? Number(previousMatch[1]) : null;
          const nextBookPage = nextMatch ? Number(nextMatch[1]) : null;"""
          if old not in text:
              raise SystemExit('importer neighbor anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          node --check scripts/import-ratio-workbook.mjs
          node scripts/import-ratio-workbook.mjs --write
          node scripts/build-curriculum.mjs

      - name: Install dependencies
        run: npm ci

      - name: Diagnose ratio metadata
        id: intro_meta
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const topics = JSON.parse(fs.readFileSync('meta/topics.json', 'utf8'));
          const ratio = topics.topics.find((topic) => topic.name === 'יחס');
          assert.ok(ratio, 'Ratio topic is missing');
          assert.equal(ratio.pages.length, 49, 'Ratio page count');
          assert.equal(ratio.count, 49, 'Ratio count field');
          assert.equal(ratio.pages[1].number, 272, 'Existing first ratio page should be second');
          assert.ok(fs.existsSync(ratio.pages[0].file), 'Intro file must exist');
          NODE

      - name: Diagnose ratio source content
        id: intro_content
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const topics = JSON.parse(fs.readFileSync('meta/topics.json', 'utf8'));
          const ratio = topics.topics.find((topic) => topic.name === 'יחס');
          const html = fs.readFileSync(ratio.pages[0].file, 'utf8');
          assert.match(html, /data-ratio-source-intro="tanami-krispin"/);
          assert.ok(html.includes('כתבו את היחס בין מספר העיגולים השחורים לאדומים במחרוזות הבאות:'));
          assert.match(html, /יחס — עמוד 1 \/ 49/);
          NODE

      - name: Diagnose ratio source credits
        id: intro_credits
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const topics = JSON.parse(fs.readFileSync('meta/topics.json', 'utf8'));
          const ratio = topics.topics.find((topic) => topic.name === 'יחס');
          const html = fs.readFileSync(ratio.pages[0].file, 'utf8');
          assert.ok(html.includes('הקובץ נכתב ע״י ד״ר יחיאל תנעמי ואיילת קריספין'));
          assert.ok(html.includes('איילת קריספין — מתכללת את תחום המתמטיקה בעל יסודי בעיר ירושלים ובמחוז ירושלים'));
          assert.ok(html.includes('מדריכה מחוזית למתמטיקה על יסודי מחוז ירושלים · דוקטורנטית בחינוך מתמטי באוניברסיטה העברית'));
          assert.ok(!html.includes('יניב רז - מדריך מחוזי חט"ב בעיר ירושלים'));
          NODE

      - name: Diagnose ratio page two shift
        id: intro_shift
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const topics = JSON.parse(fs.readFileSync('meta/topics.json', 'utf8'));
          const ratio = topics.topics.find((topic) => topic.name === 'יחס');
          const page2 = fs.readFileSync('עמוד-272.html', 'utf8');
          assert.match(page2, /יחס — עמוד 2 \/ 49/);
          assert.match(page2, /data-local-page="2"/);
          assert.ok(page2.includes(`href="${ratio.pages[0].file}"`), 'Page 2 backlink');
          NODE

      - name: Diagnose ratio importer preservation
        id: intro_importer
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const importer = fs.readFileSync('scripts/import-ratio-workbook.mjs', 'utf8');
          assert.match(importer, /preservedIntroPages/);
          assert.match(importer, /data-ratio-source-intro="tanami-krispin"/);
          assert.match(importer, /data-local-page/);
          NODE

      - name: Test page credit
        id: credit
        continue-on-error: true
        run: node --test tests/contracts/page-credit.test.mjs

      - name: Test ratio import safety
        id: safety
        continue-on-error: true
        run: node --test tests/contracts/ratio-import-safety.test.mjs

      - name: Test ratio source intro
        id: intro
        continue-on-error: true
        run: node --test tests/contracts/ratio-source-intro.test.mjs

      - name: Check ratio importer idempotence
        id: importcheck
        continue-on-error: true
        run: npm run ratio:import:check

      - name: Validate schema
        id: schema
        continue-on-error: true
        run: npm run validate:schema

      - name: Check curriculum build
        id: curriculumcheck
        continue-on-error: true
        run: npm run curriculum:check

      - name: Validate curriculum
        id: curriculum
        continue-on-error: true
        run: npm run validate:curriculum

      - name: Check canonical rules
        id: rules
        continue-on-error: true
        run: npm run rules:check

      - name: Validate HTML
        id: html
        continue-on-error: true
        run: npm run validate:html

      - name: Gate ratio metadata
        if: always() && steps.intro_meta.outcome != 'success'
        run: exit 1

      - name: Gate ratio source content
        if: always() && steps.intro_content.outcome != 'success'
        run: exit 1

      - name: Gate ratio source credits
        if: always() && steps.intro_credits.outcome != 'success'
        run: exit 1

      - name: Gate ratio page two shift
        if: always() && steps.intro_shift.outcome != 'success'
        run: exit 1

      - name: Gate ratio importer preservation
        if: always() && steps.intro_importer.outcome != 'success'
        run: exit 1

      - name: Gate page credit
        if: always() && steps.credit.outcome != 'success'
        run: exit 1

      - name: Gate ratio import safety
        if: always() && steps.safety.outcome != 'success'
        run: exit 1

      - name: Gate ratio source intro
        if: always() && steps.intro.outcome != 'success'
        run: exit 1

      - name: Gate ratio importer idempotence
        if: always() && steps.importcheck.outcome != 'success'
        run: exit 1

      - name: Gate schema validation
        if: always() && steps.schema.outcome != 'success'
        run: exit 1

      - name: Gate curriculum build
        if: always() && steps.curriculumcheck.outcome != 'success'
        run: exit 1

      - name: Gate curriculum validation
        if: always() && steps.curriculum.outcome != 'success'
        run: exit 1

      - name: Gate canonical rules
        if: always() && steps.rules.outcome != 'success'
        run: exit 1

      - name: Gate HTML validation
        if: always() && steps.html.outcome != 'success'
        run: exit 1

      - name: Commit focused migration
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm scripts/apply-ratio-source-intro.mjs .github/workflows/apply-ratio-source-intro.yml
          git add -u

          while IFS= read -r -d '' file; do
            git add -- "$file"
          done < <(git ls-files --others --exclude-standard -z)

          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi

          git commit -m "feat: add source ratio task as workbook opener"
          git push origin HEAD:feat/ratio-source-intro
