name: Apply ratio source intro

on:
  push:
    branches:
      - feat/ratio-source-intro
    paths:
      - 'scripts/apply-ratio-source-intro.mjs'
      - '.github/workflows/apply-ratio-source-intro.yml'

permissions:
  contents: write

concurrency:
  group: apply-ratio-source-intro
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source task and attribution migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-ratio-source-intro.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('credit line 2 must follow credit line 1', 'credit line 2 must follow line 1')
          path.write_text(text, encoding='utf-8')
          PY
          node --check scripts/apply-ratio-source-intro.mjs
          node scripts/apply-ratio-source-intro.mjs
          node scripts/import-ratio-workbook.mjs --write
          node scripts/build-curriculum.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify focused contracts
        run: |
          node --test \
            tests/contracts/page-credit.test.mjs \
            tests/contracts/ratio-import-safety.test.mjs \
            tests/contracts/ratio-source-intro.test.mjs
          npm run ratio:import:check
          npm run validate:schema
          npm run curriculum:check
          npm run validate:curriculum
          npm run rules:check
          npm run validate:html

      - name: Commit focused migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm scripts/apply-ratio-source-intro.mjs .github/workflows/apply-ratio-source-intro.yml
          git add -u

          while IFS= read -r -d '' file; do
            git add -- "$file"
          done < <(git ls-files --others --exclude-standard -z)

          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi

          git commit -m "feat: add source ratio task as workbook opener"
          git push origin HEAD:feat/ratio-source-intro
