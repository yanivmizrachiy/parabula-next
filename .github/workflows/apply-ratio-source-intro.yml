name: Apply ratio source intro

on:
  push:
    branches:
      - feat/ratio-source-intro
    paths:
      - 'scripts/apply-ratio-source-intro.mjs'
      - '.github/workflows/apply-ratio-source-intro.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-ratio-source-intro.mjs'
      - '.github/workflows/apply-ratio-source-intro.yml'

permissions:
  contents: write

concurrency:
  group: apply-ratio-source-intro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'yanivmizrachiy/razpages'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ratio-source-intro
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source task and attribution migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-ratio-source-intro.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('credit line 2 must follow credit line 1', 'credit line 2 must follow line 1')
          old = """const previousTopic = topics.topics[topicIndex - 1] ?? null;
          const previousBookPage = previousTopic?.pages?.at(-1)?.number ?? null;
          const originalFirstRatioPage = ratioTopic.pages?.[0]?.number;
          if (!originalFirstRatioPage) throw new Error('Ratio topic has no existing pages.');"""
          new = r"""const originalFirstRatioPage = ratioTopic.pages?.[0]?.number;
          if (!originalFirstRatioPage) throw new Error('Ratio topic has no existing pages.');
          const firstRatioHtml = read(`עמוד-${originalFirstRatioPage}.html`);
          const previousMatch = firstRatioHtml.match(/href="עמוד-(\d+)\.html">הקודם<\/a>/);
          const previousBookPage = previousMatch ? Number(previousMatch[1]) : null;"""
          if old not in text:
              raise SystemExit('migration neighbor anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check scripts/apply-ratio-source-intro.mjs
          node scripts/apply-ratio-source-intro.mjs

          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/import-ratio-workbook.mjs')
          text = path.read_text(encoding='utf-8')
          old = """const previousTopic = topicList[priorRatioIndex - 1];
          const nextTopic = topicList[priorRatioIndex + 1];
          const previousTopicPages = previousTopic?.pages || [];
          const nextTopicPages = nextTopic?.pages || [];
          const previousBookPage = previousTopicPages.at(-1)?.number ?? null;
          const nextBookPage = nextTopicPages[0]?.number ?? null;"""
          new = r"""const firstSourceHtml = existingText(`עמוד-${startPage}.html`) ?? '';
          const lastSourceHtml = existingText(`עמוד-${endPage}.html`) ?? '';
          const previousMatch = firstSourceHtml.match(/href="עמוד-(\d+)\.html">הקודם<\/a>/);
          const nextMatch = lastSourceHtml.match(/href="עמוד-(\d+)\.html">הבא<\/a>/);
          const previousBookPage = previousMatch ? Number(previousMatch[1]) : null;
          const nextBookPage = nextMatch ? Number(nextMatch[1]) : null;"""
          if old not in text:
              raise SystemExit('importer neighbor anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          node --check scripts/import-ratio-workbook.mjs
          node scripts/import-ratio-workbook.mjs --write
          node scripts/build-curriculum.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test page credit
        id: credit
        continue-on-error: true
        run: node --test tests/contracts/page-credit.test.mjs

      - name: Test ratio import safety
        id: safety
        continue-on-error: true
        run: node --test tests/contracts/ratio-import-safety.test.mjs

      - name: Test ratio source intro
        id: intro
        continue-on-error: true
        run: node --test tests/contracts/ratio-source-intro.test.mjs

      - name: Check ratio importer idempotence
        id: importcheck
        continue-on-error: true
        run: npm run ratio:import:check

      - name: Validate schema
        id: schema
        continue-on-error: true
        run: npm run validate:schema

      - name: Check curriculum build
        id: curriculumcheck
        continue-on-error: true
        run: npm run curriculum:check

      - name: Validate curriculum
        id: curriculum
        continue-on-error: true
        run: npm run validate:curriculum

      - name: Check canonical rules
        id: rules
        continue-on-error: true
        run: npm run rules:check

      - name: Validate HTML
        id: html
        continue-on-error: true
        run: npm run validate:html

      - name: Gate page credit
        if: always() && steps.credit.outcome != 'success'
        run: exit 1

      - name: Gate ratio import safety
        if: always() && steps.safety.outcome != 'success'
        run: exit 1

      - name: Gate ratio source intro
        if: always() && steps.intro.outcome != 'success'
        run: exit 1

      - name: Gate ratio importer idempotence
        if: always() && steps.importcheck.outcome != 'success'
        run: exit 1

      - name: Gate schema validation
        if: always() && steps.schema.outcome != 'success'
        run: exit 1

      - name: Gate curriculum build
        if: always() && steps.curriculumcheck.outcome != 'success'
        run: exit 1

      - name: Gate curriculum validation
        if: always() && steps.curriculum.outcome != 'success'
        run: exit 1

      - name: Gate canonical rules
        if: always() && steps.rules.outcome != 'success'
        run: exit 1

      - name: Gate HTML validation
        if: always() && steps.html.outcome != 'success'
        run: exit 1

      - name: Commit focused migration
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm scripts/apply-ratio-source-intro.mjs .github/workflows/apply-ratio-source-intro.yml
          git add -u

          while IFS= read -r -d '' file; do
            git add -- "$file"
          done < <(git ls-files --others --exclude-standard -z)

          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi

          git commit -m "feat: add source ratio task as workbook opener"
          git push origin HEAD:feat/ratio-source-intro
