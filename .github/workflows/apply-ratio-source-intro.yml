name: Apply ratio source intro

on:
  push:
    branches:
      - feat/ratio-source-intro
    paths:
      - 'scripts/apply-ratio-source-intro.mjs'
      - '.github/workflows/apply-ratio-source-intro.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-ratio-source-intro.mjs'
      - '.github/workflows/apply-ratio-source-intro.yml'

permissions:
  contents: write

concurrency:
  group: apply-ratio-source-intro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'yanivmizrachiy/razpages'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ratio-source-intro
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source task and attribution migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-ratio-source-intro.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('credit line 2 must follow credit line 1', 'credit line 2 must follow line 1')
          old = """const previousTopic = topics.topics[topicIndex - 1] ?? null;
          const previousBookPage = previousTopic?.pages?.at(-1)?.number ?? null;
          const originalFirstRatioPage = ratioTopic.pages?.[0]?.number;
          if (!originalFirstRatioPage) throw new Error('Ratio topic has no existing pages.');"""
          new = r"""const originalFirstRatioPage = ratioTopic.pages?.[0]?.number;
          if (!originalFirstRatioPage) throw new Error('Ratio topic has no existing pages.');
          const firstRatioHtml = read(`עמוד-${originalFirstRatioPage}.html`);
          const previousMatch = firstRatioHtml.match(/href="עמוד-(\d+)\.html">הקודם<\/a>/);
          const previousBookPage = previousMatch ? Number(previousMatch[1]) : null;"""
          if old not in text:
              raise SystemExit('migration neighbor anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          node --check scripts/apply-ratio-source-intro.mjs
          node scripts/apply-ratio-source-intro.mjs

          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/import-ratio-workbook.mjs')
          text = path.read_text(encoding='utf-8')
          old = """const previousTopic = topicList[priorRatioIndex - 1];
          const nextTopic = topicList[priorRatioIndex + 1];
          const previousTopicPages = previousTopic?.pages || [];
          const nextTopicPages = nextTopic?.pages || [];
          const previousBookPage = previousTopicPages.at(-1)?.number ?? null;
          const nextBookPage = nextTopicPages[0]?.number ?? null;"""
          new = r"""const firstSourceHtml = existingText(`עמוד-${startPage}.html`) ?? '';
          const lastSourceHtml = existingText(`עמוד-${endPage}.html`) ?? '';
          const previousMatch = firstSourceHtml.match(/href="עמוד-(\d+)\.html">הקודם<\/a>/);
          const nextMatch = lastSourceHtml.match(/href="עמוד-(\d+)\.html">הבא<\/a>/);
          const previousBookPage = previousMatch ? Number(previousMatch[1]) : null;
          const nextBookPage = nextMatch ? Number(nextMatch[1]) : null;"""
          if old not in text:
              raise SystemExit('importer neighbor anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          node --check scripts/import-ratio-workbook.mjs
          node scripts/import-ratio-workbook.mjs --write
          node scripts/build-curriculum.mjs

      - name: Replace generated ratio source contract with stable test
        shell: bash
        run: |
          cat > tests/contracts/ratio-source-intro.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          const topics = JSON.parse(fs.readFileSync('meta/topics.json', 'utf8'));
          const ratio = topics.topics.find((topic) => topic.name === 'יחס');
          const importer = fs.readFileSync('scripts/import-ratio-workbook.mjs', 'utf8');

          test('ratio source task is the first worksheet page', () => {
            assert.ok(ratio, 'Ratio topic is missing');
            assert.equal(ratio.pages.length, 49);
            assert.equal(ratio.count, 49);
            const html = fs.readFileSync(ratio.pages[0].file, 'utf8');
            assert.ok(html.includes('data-ratio-source-intro="tanami-krispin"'));
            assert.ok(html.includes('כתבו את היחס בין מספר העיגולים השחורים לאדומים במחרוזות הבאות:'));
            assert.ok(html.includes('הקובץ נכתב ע״י ד״ר יחיאל תנעמי ואיילת קריספין'));
            assert.ok(html.includes('איילת קריספין — מתכללת את תחום המתמטיקה בעל יסודי בעיר ירושלים ובמחוז ירושלים'));
            assert.ok(html.includes('מדריכה מחוזית למתמטיקה על יסודי מחוז ירושלים · דוקטורנטית בחינוך מתמטי באוניברסיטה העברית'));
            assert.ok(!html.includes('יניב רז - מדריך מחוזי חט"ב בעיר ירושלים'));
            assert.ok(html.includes('יחס — עמוד 1 / 49'));
          });

          test('existing ratio pages shift to local pages 2-49', () => {
            assert.equal(ratio.pages[1].number, 272);
            const page2 = fs.readFileSync('עמוד-272.html', 'utf8');
            assert.ok(page2.includes('יחס — עמוד 2 / 49'));
            assert.ok(page2.includes('data-local-page="2"'));
            assert.ok(page2.includes('href="' + ratio.pages[0].file + '"'));
          });

          test('ratio importer permanently preserves source intro pages', () => {
            assert.ok(importer.includes('preservedIntroPages'));
            assert.ok(importer.includes('data-ratio-source-intro="tanami-krispin"'));
            assert.ok(importer.includes('data-local-page'));
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Verify migration
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/contracts/page-credit.test.mjs \
            tests/contracts/ratio-import-safety.test.mjs \
            tests/contracts/ratio-source-intro.test.mjs
          npm run ratio:import:check
          npm run validate:schema
          npm run curriculum:check
          npm run validate:curriculum
          npm run rules:check
          npm run validate:html
          git diff --check

      - name: Commit focused migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f scripts/apply-ratio-source-intro.mjs .github/workflows/apply-ratio-source-intro.yml
          git add -u
          while IFS= read -r -d '' file; do
            git add -- "$file"
          done < <(git ls-files --others --exclude-standard -z)

          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi

          git commit -m "feat: add source ratio task as workbook opener"
          git push origin HEAD:feat/ratio-source-intro
