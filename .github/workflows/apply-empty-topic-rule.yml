name: Apply empty-topic visibility rule

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apply-rule:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[internal] Apply empty-topic visibility rule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update the canonical rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CLAUDE.md')
          text = path.read_text(encoding='utf-8')
          old = '- **כל צומת קיים גם כשאין לו דפים** ("בית ריק"), כדי שיהיה גלוי מה עוד חסר. צומת ריק מוצג עם מונה 0 ואינו נמחק מהעץ.'
          new = '- **כל צומת נשמר גם כשאין לו דפים** ("בית ריק"), כדי לשמר את תכנית הלימודים ולדעת מה עוד חסר. צומת ריק אינו נמחק מ־`scripts/curriculum-map.mjs` או מ־`meta/topics.json`, אך **אינו מוצג בניווט הציבורי** בקורא המחשב או בקורא הנייד. לוח המונים וכלי בדיקה רשאים להציגו לצורכי בקרה בלבד.'
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Canonical empty-topic rule was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit canonical rule update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md
          git diff --cached --quiet && exit 0
          git commit -m "Hide empty topics from public navigation by rule"
          git push origin HEAD:main
      - name: Close internal trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Canonical rule update completed."
