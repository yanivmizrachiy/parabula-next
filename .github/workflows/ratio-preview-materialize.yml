name: Ratio Preview Materialize

on:
  push:
    branches:
      - agent/ratio-safe-upgrade-20260818
    paths:
      - 'sources/lovable/ratio-workbook/**'
      - 'scripts/export-ratio-workbook-live.mjs'
      - 'scripts/check-ratio-change-scope.mjs'
      - 'tests/contracts/ratio-*.test.mjs'
      - '.github/workflows/ratio-preview-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratio-preview-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout isolated ratio branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect non-ratio repository surface
        run: node scripts/check-ratio-change-scope.mjs origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sources/lovable/ratio-workbook/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install ratio workbook dependencies
        run: npm ci --prefix sources/lovable/ratio-workbook --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ratio source tests
        run: npm run ratio:test

      - name: Verify semantic SSR for all 48 pages
        run: npm run ratio:semantic:all:check

      - name: Verify 48-page content manifest
        run: npm run manifest:check --prefix sources/lovable/ratio-workbook

      - name: Semantic canonical preflight for all 48 pages
        run: node scripts/export-ratio-workbook-live.mjs

      - name: Materialize verified semantic pages
        shell: bash
        run: |
          rm -rf assets/ratio/live
          rm -f styles/topics/ratio-live.css
          node scripts/export-ratio-workbook-live.mjs --write

      - name: Re-check isolated change scope
        run: node scripts/check-ratio-change-scope.mjs origin/main

      - name: Stage ratio preview only
        shell: bash
        run: |
          for n in $(seq 272 319); do
            git add -- "עמוד-${n}.html" "styles/pages/עמוד-${n}.css"
          done
          git add -- styles/topics/ratio-live.css assets/ratio/live
          git rm -f --ignore-unmatch styles/pages/ratio-import.css
          git diff --cached --check
          echo 'Staged ratio preview files:'
          git diff --cached --name-only

      - name: Reject staged files outside ratio preview
        shell: bash
        run: |
          bad=0
          while IFS= read -r file; do
            case "$file" in
              עמוד-27[2-9].html|עמוד-28[0-9].html|עמוד-29[0-9].html|עמוד-30[0-9].html|עמוד-31[0-9].html|styles/pages/עמוד-27[2-9].css|styles/pages/עמוד-28[0-9].css|styles/pages/עמוד-29[0-9].css|styles/pages/עמוד-30[0-9].css|styles/pages/עמוד-31[0-9].css|styles/topics/ratio-live.css|styles/pages/ratio-import.css|assets/ratio/live/*) ;;
              *) echo "FORBIDDEN staged file: $file"; bad=1 ;;
            esac
          done < <(git diff --cached --name-only)
          test "$bad" -eq 0

      - name: Commit verified preview to branch
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo 'Verified preview is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(יחס): materialize verified 48-page semantic preview [skip ci]'
          git push origin HEAD:agent/ratio-safe-upgrade-20260818
