name: Topic Sync

on:
  workflow_dispatch:
  push:
    branches: [graph-slope-pages]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/integrate-graph-slope-once.mjs
      - uses: EndBug/add-and-commit@v9
        with:
          add: 'meta/topics.json catalog.html'
          message: 'fix: sync graph slope metadata'
