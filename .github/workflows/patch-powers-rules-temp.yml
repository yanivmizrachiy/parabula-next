name: Patch canonical powers rules once

on:
  push:
    branches: ["fix/powers-compact-missing-base-20260819"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/powers-compact-missing-base-20260819
      - name: Patch CLAUDE.md canonically
        shell: python
        run: |
          from pathlib import Path
          p = Path('CLAUDE.md')
          s = p.read_text(encoding='utf-8')

          old = '''- **ניצול A4 מאוזן — מלא אך לא צפוף (הוראת יניב, 2026-08-17):** ניצול טוב של עמוד אינו פירושו לדחוס כמה שיותר תרגילים. הדף צריך להרגיש מלא, נוח ומרווח: ציורים אינם מנופחים כדי למלא שטח, אך גם אין אזורים גדולים ומתים ללא תפקיד לימודי. מרווח לבן נשמר כאשר הוא תורם להפרדה, לקריאות או למקום כתיבה. מספר התרגילים, גודל השרטוטים והמרווחים נקבעים יחד לפי שיקול דעת דידקטי; אין לפתור עמוד ריק באמצעות צפיפות, הקטנת גופן או אוסף אקראי של מיני־משימות.'''
          new = '''- **ניצול A4 מאוזן — מלא אך לא צפוף (הוראת יניב, 2026-08-17; הובהר 2026-08-19):** ניצול טוב של עמוד אינו פירושו לדחוס כמה שיותר תרגילים. הדף צריך להרגיש מלא, נוח ומרווח: ציורים אינם מנופחים כדי למלא שטח, אך גם אין אזורים גדולים ומתים ללא תפקיד לימודי. מרווח לבן נשמר כאשר הוא תורם להפרדה, לקריאות או למקום כתיבה. מספר התרגילים, גודל השרטוטים והמרווחים נקבעים יחד לפי שיקול דעת דידקטי. **אסור להקטין גופן תקין מתחת לתקן רק כדי לדחוס**, אבל כאשר ביקורת חיה מראה שגופן מקומי מנופח ביחס לשכבת הנושא — מתקנים אותו לגודל הקנוני המשותף, ואז מנצלים את השטח שהתפנה לתרגול מדורג או למקום פתרון לפי הצורך. אין למלא עמוד באוסף אקראי של מיני־משימות.'''
          if old not in s and new not in s:
              raise SystemExit('canonical A4 paragraph not found')
          s = s.replace(old, new)

          anchor = '''- **חזקות ושורשים לפני פיתגורס:** יש תרגול רחב של ריבועים, שורשים ופתרון \\(x^2=n\\). קודם מספרים עם שורש שלם, ורק אחר כך מספרים עם שורש שאינו שלם. כאשר \\(x\\) מייצג אורך צלע משתמשים בשורש החיובי בלבד; אין ללמד בטעות שהמשוואה האלגברית הכללית \\(x^2=n\\) כוללת רק פתרון חיובי מחוץ להקשר של אורך.'''
          rule = '''\n- **דפי חזקות ושורשים — עריכה מרכזית (הוראת יניב, 2026-08-19):** טיפוגרפיית התרגילים, דוגמת ההסבר, כרטיסי התשובה וכתיב „בסיס חסר” נשלטים קודם כול מ־`styles/topics/pythagoras-power-practice.css`; אין לשכפל ערכי גופן/כרטיס מקומיים בדפי HTML או CSS של עמוד אלא כאשר נדרש שינוי פריסה ייחודי. בתרגיל שבו המספר שלפני החזקה חסר, הכתיב הקנוני הוא **`□² = n`**: תיבת השלמה אחת במקום המספר, אחריה החזקה 2, אחריה סימן שווה ואז הערך. **אין להשתמש ב־`?²` ואין להוסיף תיבת תשובה כפולה מתחת לתרגיל כזה.** בדפי חזקות/שורשים גופן מנופח מוקטן לגודל הקנוני המשותף, והשטח שהתפנה משמש לתרגול נוסף מאותו דפוס או למרחב חישוב אמיתי — לפי מה שהתלמיד צריך לכתוב.\n'''
          if rule.strip() not in s:
              if anchor not in s:
                  raise SystemExit('Pythagoras powers anchor not found')
              s = s.replace(anchor, anchor + rule)

          p.write_text(s, encoding='utf-8')
      - name: Commit canonical rule update
        shell: bash
        run: |
          if git diff --quiet -- CLAUDE.md; then
            echo "No rule change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md
          git commit -m "docs: canonicalize powers page editing rules"
          git push origin HEAD:fix/powers-compact-missing-base-20260819
