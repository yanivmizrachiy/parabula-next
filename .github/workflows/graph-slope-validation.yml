name: Graph Slope Validation

on:
  pull_request:
    paths:
      - 'עמוד-96.html'
      - 'עמוד-97.html'
      - 'עמוד-98.html'
      - 'styles/topics/graph-slope.css'
      - 'styles/pages/page-96-graph-slope.css'
      - 'meta/topics.graph-slope.json'
      - 'scripts/register-graph-slope-topic.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate supplemental topic metadata can be registered
        run: |
          node scripts/register-graph-slope-topic.mjs
          node -e "const m=require('./meta/topics.json'); if(m.totalPages < 98) process.exit(1); console.log(m.totalPages, m.topics.length)"
