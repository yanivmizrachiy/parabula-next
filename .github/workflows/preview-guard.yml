name: Preview Guard

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run preview guard
        run: node scripts/preview-guard.mjs
      - name: Upload preview guard report
        uses: actions/upload-artifact@v4
        with:
          name: preview-guard-report
          path: meta/audit/preview-guard.json
