name: Apply first-quadrant cross-listing

on:
  push:
    branches:
      - fix/first-quadrant-cross-listing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and verify migration
        run: |
          cat scripts/.cross-listing-parts/part-*.b64 | base64 -d > /tmp/apply-cross.mjs
          node --check /tmp/apply-cross.mjs

      - name: Apply source changes
        run: node /tmp/apply-cross.mjs

      - name: Install dependencies
        run: npm ci

      - name: Rebuild curriculum metadata
        run: node scripts/build-curriculum.mjs

      - name: Verify cross-listing and repository contracts
        run: |
          npm test
          npm run curriculum:check
          npm run validate:curriculum
          npm run validate:schema
          npm run validate:mobile
          npm run rules:check
          git diff --check

      - name: Commit verified implementation
        run: |
          rm -rf scripts/.cross-listing-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(מערכת צירים): 34 דפי רביע ראשון עם שיוך משני לזוויות"
          git push origin HEAD
