name: Strict Preview Cleanup Force

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/strict-preview-cleanup.mjs
      - run: git status --short
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/app.html preview/README.md preview/APP_CONTRACT.md PROJECT_RULES.md || true
          git diff --cached --quiet || git commit -m "automation: strict preview cleanup force [skip ci]"
      - run: git push origin HEAD:main
