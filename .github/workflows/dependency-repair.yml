name: Dependency repair proposal

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Capture audit before repair
        run: npm audit --json > npm-audit-before.json || true

      - name: Raise Vite to audited safe baseline
        run: npm install --save-dev --package-lock-only 'vite@^8.2.1'

      - name: Repair remaining vulnerable transitive dependencies
        run: npm audit fix --package-lock-only

      - name: Verify repaired dependency graph is clean
        run: npm audit --audit-level=low

      - name: Install repaired graph exactly
        run: npm ci

      - name: Run full repository CI against repaired graph
        run: npm run ci:all

      - name: Capture audit after repair
        if: always()
        run: npm audit --json > npm-audit-after.json || true

      - name: Commit verified dependency repair to PR branch
        if: success() && github.event_name == 'pull_request'
        shell: bash
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already match the verified repair."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): apply audited dependency repair"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload repaired lockfile and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-repair-proposal
          path: |
            package.json
            package-lock.json
            npm-audit-before.json
            npm-audit-after.json
          if-no-files-found: error
          retention-days: 3
