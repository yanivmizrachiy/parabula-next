name: Cache-bust the logo-free Algebra Z release

on:
  push:
    branches:
      - agent/algebra-z-logo-cache-bust

permissions:
  contents: write

concurrency:
  group: algebra-z-logo-cache-bust
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the focused branch
        uses: actions/checkout@v4
        with:
          ref: agent/algebra-z-logo-cache-bust
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply PDF and JavaScript cache-busting
        run: node scripts/apply-algebra-z-cache-bust.mjs

      - name: Verify JavaScript syntax
        run: node --check algebra-z-workbook.js

      - name: Verify deterministic logo-free PDF assets
        run: npm run algebra-z:assets:strict

      - name: Run strict-local Algebra Z audit
        run: npm run algebra-z:audit:strict

      - name: Run focused Algebra Z contracts
        run: node --test tests/contracts/algebra-z-workbook.test.mjs

      - name: Build production output
        run: npm run build

      - name: Commit only the cache fix and its regression contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- scripts/apply-algebra-z-cache-bust.mjs .github/workflows/algebra-z-logo-cache-bust.yml
          git add -- algebra-z-workbook.js algebra-z-workbook.html tests/contracts/algebra-z-workbook.test.mjs
          git diff --cached --check
          git commit -m "fix: cache-bust the logo-free Algebra Z PDFs"
          git push origin HEAD:agent/algebra-z-logo-cache-bust
