name: One-time clean canonical mobile architecture

on:
  push:
    branches:
      - test/mobile-production-browser-gate-20260710

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/mobile-production-browser-gate-20260710
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean mobile architecture and historical debris
        run: node scripts/one-time-clean-mobile-architecture.mjs

      - name: Validate cleaned architecture
        run: |
          npm run validate:access
          npm run validate:mobile
          npm run build

      - name: Commit cleaned canonical state
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "cleanup: keep one real mobile app and remove historical debris"
          git push origin HEAD:test/mobile-production-browser-gate-20260710
