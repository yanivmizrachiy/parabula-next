name: Validate ratio import

on:
  push:
    branches:
      - feature/import-ratio-workbook

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/import-ratio-workbook

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify imported files
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/ratio -maxdepth 1 -name 'page-*.png' | wc -l)" -eq 48
          test "$(find . -maxdepth 1 -name 'עמוד-*.html' | awk -F- '$2+0 >= 272 && $2+0 <= 319' | wc -l)" -eq 48
          test -f sources/lovable/ratio-workbook/src/data/worksheetPages.tsx
          grep -q '"name": "יחס"' meta/topics.json

      - name: Generate registry
        run: npm run registry:generate

      - name: Validate metadata
        run: npm run registry:validate

      - name: Run contract tests
        run: npm test

      - name: Verify repository
        run: npm run verify

      - name: Validate HTML
        run: npm run validate:html

      - name: Build production site
        run: npm run build
