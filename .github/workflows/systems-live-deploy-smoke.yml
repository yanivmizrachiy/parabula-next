name: Verify live systems workbook

on:
  workflow_run:
    workflows:
      - Validate and deploy parabula-next
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systems-live-deploy-smoke
  cancel-in-progress: true

jobs:
  verify-live:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the published workbook and every canonical page
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          LIVE_SMOKE_ATTEMPTS: 12
          LIVE_SMOKE_DELAY_MS: 5000
        run: node scripts/verify-live-systems-workbook.mjs
