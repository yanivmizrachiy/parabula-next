name: Algebra Z workbook guard

on:
  pull_request:
    branches: ["main"]
    paths:
      - "algebra-z-workbook.*"
      - "meta/algebra-z-workbook.json"
      - "assets/workbooks/algebra-z/**"
      - "scripts/audit-algebra-z-workbook.mjs"
      - "tests/contracts/algebra-z-workbook.test.mjs"
      - "package.json"
      - ".github/workflows/algebra-z-guard.yml"
  push:
    branches: ["main"]
    paths:
      - "algebra-z-workbook.*"
      - "meta/algebra-z-workbook.json"
      - "assets/workbooks/algebra-z/**"
      - "scripts/audit-algebra-z-workbook.mjs"
      - "tests/contracts/algebra-z-workbook.test.mjs"
      - "package.json"
      - ".github/workflows/algebra-z-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JavaScript syntax
        run: |
          node --check algebra-z-workbook.js
          node --check scripts/audit-algebra-z-workbook.mjs
      - name: Focused contracts
        run: node --test tests/contracts/algebra-z-workbook.test.mjs
      - name: Hybrid migration audit
        run: npm run algebra-z:audit:report
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algebra-z-workbook-audit
          path: meta/audit/algebra-z-workbook-validation.json
          if-no-files-found: error
          retention-days: 7

  migration-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure strict local-PDF readiness
        id: strict
        shell: bash
        run: |
          set +e
          npm run algebra-z:audit:strict > strict-local-audit.log 2>&1
          code=$?
          cat strict-local-audit.log
          if [ "$code" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "### Algebra Z local assets: READY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Algebra Z local assets: PENDING"
              echo "The hardened viewer is local-first and uses the controlled Drive fallback until both verified PDF binaries are committed."
              echo "The strict audit remains the final no-Drive release gate."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Upload strict-readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: algebra-z-strict-local-readiness
          path: strict-local-audit.log
          if-no-files-found: error
          retention-days: 7
