name: Algebra Z strict-local release guard

on:
  pull_request:
    branches: ["main"]
    paths:
      - "algebra-z-workbook.*"
      - "meta/algebra-z-workbook.json"
      - "assets/workbooks/algebra-z/**"
      - "scripts/build-algebra-z-local-assets.mjs"
      - "scripts/audit-algebra-z-workbook.mjs"
      - "tests/contracts/algebra-z-workbook.test.mjs"
      - "package.json"
      - ".github/workflows/algebra-z-guard.yml"
  push:
    branches: ["main"]
    paths:
      - "algebra-z-workbook.*"
      - "meta/algebra-z-workbook.json"
      - "assets/workbooks/algebra-z/**"
      - "scripts/build-algebra-z-local-assets.mjs"
      - "scripts/audit-algebra-z-workbook.mjs"
      - "tests/contracts/algebra-z-workbook.test.mjs"
      - "package.json"
      - ".github/workflows/algebra-z-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-local-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JavaScript syntax
        run: |
          node --check algebra-z-workbook.js
          node --check scripts/build-algebra-z-local-assets.mjs
          node --check scripts/audit-algebra-z-workbook.mjs
      - name: Rebuild both local PDFs from committed chunks
        run: npm run algebra-z:assets
      - name: Verify deterministic PDF bytes and SHA-256
        run: npm run algebra-z:assets:strict
      - name: Write audit evidence
        run: npm run algebra-z:audit:report
      - name: Enforce no-Drive strict-local workbook audit
        run: npm run algebra-z:audit:strict
      - name: Focused viewer contracts
        run: node --test tests/contracts/algebra-z-workbook.test.mjs
      - name: Production build
        run: npm run build
      - name: Upload strict-local evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algebra-z-strict-local-evidence
          path: |
            meta/algebra-z-workbook.json
            meta/audit/algebra-z-workbook-validation.json
            assets/workbooks/algebra-z/downloads/algebra-z-color.pdf
            assets/workbooks/algebra-z/downloads/algebra-z-bw.pdf
          if-no-files-found: error
          retention-days: 7
