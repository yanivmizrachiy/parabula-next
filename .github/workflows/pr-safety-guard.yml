name: PR Safety Guard

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run infrastructure PR safety guard
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          PR_SAFETY_MODE: infrastructure
        run: node scripts/pr-safety-guard.mjs

      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-safety-guard-report
          path: meta/audit/pr-safety-guard.json
