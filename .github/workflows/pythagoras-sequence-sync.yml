name: Pythagoras Sequence Sync

on:
  push:
    branches:
      - agent/pythagoras-a4-full-audit
    paths:
      - 'scripts/sync-pythagoras-sequence.mjs'
      - 'עמוד-21.html'
      - 'עמוד-654.html'
      - '.github/workflows/pythagoras-sequence-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[pythagoras-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pythagoras-a4-full-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync Pythagoras sequence and metadata
        run: |
          node scripts/sync-pythagoras-sequence.mjs
          node scripts/build-curriculum.mjs
      - name: Commit synchronized outputs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No sync changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/topics.json scripts/curriculum-map.mjs 'עמוד-'*.html
          git commit -m "chore(pythagoras): sync 44-page sequence [pythagoras-sync]"
          git push origin HEAD:agent/pythagoras-a4-full-audit
