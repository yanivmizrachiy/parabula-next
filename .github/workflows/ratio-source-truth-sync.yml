name: Sync ratio source-of-truth rules

on:
  push:
    branches:
      - agent/ratio-max-quality-v1
    paths:
      - '.github/workflows/ratio-source-truth-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update the single source of truth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CLAUDE.md')
          lines = path.read_text(encoding='utf-8').splitlines()

          numbering_prefix = '- **אין מספור שאלות גלוי בדף עבודה.**'
          labels_prefix = '- **אין תוויות קושי, שלב או סוג־שאלה גלויות'
          space_prefix = '- **מרחב הפתרון נמדד לפי מה שהתלמיד באמת צריך לכתוב**'

          numbering = [i for i, line in enumerate(lines) if line.startswith(numbering_prefix)]
          labels = [i for i, line in enumerate(lines) if line.startswith(labels_prefix)]
          spaces = [i for i, line in enumerate(lines) if line.startswith(space_prefix)]
          if len(numbering) != 1 or len(labels) != 1 or len(spaces) != 1:
              raise SystemExit(f'Expected one match for each rule; got numbering={numbering}, labels={labels}, spaces={spaces}')

          insert_at = numbering[0] + 1
          new_rules = [
              '- **אין כותרות לשאלות כלל — כלל גורף (הוראת יניב, 2026-08-16):** כותרת גלויה קיימת רק בראש דף העבודה, והיא שם נושא או תת־נושא מתמטי אמיתי וקצר, למשל „מושג היחס”, „מושגים בסיסיים”, „חלוקה ביחס נתון” או „פרופורציה ויחס ישר”. בתוך גוף העמוד אין כותרת לשאלה, eyebrow, badge, tag, שם סוג שאלה, „שאלה N”, „בדיקת הבנה”, „חשיבה והסבר” או כל כיתוב דמו מעל השאלה. השאלה מתחילה מיד בתוכן; תוויות סעיפים א/ב/ג נשארות רק כאשר הן חלק ממבנה השאלה.',
              '- **הדרגתיות בלי תוויות (הוראת יניב, 2026-08-16):** בתוך כל נושא השאלות מסודרות פדגוגית מן הקל אל הקשה. רמת הקושי היא עיקרון סידור פנימי בלבד ואינה מוצגת לתלמיד בכותרת, תגית, צבע או טקסט.',
          ]
          for rule in reversed(new_rules):
              if rule not in lines:
                  lines.insert(insert_at, rule)

          labels = [i for i, line in enumerate(lines) if line.startswith(labels_prefix)]
          lines[labels[0]] = '- **אין תוויות קושי, שלב או סוג־שאלה גלויות — כלל גורף (הוראת יניב, 2026-07-19; חודד 2026-08-16):** מילים כמו „תרגול”, „העשרה”, „אתגר”, „ביסוס”, „שלב ביניים”, „שילוב כלים”, „העמקה”, „למידה מודרכת” ו„שלב N” הן תוויות דמו ואסורות בכל טקסט שהתלמיד רואה. מאחר שאין כותרות לשאלות כלל, גם ניסוח שמתאר סוג שאלה או רמתה אינו מופיע מעל שאלה. חריג יחיד: מילה שהיא חלק אמיתי ובלתי נפרד מתוכן השאלה במקור נשמרת בנאמנות למקור.'

          spaces = [i for i, line in enumerate(lines) if line.startswith(space_prefix)]
          lines[spaces[0]] = '- **מרחב הפתרון נמדד לפי מה שהתלמיד באמת צריך לכתוב**, לא לפי מה שנשאר פנוי בעמוד (הוראת יניב, 2026-07-22; חודד 2026-08-16). אין מידה אחידה לכל שאלה: תשובה קצרה מקבלת קו/תיבה קצרים ונוחים; יחס מקבל `▭ : ▭`; חישוב פשוט מקבל בדרך כלל שורת דרך אחת ותשובה סופית; חישוב רב־שלבי מקבל יותר שורות לפי מספר השלבים; נימוק או הסבר מקבלים מספר שורות שמתאים לאורך הסביר של תשובת תלמיד. מעט מדי מקום הוא פגם, וגם הרבה מקום מיותר הוא פגם. קובעים תחילה מה התלמיד צפוי לכתוב בפועל ורק אז את גובה אזור המענה ואת צפיפות העמוד.'

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Verify rule scope and self-remove
        shell: bash
        run: |
          grep -Fq 'אין כותרות לשאלות כלל' CLAUDE.md
          grep -Fq 'הדרגתיות בלי תוויות' CLAUDE.md
          grep -Fq 'גם הרבה מקום מיותר הוא פגם' CLAUDE.md
          git rm -f .github/workflows/ratio-source-truth-sync.yml
          git add CLAUDE.md
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/ratio-source-truth-sync.yml CLAUDE.md | sort)"
          if [ "$staged" != "$expected" ]; then
            echo 'Unexpected staged files; refusing to commit.'
            printf 'Staged:\n%s\n' "$staged"
            exit 1
          fi

      - name: Commit source-of-truth update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(rules): forbid question headings and calibrate answer space'
          git push origin HEAD:agent/ratio-max-quality-v1
