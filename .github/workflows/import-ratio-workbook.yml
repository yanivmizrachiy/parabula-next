name: Import ratio workbook

on:
  push:
    branches:
      - feature/import-ratio-workbook
    paths:
      - .github/workflows/import-ratio-workbook.yml
      - scripts/import-ratio-workbook.mjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/import-ratio-workbook.yml
      - scripts/import-ratio-workbook.mjs

permissions:
  contents: write

concurrency:
  group: import-ratio-workbook
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Parabula Next
        uses: actions/checkout@v4
        with:
          ref: feature/import-ratio-workbook
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify preserved source and rendered assets
        shell: bash
        run: |
          set -euo pipefail
          test -f sources/lovable/ratio-workbook/src/data/worksheetPages.tsx
          test "$(grep -c "title: 'עמוד" sources/lovable/ratio-workbook/src/data/worksheetPages.tsx)" -eq 48
          test "$(find assets/ratio -maxdepth 1 -name 'page-*.png' | wc -l)" -eq 48

      - name: Regenerate canonical pages and metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/import-ratio-workbook.mjs
          npm ci
          npm run registry:generate

      - name: Commit regenerated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- styles/pages meta/topics.json sources/lovable/ratio-workbook/PARABULA-INTEGRATION.md
          for page in $(seq 272 319); do
            git add -- "עמוד-${page}.html"
          done
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'fix: regenerate canonical ratio workbook pages'
            git push origin HEAD:feature/import-ratio-workbook
          fi

      - name: Validate completed integration
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:meta
          npm test
          npm run verify
          npm run validate:html
          npm run build
