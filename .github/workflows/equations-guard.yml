name: Equations Guard

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'scripts/**'
      - 'meta/topics.json'
      - 'preview/**'
      - 'styles/pages/**'
      - 'styles/topics/equations.css'
      - 'עמוד-*.html'
      - 'pages/משוואות/**'
      - 'sources/legacy/parabula-old/sources/משוואות.pdf'
      - '.github/workflows/equations-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'scripts/**'
      - 'meta/topics.json'
      - 'preview/**'
      - 'styles/pages/**'
      - 'styles/topics/equations.css'
      - 'עמוד-*.html'
      - 'pages/משוואות/**'
      - 'sources/legacy/parabula-old/sources/משוואות.pdf'
      - '.github/workflows/equations-guard.yml'

permissions:
  contents: read

jobs:
  equations-guard:
    name: Equations read-only guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies when lockfile exists
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run equations automation wiring validation
        run: node scripts/validate-equations-automation-wiring.mjs

      - name: Run equations validation suite
        run: npm run validate:equations:all

      - name: Run equations print smoke validation
        run: npm run validate:equations:print-smoke

      - name: Run page 1 source lock guard
        run: node scripts/validate-equations-page1-source-lock.mjs

      - name: Run smart equations queue in read-only mode
        run: npm run audit:equations:smart-queue

      - name: Run SVG conversion plan audit
        run: npm run audit:equations:svg-plan

      - name: Ensure audits did not create tracked changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Equation validation or audit created unexpected repository changes:"
            git status --short
            exit 1
          fi
