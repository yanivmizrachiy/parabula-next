name: Equations Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'scripts/**'
      - 'meta/topics.json'
      - 'preview/**'
      - 'styles/pages/**'
      - 'styles/topics/equations.css'
      - 'עמוד-*.html'
      - 'pages/משוואות/**'
      - 'sources/equations/משוואות-52.pdf'
      - '.github/workflows/equations-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'meta/topics.json'
      - 'preview/**'
      - 'styles/pages/**'
      - 'styles/topics/equations.css'
      - 'עמוד-*.html'
      - 'pages/משוואות/**'
      - 'sources/equations/משוואות-52.pdf'
      - 'scripts/validate-equations-*.mjs'
      - 'scripts/audit-equations-*.mjs'
      - '.github/workflows/equations-guard.yml'

permissions:
  contents: read

jobs:
  equations-guard:
    name: Equations read-only guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies when lockfile exists
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run equations automation wiring validation
        run: node scripts/validate-equations-automation-wiring.mjs

      - name: Run equations validation suite
        run: npm run validate:equations:all

      - name: Run equations print smoke validation
        run: npm run validate:equations:print-smoke

      - name: Run page 1 source lock guard
        run: node scripts/validate-equations-page1-source-lock.mjs

      - name: Run page 1 source checklist audit
        run: node scripts/audit-equations-page1-source-checklist.mjs

      - name: Run first three equations readiness guard
        run: node scripts/validate-equations-first3-readiness.mjs

      - name: Run smart equations queue in read-only mode
        run: npm run audit:equations:smart-queue

      - name: Run SVG conversion plan audit
        run: npm run audit:equations:svg-plan

      - name: Ensure audits did not create unexpected tracked changes
        run: |
          unexpected="$(git status --porcelain | grep -v ' meta/equations-master-map.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Equation validation or audit created unexpected repository changes:"
            echo "$unexpected"
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const path = 'meta/equations-master-map.json';
          const before = JSON.parse(execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' }));
          const after = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete before.generatedAt;
          delete after.generatedAt;
          if (JSON.stringify(before) !== JSON.stringify(after)) {
            console.error('Equations master map is stale (semantic drift beyond generatedAt):');
            console.error(execFileSync('git', ['diff', '--', path], { encoding: 'utf8' }));
            process.exit(1);
          }
          console.log('Equations master map semantic content is stable.');
          NODE

      - name: Capture generated-state diagnostics
        if: always()
        run: |
          mkdir -p meta/audit/equations-ci
          git status --porcelain > meta/audit/equations-ci/git-status.txt
          git diff -- meta/equations-master-map.json > meta/audit/equations-ci/equations-master-map.diff
          cp meta/equations-master-map.json meta/audit/equations-ci/equations-master-map.generated.json

      - name: Upload generated-state diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equations-generated-state
          path: meta/audit/equations-ci
          if-no-files-found: error
          retention-days: 3
