name: Equations Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'scripts/**'
      - 'meta/topics.json'
      - 'preview/**'
      - 'styles/pages/**'
      - 'styles/topics/equations.css'
      - 'עמוד-*.html'
      - 'pages/משוואות/**'
      - 'sources/equations/משוואות-52.pdf'
      - '.github/workflows/equations-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'meta/topics.json'
      - 'preview/**'
      - 'styles/pages/**'
      - 'styles/topics/equations.css'
      - 'עמוד-*.html'
      - 'pages/משוואות/**'
      - 'sources/equations/משוואות-52.pdf'
      - 'scripts/validate-equations-*.mjs'
      - 'scripts/audit-equations-*.mjs'
      - '.github/workflows/equations-guard.yml'

permissions:
  contents: read

jobs:
  repair-canonical-rules:
    if: github.event_name == 'pull_request' && github.head_ref == 'test/open-full-all-98-pages-20260710' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: test/open-full-all-98-pages-20260710
          fetch-depth: 0

      - name: Repair only the empty metadata commands
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CLAUDE.md')
          text = path.read_text(encoding='utf-8')
          old = '''`meta/topics.json` הוא מקור האמת היחיד למבנה התוכן. לאחר שינויו:

1. מריצים ``.
2. מריצים ``.
3. מריצים בדיקות מלאות.
4. מאמתים שמספרי הנושאים והדפים זהים בנייח ובנייד.
'''
          new = '''`meta/topics.json` הוא מקור האמת היחיד למבנה התוכן. לאחר שינויו:

1. מריצים `npm run validate:meta`.
2. מריצים `npm run validate:schema`.
3. מריצים `npm run validate:mobile` ואת שערי הדפדפן הרלוונטיים.
4. מאמתים שמספרי הנושאים והדפים זהים בנייח ובנייד.
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one empty-command block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit repaired CLAUDE.md
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md
          git commit -m "docs: restore canonical metadata validation commands"
          git push origin HEAD:test/open-full-all-98-pages-20260710

  equations-guard:
    name: Equations read-only guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies when lockfile exists
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run equations automation wiring validation
        run: node scripts/validate-equations-automation-wiring.mjs

      - name: Run equations validation suite
        run: npm run validate:equations:all

      - name: Run equations print smoke validation
        run: npm run validate:equations:print-smoke

      - name: Run page 1 source lock guard
        run: node scripts/validate-equations-page1-source-lock.mjs

      - name: Run page 1 source checklist audit
        run: node scripts/audit-equations-page1-source-checklist.mjs

      - name: Run first three equations readiness guard
        run: node scripts/validate-equations-first3-readiness.mjs

      - name: Run smart equations queue in read-only mode
        run: npm run audit:equations:smart-queue

      - name: Run SVG conversion plan audit
        run: npm run audit:equations:svg-plan

      - name: Ensure audits did not create unexpected tracked changes
        run: |
          unexpected="$(git status --porcelain | grep -v ' meta/equations-master-map.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Equation validation or audit created unexpected repository changes:"
            echo "$unexpected"
            exit 1
          fi
          if git diff -- meta/equations-master-map.json | grep '^[+-]' | grep -vE '^[+-]{3} ' | grep -v '"generatedAt"' | grep -q .; then
            echo "Equations master map is stale (substantive drift beyond timestamp):"
            git diff -- meta/equations-master-map.json
            exit 1
          fi
