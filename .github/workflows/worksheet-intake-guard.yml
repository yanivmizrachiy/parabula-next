name: Worksheet Intake Guard

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run worksheet intake guard
        run: node scripts/worksheet-intake-guard.mjs
      - name: Upload worksheet intake guard report
        uses: actions/upload-artifact@v4
        with:
          name: worksheet-intake-guard-report
          path: meta/audit/worksheet-intake-guard.json
