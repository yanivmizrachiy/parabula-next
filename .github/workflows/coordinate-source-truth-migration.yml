name: Coordinate source-truth migration
on:
  push:
    branches: [feature/coordinate-all-quadrants-premium]
    paths: [.github/workflows/coordinate-source-truth-migration.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coordinate-all-quadrants-premium
      - name: Add narrow coordinate exception to canonical rules
        shell: python
        run: |
          from pathlib import Path
          p = Path('CLAUDE.md')
          s = p.read_text(encoding='utf-8')
          old = 'ו„משוואות ריבועיות” במצב „כותרות מקור + מאגר חדש מדורג” (§4.5). אין להסיק מן החריגים הרשאה לנושא אחר.'
          new = 'ו„משוואות ריבועיות” במצב „כותרות מקור + מאגר חדש מדורג” (§4.5), וכן „מערכת צירים — כל הרביעים” במצב „מקור + וריאציות מקוריות מדורגות”. בנושא מערכת צירים — כל הרביעים מותר ליצור שאלות חדשות רק לאחר מיפוי חומרי המקור שסיפק יניב ומיפוי הדפים הקיימים, ורק כאשר השאלה משרתת מיומנות שנמצאה במקור או משלימה במפורש רצף הוראה חסר. אין להסתפק בהחלפת מספרים בשאלה קיימת: יש ליצור נתונים, ניסוח, ייצוג או כיוון חשיבה עצמאיים, לשמור על נכונות מתמטית ומדרג רציף, ולבדוק שאין העתקה מבנית קרובה. אין להסיק מן החריגים הרשאה לנושא אחר.'
          if old not in s:
              raise SystemExit('canonical exception sentence not found; refusing partial migration')
          if 'מערכת צירים — כל הרביעים” במצב „מקור + וריאציות מקוריות מדורגות”' in s:
              raise SystemExit('coordinate exception already exists; refusing duplicate')
          s2 = s.replace(old, new, 1)
          if s2.count(new) != 1:
              raise SystemExit('migration invariant failed')
          p.write_text(s2, encoding='utf-8')
      - name: Commit canonical rule change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CLAUDE.md
          git diff --cached --check
          git commit -m "docs(coordinates): authorize mapped original all-quadrants variants"
          git push origin HEAD:feature/coordinate-all-quadrants-premium
