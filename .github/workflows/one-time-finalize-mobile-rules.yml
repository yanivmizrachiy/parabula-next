name: One-time finalize mobile rules

on:
  push:
    branches:
      - test/open-full-all-98-pages-20260710

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/open-full-all-98-pages-20260710
          fetch-depth: 0

      - name: Finalize canonical mobile rules
        run: node scripts/one-time-finalize-mobile-rules.mjs

      - name: Validate rules
        run: node scripts/single-rules-source-check.mjs

      - name: Commit finalized rules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md scripts/single-rules-source-check.mjs
          git commit -m "docs: finalize strict all-pages mobile quality rules"
          git push origin HEAD:test/open-full-all-98-pages-20260710
