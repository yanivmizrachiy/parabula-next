name: Remove Algebra Z page logo

on:
  push:
    branches:
      - agent/remove-algebra-z-logo

permissions:
  contents: write

concurrency:
  group: remove-algebra-z-logo
  cancel-in-progress: false

jobs:
  generate-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[logo-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the focused branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-algebra-z-logo
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF image-processing dependencies
        run: python -m pip install --disable-pip-version-check pymupdf opencv-python-headless numpy

      - name: Remove the rounded-square logo from all 15 pages in both PDFs
        run: python scripts/remove-algebra-z-logo.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Verify deterministic PDF reconstruction
        run: npm run algebra-z:assets:strict

      - name: Run strict-local workbook audit
        run: npm run algebra-z:audit:strict

      - name: Run focused Algebra Z contracts
        run: node --test tests/contracts/algebra-z-workbook.test.mjs

      - name: Upload before-and-after visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: algebra-z-logo-removal-evidence
          path: tmp/algebra-z-logo-removal/
          if-no-files-found: error
          retention-days: 14

      - name: Commit only the approved logo-free release assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- scripts/remove-algebra-z-logo.py .github/workflows/remove-algebra-z-logo.yml
          git add -- \
            assets/workbooks/algebra-z/downloads/algebra-z-color.pdf \
            assets/workbooks/algebra-z/downloads/algebra-z-bw.pdf \
            assets/workbooks/algebra-z/chunks/color \
            assets/workbooks/algebra-z/chunks/bw \
            meta/algebra-z-workbook.json \
            tests/contracts/algebra-z-workbook.test.mjs
          git diff --cached --check
          git commit -m "fix: remove Algebra Z page logo [logo-generated]"
          git push origin HEAD:agent/remove-algebra-z-logo
