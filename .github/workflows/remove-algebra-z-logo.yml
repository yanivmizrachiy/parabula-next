name: Remove Algebra Z PDF logo

on:
  push:
    branches:
      - fix/remove-algebra-z-pdf-logo
    paths:
      - scripts/remove-algebra-z-pdf-logo.py
      - .github/workflows/remove-algebra-z-logo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-algebra-z-pdf-logo
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.24.10 Pillow==10.4.0

      - name: Remove logo and rebuild deterministic assets
        run: python scripts/remove-algebra-z-pdf-logo.py

      - name: Install Node dependencies
        run: npm ci

      - name: Verify reconstructed PDF assets
        run: |
          npm run algebra-z:assets:strict
          npm run algebra-z:audit:strict
          node --test tests/contracts/algebra-z-workbook.test.mjs
          npm run build

      - name: Commit regenerated PDFs, chunks and manifest
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes found.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            assets/workbooks/algebra-z/downloads/algebra-z-color.pdf \
            assets/workbooks/algebra-z/downloads/algebra-z-bw.pdf \
            assets/workbooks/algebra-z/chunks/color \
            assets/workbooks/algebra-z/chunks/bw \
            meta/algebra-z-workbook.json
          git diff --cached --check
          git commit -m 'fix: remove the logo from Algebra Z PDF pages'
          git push origin HEAD:fix/remove-algebra-z-pdf-logo
