name: Validate and deploy parabula-next

on:
  pull_request:
    branches: ["main"]
  push:
    branches:
      - "main"
      - "test/open-full-all-98-pages-20260710"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.number, github.sha) || github.ref }}"
  cancel-in-progress: true

jobs:
  fix-canonical-rules:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test/open-full-all-98-pages-20260710' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: test/open-full-all-98-pages-20260710
          fetch-depth: 0

      - name: Repair and commit CLAUDE.md
        shell: bash
        run: |
          git pull --ff-only origin test/open-full-all-98-pages-20260710
          python - <<'PY'
          from pathlib import Path
          path = Path('CLAUDE.md')
          text = path.read_text(encoding='utf-8')
          old = '''`meta/topics.json` הוא מקור האמת היחיד למבנה התוכן. לאחר שינויו:

1. מריצים ``.
2. מריצים ``.
3. מריצים בדיקות מלאות.
4. מאמתים שמספרי הנושאים והדפים זהים בנייח ובנייד.
'''
          new = '''`meta/topics.json` הוא מקור האמת היחיד למבנה התוכן. לאחר שינויו:

1. מריצים `npm run validate:meta`.
2. מריצים `npm run validate:schema`.
3. מריצים `npm run validate:mobile` ואת שערי הדפדפן הרלוונטיים.
4. מאמתים שמספרי הנושאים והדפים זהים בנייח ובנייד.
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one empty-command block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md
          git commit -m "docs: restore canonical metadata validation commands"
          git push origin HEAD:test/open-full-all-98-pages-20260710

  build:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical validation and build
        run: npm run ci:all

      - name: Upload production build for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: ./dist
          if-no-files-found: error
          retention-days: 1

  mobile-browser-gate:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Run Android production browser gate
        run: npm run validate:mobile:browser

      - name: Upload Android browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-report
          path: meta/audit/mobile-browser-validation.json
          if-no-files-found: error
          retention-days: 1

  mobile-deep-gate:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: Deep mobile audit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Audit every assigned page in app-reader and open-full
        run: node scripts/validate-mobile-all-pages.mjs --shard-index=${{ matrix.shard }} --shard-count=8

      - name: Upload deep mobile report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-deep-shard-${{ matrix.shard }}
          path: |
            meta/audit/mobile-all-pages-shard-${{ matrix.shard }}.json
            meta/audit/mobile-layout-failures-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, mobile-browser-gate, mobile-deep-gate]
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
