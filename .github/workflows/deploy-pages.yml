name: Validate and deploy parabula-next

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical validation and build
        run: npm run ci:all

      - name: Upload production build for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: ./dist
          if-no-files-found: error
          retention-days: 1

  mobile-browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Run Android production browser gate
        run: npm run validate:mobile:browser

      - name: Upload Android browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-report
          path: meta/audit/mobile-browser-validation.json
          if-no-files-found: error
          retention-days: 1

  mobile-deep-gate:
    name: Deep mobile audit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Audit every assigned page in app-reader and open-full
        run: node scripts/validate-mobile-all-pages.mjs --shard-index=${{ matrix.shard }} --shard-count=8

      - name: Upload deep mobile report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-deep-shard-${{ matrix.shard }}
          path: |
            meta/audit/mobile-all-pages-shard-${{ matrix.shard }}.json
            meta/audit/mobile-layout-failures-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, mobile-browser-gate, mobile-deep-gate]
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
