name: Validate and deploy parabula-next

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Mitzav systems reasoning page
        run: node scripts/import-mitsav-systems-reasoning.mjs

      - name: Upload generated Mitzav systems files
        uses: actions/upload-artifact@v4
        with:
          name: mitsav-systems-page-616-generated
          path: |
            עמוד-531.html
            עמוד-601.html
            עמוד-602.html
            עמוד-603.html
            עמוד-604.html
            עמוד-605.html
            עמוד-606.html
            עמוד-607.html
            עמוד-608.html
            עמוד-609.html
            עמוד-610.html
            עמוד-611.html
            עמוד-612.html
            עמוד-613.html
            עמוד-614.html
            עמוד-615.html
            עמוד-616.html
            styles/pages/עמוד-616.css
            styles/topics/two-variable-systems.css
            scripts/curriculum-map.mjs
            scripts/import-first-quadrant-workbook.mjs
            meta/topics.json
            meta/pages.json
            meta/systems-drive-sync.json
            tests/contracts/two-variable-systems-page-616.test.mjs
          if-no-files-found: error
          retention-days: 3

      - name: Contract tests
        run: npm test

      - name: Canonical page verification
        run: npm run verify

      - name: Metadata registry and schema
        run: |
          npm run validate:meta
          npm run validate:schema

      # שערי תכנית הלימודים (§4.5). בלעדיהם עריכה שמנתקת את meta/topics.json
      # מ-scripts/curriculum-map.mjs מתמזגת בלי שאיש יבחין.
      - name: Curriculum taxonomy
        run: |
          npm run curriculum:check
          npm run validate:curriculum

      - name: Access and mobile architecture
        run: |
          npm run validate:access
          npm run validate:mobile

      - name: Canonical rules
        run: npm run rules:check

      - name: Upload canonical-rules report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-rules-report
          path: meta/audit/rules-source-validation.json
          if-no-files-found: warn
          retention-days: 3

      - name: HTML and vendored dependencies
        run: |
          npm run validate:html
          npm run vendorize:check

      - name: Repository health
        run: npm run health:report

      - name: Build production artifact
        run: npm run build

      - name: Upload production build for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: ./dist
          if-no-files-found: error
          retention-days: 1

  mobile-browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Run Android production browser gate
        run: npm run validate:mobile:browser

      - name: Upload Android browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-report
          path: meta/audit/mobile-browser-validation.json
          if-no-files-found: error
          retention-days: 3

  mobile-interaction-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Run Android, iPhone WebKit and offline journeys
        run: npm run validate:mobile:interactions

      - name: Upload interaction report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-interaction-report
          path: |
            meta/audit/mobile-interactions-validation.json
            meta/audit/mobile-interaction-failures
          if-no-files-found: warn
          retention-days: 3

  mobile-deep-gate:
    name: Deep mobile audit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Audit every assigned page in app-reader and open-full
        run: node scripts/validate-mobile-all-pages.mjs --shard-index=${{ matrix.shard }} --shard-count=8

      - name: Upload deep mobile report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-deep-shard-${{ matrix.shard }}
          path: |
            meta/audit/mobile-all-pages-shard-${{ matrix.shard }}.json
            meta/audit/mobile-layout-failures-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, mobile-browser-gate, mobile-interaction-gate, mobile-deep-gate]
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
