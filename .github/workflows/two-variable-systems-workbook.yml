name: Two Variable Systems Workbook

on:
  push:
    branches:
      - main
    paths:
      - 'systems-workbook.html'
      - 'catalog.html'
      - 'catalog.css'
      - 'catalog.js'
      - 'catalog-deep-link.js'
      - 'mobile-app.html'
      - 'mobile-app.css'
      - 'mobile-app.js'
      - 'mobile-deep-link.js'
      - 'sw.js'
      - 'scripts/copy-static-site.mjs'
      - 'עמוד-60*.html'
      - 'עמוד-61*.html'
      - 'styles/pages/עמוד-60*.css'
      - 'styles/pages/עמוד-61*.css'
      - 'styles/topics/two-variable-systems.css'
      - 'scripts/audit-two-variable-systems.mjs'
      - 'scripts/verify-live-systems-workbook.mjs'
      - 'meta/systems-drive-sync.json'
      - 'meta/two-variable-systems-manifest.json'
      - 'tests/contracts/two-variable-systems-*.test.mjs'
      - 'package.json'
      - '.github/workflows/two-variable-systems-workbook.yml'
  pull_request:
    paths:
      - 'systems-workbook.html'
      - 'catalog.html'
      - 'catalog.css'
      - 'catalog.js'
      - 'catalog-deep-link.js'
      - 'mobile-app.html'
      - 'mobile-app.css'
      - 'mobile-app.js'
      - 'mobile-deep-link.js'
      - 'sw.js'
      - 'scripts/copy-static-site.mjs'
      - 'עמוד-60*.html'
      - 'עמוד-61*.html'
      - 'styles/pages/עמוד-60*.css'
      - 'styles/pages/עמוד-61*.css'
      - 'styles/topics/two-variable-systems.css'
      - 'scripts/audit-two-variable-systems.mjs'
      - 'scripts/verify-live-systems-workbook.mjs'
      - 'meta/systems-drive-sync.json'
      - 'meta/two-variable-systems-manifest.json'
      - 'tests/contracts/two-variable-systems-*.test.mjs'
      - 'package.json'
      - '.github/workflows/two-variable-systems-workbook.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systems-workbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify workbook manifest, navigation and task counts
        shell: bash
        run: |
          set +e
          npm run systems:ci > systems-ci.log 2>&1
          status=$?
          cat systems-ci.log
          printf '%s\n' "$status" > systems-ci-status.txt
          exit "$status"

      - name: Upload systems diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systems-workbook-diagnostics
          path: |
            systems-ci.log
            systems-ci-status.txt
          if-no-files-found: warn

      - name: Run mobile static validation
        run: npm run validate:mobile

      - name: Run equation print smoke validation
        run: npm run validate:equations:print-smoke

      - name: Verify production build includes the workbook gateway and canonical readers
        run: npm run build
