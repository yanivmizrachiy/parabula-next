name: Pythagoras Workbook Quality

on:
  pull_request:
    paths:
      - 'עמוד-*.html'
      - 'styles/pages/עמוד-*.css'
      - 'styles/topics/pythagoras.css'
      - 'styles/topics/pythagoras-live.css'
      - 'styles/topics/pythagoras-foundations.css'
      - 'catalog.js'
      - 'catalog-deep-link.js'
      - 'meta/topics.json'
      - 'scripts/a4-utilization-audit.mjs'
      - 'scripts/pythagoras-whitespace-audit.mjs'
      - 'scripts/pythagoras-solution-capacity-audit.mjs'
      - 'tests/contracts/pythagoras-*.test.mjs'
      - 'CLAUDE.md'
      - '.github/workflows/pythagoras-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pythagoras contracts and deep quality
        run: node --test tests/contracts/pythagoras-*.test.mjs
      - name: Report Pythagoras solution capacity
        run: node scripts/pythagoras-solution-capacity-audit.mjs
      - name: Validate all registered Pythagoras HTML
        shell: bash
        run: |
          PYTHAGORAS_FILES="$(node --input-type=module -e "import fs from 'node:fs'; const meta=JSON.parse(fs.readFileSync('meta/topics.json','utf8')); const topic=meta.topics.find((t)=>t.name==='משפט פיתגורס'); if(!topic) process.exit(2); process.stdout.write(topic.pages.map((p)=>p.file).join(' '));")"
          npx html-validate $PYTHAGORAS_FILES
      - name: Install Chromium for A4 audit
        run: npx playwright install --with-deps chromium
      - name: Audit all registered Pythagoras A4 pages
        shell: bash
        run: |
          PYTHAGORAS_FILES="$(node --input-type=module -e "import fs from 'node:fs'; const meta=JSON.parse(fs.readFileSync('meta/topics.json','utf8')); const topic=meta.topics.find((t)=>t.name==='משפט פיתגורס'); if(!topic) process.exit(2); process.stdout.write(topic.pages.map((p)=>p.file).join(' '));")"
          node scripts/a4-utilization-audit.mjs --min=80 $PYTHAGORAS_FILES
      - name: Report dead whitespace inside all registered Pythagoras pages
        run: node scripts/pythagoras-whitespace-audit.mjs
