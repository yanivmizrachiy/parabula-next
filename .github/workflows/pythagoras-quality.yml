name: Pythagoras Workbook Quality

on:
  pull_request:
    paths:
      - 'עמוד-*.html'
      - 'pythagoras-workbook.html'
      - 'pythagoras-workbook.js'
      - 'styles/pythagoras-workbook.css'
      - 'styles/pages/עמוד-*.css'
      - 'styles/topics/pythagoras.css'
      - 'styles/topics/pythagoras-live.css'
      - 'styles/topics/pythagoras-foundations.css'
      - 'meta/topics.json'
      - 'meta/workbooks/pythagoras.json'
      - 'scripts/a4-utilization-audit.mjs'
      - 'scripts/validate-pythagoras-workbook.mjs'
      - 'scripts/validate-pythagoras-workbook-browser.mjs'
      - 'scripts/pythagoras-whitespace-audit.mjs'
      - 'scripts/pythagoras-solution-capacity-audit.mjs'
      - 'tests/contracts/pythagoras-*.test.mjs'
      - 'CLAUDE.md'
      - '.github/workflows/pythagoras-quality.yml'
  push:
    branches: ['main']
    paths:
      - 'עמוד-*.html'
      - 'pythagoras-workbook.html'
      - 'pythagoras-workbook.js'
      - 'styles/pythagoras-workbook.css'
      - 'styles/pages/עמוד-*.css'
      - 'styles/topics/pythagoras.css'
      - 'styles/topics/pythagoras-live.css'
      - 'styles/topics/pythagoras-foundations.css'
      - 'meta/topics.json'
      - 'meta/workbooks/pythagoras.json'
      - 'scripts/a4-utilization-audit.mjs'
      - 'scripts/validate-pythagoras-workbook.mjs'
      - 'scripts/validate-pythagoras-workbook-browser.mjs'
      - 'scripts/pythagoras-whitespace-audit.mjs'
      - 'scripts/pythagoras-solution-capacity-audit.mjs'
      - 'tests/contracts/pythagoras-*.test.mjs'
      - 'CLAUDE.md'
      - '.github/workflows/pythagoras-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate canonical Pythagoras workbook
        run: node scripts/validate-pythagoras-workbook.mjs

      - name: Pythagoras contracts and deep quality
        run: node --test tests/contracts/pythagoras-*.test.mjs

      - name: Report Pythagoras solution capacity
        run: node scripts/pythagoras-solution-capacity-audit.mjs

      - name: Validate every canonical Pythagoras HTML page
        shell: bash
        run: |
          PYTHAGORAS_FILES="$(node --input-type=module -e "import fs from 'node:fs'; const book=JSON.parse(fs.readFileSync('meta/workbooks/pythagoras.json','utf8')); process.stdout.write(book.pages.map((n)=>'עמוד-'+n+'.html').join(' '));")"
          npx html-validate $PYTHAGORAS_FILES
          npx html-validate pythagoras-workbook.html

      - name: Install Chromium for workbook and A4 audits
        run: npx playwright install --with-deps chromium

      - name: Verify unified workbook in Chromium
        run: node scripts/validate-pythagoras-workbook-browser.mjs

      - name: Audit every canonical Pythagoras A4 page
        shell: bash
        run: |
          PYTHAGORAS_FILES="$(node --input-type=module -e "import fs from 'node:fs'; const book=JSON.parse(fs.readFileSync('meta/workbooks/pythagoras.json','utf8')); process.stdout.write(book.pages.map((n)=>'עמוד-'+n+'.html').join(' '));")"
          node scripts/a4-utilization-audit.mjs --min=80 $PYTHAGORAS_FILES

      - name: Report dead whitespace across canonical workbook
        run: node scripts/pythagoras-whitespace-audit.mjs
