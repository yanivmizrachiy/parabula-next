name: Ratio Workbook V2

on:
  push:
    branches:
      - main
      - agent/ratio-safe-upgrade-20260818
    paths:
      - 'sources/lovable/ratio-workbook/**'
      - 'scripts/*ratio*.mjs'
      - 'tests/contracts/ratio-*.test.mjs'
      - 'assets/ratio/**'
      - 'styles/topics/ratio-*'
      - 'styles/pages/עמוד-27[2-9].css'
      - 'styles/pages/עמוד-28[0-9].css'
      - 'styles/pages/עמוד-29[0-9].css'
      - 'styles/pages/עמוד-30[0-9].css'
      - 'styles/pages/עמוד-31[0-9].css'
      - 'עמוד-27[2-9].html'
      - 'עמוד-28[0-9].html'
      - 'עמוד-29[0-9].html'
      - 'עמוד-30[0-9].html'
      - 'עמוד-31[0-9].html'
      - '.github/workflows/ratio-workbook-v2.yml'
  pull_request:
    paths:
      - 'sources/lovable/ratio-workbook/**'
      - 'scripts/*ratio*.mjs'
      - 'tests/contracts/ratio-*.test.mjs'
      - 'assets/ratio/**'
      - 'styles/topics/ratio-*'
      - 'styles/pages/עמוד-27[2-9].css'
      - 'styles/pages/עמוד-28[0-9].css'
      - 'styles/pages/עמוד-29[0-9].css'
      - 'styles/pages/עמוד-30[0-9].css'
      - 'styles/pages/עמוד-31[0-9].css'
      - 'עמוד-27[2-9].html'
      - 'עמוד-28[0-9].html'
      - 'עמוד-29[0-9].html'
      - 'עמוד-30[0-9].html'
      - 'עמוד-31[0-9].html'
      - '.github/workflows/ratio-workbook-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ratio-workbook-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-render-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect every non-ratio page from this change
        env:
          RATIO_SCOPE_BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-ratio-change-scope.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sources/lovable/ratio-workbook/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install ratio workbook dependencies
        run: npm ci --prefix sources/lovable/ratio-workbook --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Test ratio mathematics and structure
        run: npm run ratio:test

      - name: Verify all 48 React pages support semantic SSR export
        run: npm run ratio:semantic:all:check

      - name: Verify measurable content manifest for all 48 pages
        run: npm run manifest:check --prefix sources/lovable/ratio-workbook

      - name: Render and audit all 48 A4 pages
        run: npm run ratio:render

      - name: Preflight 48 semantic canonical A4 pages without writing
        run: node scripts/export-ratio-workbook-live.mjs

      - name: Verify safe import plan without writing
        run: npm run ratio:import:check

      - name: Run repository contract suite
        run: npm run ci:all

      - name: Run mobile browser checks with diagnostics
        shell: bash
        run: |
          set +e
          npm run validate:mobile:browser 2>&1 | tee mobile-browser.log
          browser_status=${PIPESTATUS[0]}
          npm run validate:mobile:interactions 2>&1 | tee mobile-interactions.log
          interactions_status=${PIPESTATUS[0]}
          printf 'browser_status=%s\ninteractions_status=%s\n' "$browser_status" "$interactions_status" > mobile-status.txt
          if [ "$browser_status" -ne 0 ] || [ "$interactions_status" -ne 0 ]; then
            exit 1
          fi

      - name: Verify committed derived images on canonical/bot revisions
        if: github.ref_name == 'main' || github.actor == 'github-actions[bot]'
        shell: bash
        run: |
          if ! git diff --exit-code -- assets/ratio/page-*.png; then
            echo 'Rendered ratio images are stale. The verified source and committed derived renders must match.'
            exit 1
          fi

      - name: Upload diagnostics and ratio audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratio-workbook-v2-audit
          path: |
            assets/ratio/audit-v2.json
            mobile-browser.log
            mobile-interactions.log
            mobile-status.txt
            test-results/
          if-no-files-found: warn

  materialize-verified-print-output:
    needs: verify-render-and-audit
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/ratio-safe-upgrade-20260818' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout isolated ratio head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ratio-safe-upgrade-20260818

      - name: Protect non-ratio repository surface
        run: node scripts/check-ratio-change-scope.mjs origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sources/lovable/ratio-workbook/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install ratio workbook dependencies
        run: npm ci --prefix sources/lovable/ratio-workbook --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render verified 48-page A4 snapshot set
        run: npm run ratio:render

      - name: Write verified semantic canonical ratio pages
        shell: bash
        run: |
          rm -rf assets/ratio/live
          rm -f styles/topics/ratio-live.css
          node scripts/export-ratio-workbook-live.mjs --write

      - name: Re-check isolated change scope before staging
        run: node scripts/check-ratio-change-scope.mjs origin/main

      - name: Stage only verified ratio print output
        shell: bash
        run: |
          for n in $(seq 272 319); do
            git add -- "עמוד-${n}.html" "styles/pages/עמוד-${n}.css"
          done
          git add -- styles/topics/ratio-live.css assets/ratio/live assets/ratio/page-*.png
          git rm -f --ignore-unmatch styles/pages/ratio-import.css
          git diff --cached --check

      - name: Reject every staged file outside ratio print scope
        shell: bash
        run: |
          bad=0
          while IFS= read -r file; do
            case "$file" in
              עמוד-27[2-9].html|עמוד-28[0-9].html|עמוד-29[0-9].html|עמוד-30[0-9].html|עמוד-31[0-9].html|styles/pages/עמוד-27[2-9].css|styles/pages/עמוד-28[0-9].css|styles/pages/עמוד-29[0-9].css|styles/pages/עמוד-30[0-9].css|styles/pages/עמוד-31[0-9].css|styles/topics/ratio-live.css|styles/pages/ratio-import.css|assets/ratio/live/*|assets/ratio/page-[0-9][0-9][0-9].png) ;;
              *) echo "FORBIDDEN staged file: $file"; bad=1 ;;
            esac
          done < <(git diff --cached --name-only)
          test "$bad" -eq 0

      - name: Commit verified 48-page print output
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo 'Verified ratio print output is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(יחס): materialize verified 48-page print output'
          git push origin HEAD:agent/ratio-safe-upgrade-20260818
