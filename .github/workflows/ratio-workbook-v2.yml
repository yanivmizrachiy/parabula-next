name: Ratio Workbook V2

on:
  push:
    branches:
      - main
      - agent/ratio-safe-upgrade-20260818
    paths:
      - 'sources/lovable/ratio-workbook/**'
      - 'scripts/*ratio*.mjs'
      - 'tests/contracts/ratio-*.test.mjs'
      - 'assets/ratio/**'
      - 'styles/topics/ratio-*'
      - 'styles/pages/עמוד-27[2-9].css'
      - 'styles/pages/עמוד-28[0-9].css'
      - 'styles/pages/עמוד-29[0-9].css'
      - 'styles/pages/עמוד-30[0-9].css'
      - 'styles/pages/עמוד-31[0-9].css'
      - 'עמוד-27[2-9].html'
      - 'עמוד-28[0-9].html'
      - 'עמוד-29[0-9].html'
      - 'עמוד-30[0-9].html'
      - 'עמוד-31[0-9].html'
      - '.github/workflows/ratio-workbook-v2.yml'
  pull_request:
    paths:
      - 'sources/lovable/ratio-workbook/**'
      - 'scripts/*ratio*.mjs'
      - 'tests/contracts/ratio-*.test.mjs'
      - 'assets/ratio/**'
      - 'styles/topics/ratio-*'
      - 'styles/pages/עמוד-27[2-9].css'
      - 'styles/pages/עמוד-28[0-9].css'
      - 'styles/pages/עמוד-29[0-9].css'
      - 'styles/pages/עמוד-30[0-9].css'
      - 'styles/pages/עמוד-31[0-9].css'
      - 'עמוד-27[2-9].html'
      - 'עמוד-28[0-9].html'
      - 'עמוד-29[0-9].html'
      - 'עמוד-30[0-9].html'
      - 'עמוד-31[0-9].html'
      - '.github/workflows/ratio-workbook-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratio-workbook-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-render-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Protect every non-ratio page from this change
        env:
          RATIO_SCOPE_BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-ratio-change-scope.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sources/lovable/ratio-workbook/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install ratio workbook dependencies
        run: npm ci --prefix sources/lovable/ratio-workbook --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Test ratio mathematics and structure
        run: npm run ratio:test

      - name: Verify all 48 React pages support semantic SSR export
        run: npm run ratio:semantic:all:check

      - name: Verify measurable content manifest for all 48 pages
        run: npm run manifest:check --prefix sources/lovable/ratio-workbook

      - name: Render and audit all 48 A4 pages
        run: npm run ratio:render

      - name: Preflight 48 semantic canonical A4 pages without writing
        run: node scripts/export-ratio-workbook-live.mjs

      - name: Verify safe import plan without writing
        run: npm run ratio:import:check

      - name: Run repository contract suite
        run: npm run ci:all

      - name: Run mobile browser checks with diagnostics
        shell: bash
        run: |
          set +e
          npm run validate:mobile:browser 2>&1 | tee mobile-browser.log
          browser_status=${PIPESTATUS[0]}
          npm run validate:mobile:interactions 2>&1 | tee mobile-interactions.log
          interactions_status=${PIPESTATUS[0]}
          printf 'browser_status=%s\ninteractions_status=%s\n' "$browser_status" "$interactions_status" > mobile-status.txt
          if [ "$browser_status" -ne 0 ] || [ "$interactions_status" -ne 0 ]; then
            exit 1
          fi

      - name: Synchronize derived ratio PNG renders on isolated upgrade branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/ratio-safe-upgrade-20260818' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          changed=$(git diff --name-only -- assets/ratio/page-*.png)
          if [ -z "$changed" ]; then
            echo 'Derived ratio renders are already current.'
            exit 0
          fi
          forbidden=$(printf '%s\n' "$changed" | grep -Ev '^assets/ratio/page-[0-9]{3}\.png$' || true)
          if [ -n "$forbidden" ]; then
            echo 'Refusing to commit files outside the 48 derived ratio PNG renders:'
            printf '%s\n' "$forbidden"
            exit 1
          fi
          count=$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)
          if [ "$count" -gt 48 ]; then
            echo "Unexpected ratio render count: $count"
            exit 1
          fi
          git add -- assets/ratio/page-*.png
          git diff --cached --check
          staged=$(git diff --cached --name-only)
          bad=$(printf '%s\n' "$staged" | grep -Ev '^assets/ratio/page-[0-9]{3}\.png$' || true)
          if [ -n "$bad" ]; then
            echo 'Forbidden staged files:'
            printf '%s\n' "$bad"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(יחס): sync verified derived A4 renders [skip ci]'
          git push origin HEAD:agent/ratio-safe-upgrade-20260818

      - name: Verify generated images are committed and current
        shell: bash
        run: |
          if ! git diff --exit-code -- assets/ratio/page-*.png; then
            echo 'Rendered ratio images are stale. The source and the committed derived renders must match.'
            exit 1
          fi

      - name: Upload diagnostics and ratio audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratio-workbook-v2-audit
          path: |
            assets/ratio/audit-v2.json
            mobile-browser.log
            mobile-interactions.log
            mobile-status.txt
            test-results/
          if-no-files-found: warn
