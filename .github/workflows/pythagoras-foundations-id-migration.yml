name: Pythagoras foundations guarded ID migration

on:
  push:
    branches:
      - gpt/pythagoras-foundations-v1
    paths:
      - .github/workflows/pythagoras-foundations-id-migration.yml
      - scripts/migrate-pythagoras-foundation-ids-once.mjs

permissions:
  contents: write

concurrency:
  group: pythagoras-foundations-id-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check migration
        run: node --check scripts/migrate-pythagoras-foundation-ids-once.mjs

      - name: Migrate Pythagoras physical IDs
        run: node scripts/migrate-pythagoras-foundation-ids-once.mjs

      - name: Rebuild canonical curriculum metadata
        run: |
          node scripts/build-curriculum.mjs
          node scripts/generate-pages-registry.mjs

      - name: Verify Pythagoras and root page contracts
        run: node --test tests/contracts/root-pages.test.mjs tests/contracts/pythagoras-foundations.test.mjs

      - name: Verify canonical repository structure
        run: node scripts/verify.mjs

      - name: Verify curriculum
        run: node scripts/validate-curriculum.mjs

      - name: Verify single rules source
        run: node scripts/single-rules-source-check.mjs

      - name: Verify systems retired IDs stay absent
        run: npm run systems:check

      - name: Commit canonical migration outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration outputs to commit."
            exit 0
          fi
          git commit -m "fix(pythagoras): move foundations off retired systems IDs"
          git push origin HEAD:gpt/pythagoras-foundations-v1
