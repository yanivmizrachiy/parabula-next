name: Intake two-variable systems pages

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/two-variable-systems-drive-pages
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate faithful Drive intake pages
        run: node scripts/intake-two-variable-systems.mjs

      - name: Synchronize curriculum and registries
        run: |
          npm run curriculum:build
          npm run validate:meta

      - name: Diagnose global navigation order
        run: |
          node <<'NODE' > nav-order-report.txt
          const fs = require('fs');
          const files = fs.readdirSync('.').filter((name) => /^עמוד-\d+\.html$/u.test(name)).sort((a, b) => a.localeCompare(b, 'he'));
          const strip = (value) => value.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
          const entries = [];
          let best = [];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const meta = html.match(/<div\s+class="nav-meta"[^>]*>([\s\S]*?)<\/div>/iu);
            if (!meta) continue;
            const parsed = strip(meta[1]).match(/^(.*?)\s*—\s*עמוד\s*(\d+)\s*\/\s*(\d+)\s*$/u);
            if (!parsed) continue;
            const block = html.match(/<div\s+class="preview-nav-topics"[\s\S]*?<\/div>/iu)?.[0] ?? '';
            const hints = [];
            for (const match of block.matchAll(/<a\s+class="topic-link[^"]*"[\s\S]*?>([\s\S]*?)<\/a>/giu)) hints.push(strip(match[1]));
            if (hints.length > best.length) best = hints;
            entries.push({ file, topic: parsed[1].trim(), index: Number(parsed[2]), total: Number(parsed[3]) });
          }
          const topics = new Map();
          for (const entry of entries) {
            if (!topics.has(entry.topic)) topics.set(entry.topic, []);
            topics.get(entry.topic).push(entry);
          }
          const sorted = [...topics.entries()].map(([name, pages]) => ({ name, pages: pages.sort((a,b)=>a.index-b.index) }));
          sorted.sort((a,b) => {
            if (a.name === 'אחר' || b.name === 'אחר') return a.name === 'אחר' ? 1 : -1;
            const ai = best.indexOf(a.name), bi = best.indexOf(b.name);
            if (ai >= 0 && bi >= 0) return ai-bi;
            if ((ai >= 0) !== (bi >= 0)) return ai >= 0 ? -1 : 1;
            return a.name.localeCompare(b.name, 'he');
          });
          console.log('BEST_HINTS=' + JSON.stringify(best));
          sorted.forEach((topic, i) => console.log(`${i+1}. ${topic.name}: ${topic.pages[0].file} .. ${topic.pages.at(-1).file}`));
          const pos = sorted.findIndex((topic) => topic.name === 'מערכת משוואות בשני נעלמים');
          console.log('NEW_TOPIC_POSITION=' + pos);
          console.log('EXPECTED_PREV=' + (pos > 0 ? sorted[pos-1].pages.at(-1).file : 'DISABLED'));
          console.log('EXPECTED_NEXT=' + (pos < sorted.length-1 ? sorted[pos+1].pages[0].file : 'DISABLED'));
          NODE
          cat nav-order-report.txt

      - name: Package generated canonical files
        run: |
          mkdir -p generated-intake/styles/pages generated-intake/styles/topics generated-intake/scripts generated-intake/meta
          cp עמוד-195.html עמוד-320.html generated-intake/
          cp עמוד-601.html עמוד-602.html עמוד-603.html עמוד-604.html generated-intake/
          cp עמוד-605.html עמוד-606.html עמוד-607.html עמוד-608.html generated-intake/
          cp styles/topics/two-variable-systems.css generated-intake/styles/topics/
          cp styles/pages/עמוד-601.css styles/pages/עמוד-602.css generated-intake/styles/pages/
          cp styles/pages/עמוד-603.css styles/pages/עמוד-604.css generated-intake/styles/pages/
          cp styles/pages/עמוד-605.css styles/pages/עמוד-606.css generated-intake/styles/pages/
          cp styles/pages/עמוד-607.css styles/pages/עמוד-608.css generated-intake/styles/pages/
          cp scripts/curriculum-map.mjs generated-intake/scripts/
          cp meta/topics.json meta/pages.json generated-intake/meta/

      - name: Upload generated intake artifact
        uses: actions/upload-artifact@v4
        with:
          name: systems-intake-generated
          path: generated-intake
          if-no-files-found: error
          retention-days: 3

      - name: Run validation suite and capture report
        id: validation
        shell: bash
        run: |
          set +e
          : > validation-report.txt
          failed=0
          run_check() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a validation-report.txt
            "$@" 2>&1 | tee -a validation-report.txt
            code=${PIPESTATUS[0]}
            echo "EXIT_CODE=$code" | tee -a validation-report.txt
            echo | tee -a validation-report.txt
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          run_check "npm test" npm test
          run_check "npm run verify" npm run verify
          run_check "npm run validate:schema" npm run validate:schema
          run_check "npm run curriculum:check" npm run curriculum:check
          run_check "npm run validate:curriculum" npm run validate:curriculum
          run_check "npm run validate:html" npm run validate:html
          run_check "npm run build" npm run build
          echo "FAILED=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: systems-intake-validation-report
          path: |
            validation-report.txt
            nav-order-report.txt
          if-no-files-found: error
          retention-days: 3

      - name: Fail when a validation command failed
        if: steps.validation.outputs.FAILED == '1'
        run: exit 1
