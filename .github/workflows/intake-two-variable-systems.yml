name: Intake two-variable systems pages

on:
  push:
    branches:
      - agent/two-variable-systems-drive-pages
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/two-variable-systems-drive-pages
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate faithful Drive intake pages
        run: node scripts/intake-two-variable-systems.mjs

      - name: Synchronize curriculum and registries
        run: |
          npm run curriculum:build
          npm run validate:meta

      - name: Validate generated changes
        run: |
          npm test
          npm run verify
          npm run validate:schema
          npm run curriculum:check
          npm run validate:curriculum
          npm run validate:html
          npm run build

      - name: Commit generated canonical files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            עמוד-195.html עמוד-320.html \
            עמוד-601.html עמוד-602.html עמוד-603.html עמוד-604.html \
            עמוד-605.html עמוד-606.html עמוד-607.html עמוד-608.html \
            styles/topics/two-variable-systems.css \
            styles/pages/עמוד-601.css styles/pages/עמוד-602.css \
            styles/pages/עמוד-603.css styles/pages/עמוד-604.css \
            styles/pages/עמוד-605.css styles/pages/עמוד-606.css \
            styles/pages/עמוד-607.css styles/pages/עמוד-608.css \
            scripts/curriculum-map.mjs meta/topics.json meta/pages.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "feat(מערכות): דפי עבודה מדורגים ממשימות הדרייב"
            git push origin HEAD:agent/two-variable-systems-drive-pages
          fi
