name: Intake two-variable systems pages

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/two-variable-systems-drive-pages
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate faithful Drive intake pages
        run: node scripts/intake-two-variable-systems.mjs

      - name: Synchronize curriculum and registries
        run: |
          npm run curriculum:build
          npm run validate:meta

      - name: Package generated canonical files
        run: |
          mkdir -p generated-intake/styles/pages generated-intake/styles/topics generated-intake/scripts generated-intake/meta
          cp עמוד-195.html עמוד-320.html generated-intake/
          cp עמוד-601.html עמוד-602.html עמוד-603.html עמוד-604.html generated-intake/
          cp עמוד-605.html עמוד-606.html עמוד-607.html עמוד-608.html generated-intake/
          cp styles/topics/two-variable-systems.css generated-intake/styles/topics/
          cp styles/pages/עמוד-601.css styles/pages/עמוד-602.css generated-intake/styles/pages/
          cp styles/pages/עמוד-603.css styles/pages/עמוד-604.css generated-intake/styles/pages/
          cp styles/pages/עמוד-605.css styles/pages/עמוד-606.css generated-intake/styles/pages/
          cp styles/pages/עמוד-607.css styles/pages/עמוד-608.css generated-intake/styles/pages/
          cp scripts/curriculum-map.mjs generated-intake/scripts/
          cp meta/topics.json meta/pages.json generated-intake/meta/

      - name: Upload generated intake artifact
        uses: actions/upload-artifact@v4
        with:
          name: systems-intake-generated
          path: generated-intake
          if-no-files-found: error
          retention-days: 3

      - name: Validate generated changes
        run: |
          npm test
          npm run verify
          npm run validate:schema
          npm run curriculum:check
          npm run validate:curriculum
          npm run validate:html
          npm run build
