name: Intake two-variable systems pages

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/two-variable-systems-drive-pages
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate faithful Drive intake pages
        run: |
          node scripts/intake-two-variable-systems.mjs
          node scripts/finalize-two-variable-systems-navigation.mjs

      - name: Synchronize curriculum and registries
        run: |
          npm run curriculum:build
          npm run validate:meta

      - name: Verify generated files are committed
        shell: bash
        run: |
          git diff --exit-code -- \
            עמוד-531.html עמוד-573.html \
            עמוד-601.html עמוד-602.html עמוד-603.html עמוד-604.html \
            עמוד-605.html עמוד-606.html עמוד-607.html עמוד-608.html \
            styles/topics/two-variable-systems.css \
            styles/pages/עמוד-601.css styles/pages/עמוד-602.css \
            styles/pages/עמוד-603.css styles/pages/עמוד-604.css \
            styles/pages/עמוד-605.css styles/pages/עמוד-606.css \
            styles/pages/עמוד-607.css styles/pages/עמוד-608.css \
            scripts/curriculum-map.mjs meta/topics.json

      - name: Package generated canonical files
        run: |
          mkdir -p generated-intake/styles/pages generated-intake/styles/topics generated-intake/scripts generated-intake/meta
          cp עמוד-573.html עמוד-531.html generated-intake/
          cp עמוד-601.html עמוד-602.html עמוד-603.html עמוד-604.html generated-intake/
          cp עמוד-605.html עמוד-606.html עמוד-607.html עמוד-608.html generated-intake/
          cp styles/topics/two-variable-systems.css generated-intake/styles/topics/
          cp styles/pages/עמוד-601.css styles/pages/עמוד-602.css generated-intake/styles/pages/
          cp styles/pages/עמוד-603.css styles/pages/עמוד-604.css generated-intake/styles/pages/
          cp styles/pages/עמוד-605.css styles/pages/עמוד-606.css generated-intake/styles/pages/
          cp styles/pages/עמוד-607.css styles/pages/עמוד-608.css generated-intake/styles/pages/
          cp scripts/curriculum-map.mjs generated-intake/scripts/
          cp meta/topics.json meta/pages.json generated-intake/meta/

      - name: Upload generated intake artifact
        uses: actions/upload-artifact@v4
        with:
          name: systems-intake-generated
          path: generated-intake
          if-no-files-found: error
          retention-days: 3

      - name: Run validation suite and capture report
        id: validation
        shell: bash
        run: |
          set +e
          : > validation-report.txt
          failed=0
          run_check() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a validation-report.txt
            "$@" 2>&1 | tee -a validation-report.txt
            code=${PIPESTATUS[0]}
            echo "EXIT_CODE=$code" | tee -a validation-report.txt
            echo | tee -a validation-report.txt
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          run_check "npm test" npm test
          run_check "npm run verify" npm run verify
          run_check "npm run validate:schema" npm run validate:schema
          run_check "npm run curriculum:check" npm run curriculum:check
          run_check "npm run validate:curriculum" npm run validate:curriculum
          run_check "npm run validate:html" npm run validate:html
          run_check "npm run build" npm run build
          echo "FAILED=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: systems-intake-validation-report
          path: validation-report.txt
          if-no-files-found: error
          retention-days: 3

      - name: Locate system Chrome
        run: |
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            echo "No system Chrome found" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Run targeted visual audit
        id: visual
        continue-on-error: true
        run: node scripts/audit-two-variable-systems.mjs

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systems-intake-visual-audit
          path: STATE/reports/two-variable-systems
          if-no-files-found: error
          retention-days: 3

      - name: Fail when validation failed
        if: steps.validation.outputs.FAILED == '1' || steps.visual.outcome != 'success'
        run: exit 1
