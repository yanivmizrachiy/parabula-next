name: Build coordinate first quadrant workbook

on:
  push:
    branches:
      - content/coordinate-first-quadrant-final
      - main
    paths-ignore:
      - projects/coordinate-first-quadrant-workbook/dist/**
      - projects/coordinate-first-quadrant-workbook/downloads/**
      - projects/coordinate-first-quadrant-workbook/preview/**
      - projects/coordinate-first-quadrant-workbook/audit/generated-audit.json
      - projects/coordinate-first-quadrant-workbook/audit/build.log
      - projects/coordinate-first-quadrant-workbook/SHA256SUMS.txt
  pull_request:
    branches:
      - main
    paths-ignore:
      - projects/coordinate-first-quadrant-workbook/dist/**
      - projects/coordinate-first-quadrant-workbook/downloads/**
      - projects/coordinate-first-quadrant-workbook/preview/**
      - projects/coordinate-first-quadrant-workbook/audit/generated-audit.json
      - projects/coordinate-first-quadrant-workbook/audit/build.log
      - projects/coordinate-first-quadrant-workbook/SHA256SUMS.txt
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: coordinate-first-quadrant-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and browsers
        working-directory: projects/coordinate-first-quadrant-workbook
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium chromium-headless-shell

      - name: Build and audit workbook
        id: workbook_build
        working-directory: projects/coordinate-first-quadrant-workbook
        continue-on-error: true
        run: |
          mkdir -p audit
          set -o pipefail
          node src/build.mjs 2>&1 | tee audit/build.log

      - name: Commit generated outputs
        if: github.event_name == 'push' && steps.workbook_build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            projects/coordinate-first-quadrant-workbook/dist \
            projects/coordinate-first-quadrant-workbook/downloads \
            projects/coordinate-first-quadrant-workbook/preview \
            projects/coordinate-first-quadrant-workbook/audit/generated-audit.json \
            projects/coordinate-first-quadrant-workbook/SHA256SUMS.txt
          git diff --cached --quiet || git commit -m "build(coordinate-workbook): generate verified outputs"
          git push origin HEAD:"${TARGET_BRANCH}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinate-first-quadrant-workbook
          if-no-files-found: warn
          retention-days: 7
          path: |
            projects/coordinate-first-quadrant-workbook/dist
            projects/coordinate-first-quadrant-workbook/downloads
            projects/coordinate-first-quadrant-workbook/preview
            projects/coordinate-first-quadrant-workbook/audit/generated-audit.json
            projects/coordinate-first-quadrant-workbook/audit/build.log
            projects/coordinate-first-quadrant-workbook/SHA256SUMS.txt

      - name: Fail when workbook build failed
        if: steps.workbook_build.outcome != 'success'
        run: exit 1
