name: Build coordinate first quadrant workbook

on:
  push:
    branches:
      - content/coordinate-first-quadrant-final
      - main
    paths-ignore:
      - projects/coordinate-first-quadrant-workbook/dist/**
      - projects/coordinate-first-quadrant-workbook/downloads/**
      - projects/coordinate-first-quadrant-workbook/preview/**
      - projects/coordinate-first-quadrant-workbook/audit/generated-audit.json
      - projects/coordinate-first-quadrant-workbook/audit/build.log
      - projects/coordinate-first-quadrant-workbook/SHA256SUMS.txt
  pull_request:
    branches:
      - main
    paths-ignore:
      - projects/coordinate-first-quadrant-workbook/dist/**
      - projects/coordinate-first-quadrant-workbook/downloads/**
      - projects/coordinate-first-quadrant-workbook/preview/**
      - projects/coordinate-first-quadrant-workbook/audit/generated-audit.json
      - projects/coordinate-first-quadrant-workbook/audit/build.log
      - projects/coordinate-first-quadrant-workbook/SHA256SUMS.txt
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: coordinate-first-quadrant-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install build tools
        run: |
          sudo apt-get update >/tmp/apt-update.log
          sudo apt-get install -y poppler-utils zip >/tmp/apt-install.log
          npm install --no-save --package-lock=false playwright@1.55.0
      - name: Locate system Chrome and set CHROME_PATH
        run: |
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Using browser: $CHROME"
      - name: Build and audit workbook
        id: workbook_build
        continue-on-error: true
        run: |
          mkdir -p projects/coordinate-first-quadrant-workbook/audit
          set -o pipefail
          node projects/coordinate-first-quadrant-workbook/src/build.mjs 2>&1 | tee projects/coordinate-first-quadrant-workbook/audit/build.log
      - name: Commit generated outputs
        if: github.event_name == 'push' && steps.workbook_build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            projects/coordinate-first-quadrant-workbook/dist \
            projects/coordinate-first-quadrant-workbook/downloads \
            projects/coordinate-first-quadrant-workbook/preview \
            projects/coordinate-first-quadrant-workbook/audit/generated-audit.json \
            projects/coordinate-first-quadrant-workbook/SHA256SUMS.txt
          git diff --cached --quiet || git commit -m "build(coordinate-workbook): generate verified outputs"
          git push origin HEAD:"${TARGET_BRANCH}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinate-first-quadrant-workbook
          if-no-files-found: warn
          retention-days: 7
          path: |
            projects/coordinate-first-quadrant-workbook/dist
            projects/coordinate-first-quadrant-workbook/downloads
            projects/coordinate-first-quadrant-workbook/preview
            projects/coordinate-first-quadrant-workbook/audit/generated-audit.json
            projects/coordinate-first-quadrant-workbook/audit/build.log
            projects/coordinate-first-quadrant-workbook/SHA256SUMS.txt
      - name: Fail when workbook build failed
        if: steps.workbook_build.outcome != 'success'
        run: exit 1
