name: One-time clean equations mobile CSS

on:
  push:
    branches:
      - chore/remove-equations-mobile-zoom-20260710

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-equations-mobile-zoom-20260710
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove legacy mobile zoom and stale rules references
        run: node scripts/one-time-clean-equations-mobile-css.mjs

      - name: Commit cleaned CSS atomically
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/pages/עמוד-*.css
          git commit -m "cleanup: remove legacy equations mobile zoom from source CSS"
          git push origin HEAD:chore/remove-equations-mobile-zoom-20260710
