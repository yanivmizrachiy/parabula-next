name: Temporary equations page 16 visual audit

on:
  push:
    branches:
      - test/open-full-all-98-pages-20260710

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: node scripts/tmp-audit-equations-page-16.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: equations-page-16-visual-audit
          path: tmp-page16-audit
          if-no-files-found: error
          retention-days: 1
