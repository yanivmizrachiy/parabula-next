name: Fix ratio semantic shell collisions

on:
  push:
    branches:
      - agent/ratio-max-quality-v1
    paths:
      - .github/workflows/ratio-semantic-shell-reset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shell reset
        run: python .github/scripts/ratio-semantic-shell-reset.py

      - name: Verify scope and self-remove
        run: |
          grep -Fq '.ratio-live-page .question-block {' scripts/export-ratio-workbook-live.mjs
          grep -Fq 'flex-direction: row;' scripts/export-ratio-workbook-live.mjs
          grep -Fq '.ratio-live-page > .header-container {' scripts/export-ratio-workbook-live.mjs
          git rm .github/workflows/ratio-semantic-shell-reset.yml
          git rm .github/scripts/ratio-semantic-shell-reset.py
          git add scripts/export-ratio-workbook-live.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 3

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ratio): isolate semantic shell from base CSS collisions'
          git push origin HEAD:agent/ratio-max-quality-v1
