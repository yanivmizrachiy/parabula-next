<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>פרבולה — ספר עבודה מתמטי</title>
  <meta name="description" content="ספר עבודה מתמטי דיגיטלי — דפי עבודה A4 בעברית לפי נושאים, קריאה נוחה, הדפסה ושמירה כ-PDF" />

  <link rel="stylesheet" href="vendor/fonts/rubik.css" />
  <link rel="stylesheet" href="reader-actions.css" />
  <link rel="stylesheet" href="catalog.css" />
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <header class="site-header" role="banner">
    <div class="header-brand">
      <button id="tocToggle" class="icon-btn toc-toggle" aria-label="פתיחת תוכן העניינים" aria-expanded="true">
        <span></span><span></span><span></span>
      </button>
      <span class="brand-icon" aria-hidden="true">📐</span>
      <div class="brand-text">
        <span class="brand-title">פרבולה</span>
        <span class="brand-sub">ספר עבודה מתמטי</span>
      </div>
    </div>

    <div class="header-search">
      <label for="globalSearch" class="sr-only">חיפוש דפים ונושאים בכל הספר</label>
      <div class="search-wrap">
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 20 20" fill="none">
          <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/>
          <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="globalSearch" type="search" placeholder="חיפוש בכל הספר — נושא, כותרת או מספר עמוד…" autocomplete="off" />
        <button id="clearSearch" class="search-clear" aria-label="נקה חיפוש" hidden>✕</button>
      </div>
      <div id="searchResults" class="search-dropdown" hidden role="listbox" aria-label="תוצאות חיפוש"></div>
    </div>

    <div class="header-right">
      <a class="chip-btn" href="coordinate-first-quadrant.html" title="פתיחת חוברת מערכת צירים — רביע ראשון">📘 מערכת צירים — 30 עמודים</a>
      <div id="modeSwitch" class="mode-switch" role="group" aria-label="מצב דפדוף">
        <button data-mode="single" class="mode-btn is-active" type="button" title="עמוד בודד">עמוד</button>
        <button data-mode="spread" class="mode-btn" type="button" title="כפולת עמודים">כפולה</button>
        <button data-mode="scroll" class="mode-btn" type="button" title="גלילה רציפה של הפרק">גלילה</button>
      </div>
      <button id="boardBtn" class="chip-btn" type="button" aria-haspopup="dialog" aria-controls="board"
              title="לוח מונים — כמה דפי עבודה קיימים בכל נושא ותת־נושא">📊 לוח מונים</button>
      <span id="statChip" class="stat-chip">— דפים · — נושאים</span>
    </div>
  </header>

  <!-- ═══ COUNTERS BOARD ═══ -->
  <div id="board" class="board" hidden role="dialog" aria-modal="true" aria-labelledby="boardTitle">
    <div class="board-backdrop" data-close></div>
    <div class="board-panel" tabindex="-1">
      <div class="board-head">
        <div>
          <h2 id="boardTitle" class="board-title">לוח מונים — דפי עבודה לפי תכנית הלימודים</h2>
          <p id="boardSummary" class="board-summary" role="status"></p>
        </div>
        <button id="boardClose" class="chip-btn" type="button" aria-label="סגירת לוח המונים">✕ סגירה</button>
      </div>
      <div class="board-filters" role="group" aria-label="סינון תצוגה">
        <button id="boardToggleEmpty" class="chip-btn" type="button" aria-pressed="true">נושאים ריקים</button>
      </div>
      <div id="boardBody" class="board-body"><!-- filled by JS --></div>
    </div>
  </div>

  <!-- ═══ LAYOUT ═══ -->
  <div class="app-layout">

    <!-- ═══ TABLE OF CONTENTS ═══ -->
    <aside id="toc" class="toc" role="navigation" aria-label="תוכן העניינים">
      <div class="toc-inner">
        <div class="toc-head">
          <h2 class="toc-title">תוכן העניינים</h2>
          <button id="selectModeBtn" class="chip-btn" type="button" aria-pressed="false" title="בחירת דפים מרובים להדפסה/PDF">☑ בחירה</button>
        </div>
        <nav id="tocList" class="toc-list" aria-label="נושאים ודפים"><!-- filled by JS --></nav>
      </div>
    </aside>
    <div id="tocOverlay" class="toc-overlay" aria-hidden="true"></div>

    <!-- ═══ READER ═══ -->
    <main class="reader" id="reader">

      <!-- loading -->
      <div id="stateLoading" class="state-panel" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>טוען את הספר…</p>
      </div>

      <!-- error -->
      <div id="stateError" class="state-panel state-error" role="alert" hidden>
        <p class="state-icon" aria-hidden="true">⚠️</p>
        <p id="errorMsg">לא ניתן לטעון את הנתונים.</p>
        <button id="retryBtn" class="btn-primary" type="button">נסה שוב</button>
      </div>

      <!-- reader stage -->
      <div id="readerStage" class="reader-stage" hidden>
        <div class="reader-bar">
          <div class="reader-copy">
            <strong id="readerTitle">—</strong>
            <span id="readerMeta">—</span>
          </div>
          <div class="reader-actions" role="group" aria-label="פעולות על הדף הנוכחי">
            <button id="btnPrint" class="act-btn primary" type="button" title="הדפסת הדף">🖨 הדפסה</button>
            <button id="btnPdf" class="act-btn" type="button" title="שמירה כ-PDF דרך חלון ההדפסה">⬇ PDF</button>
            <button id="btnHtml" class="act-btn ghost" type="button" title="הורדת קובץ ה-HTML של הדף">HTML</button>
            <button id="btnOpen" class="act-btn ghost" type="button" title="פתיחה בחלון מלא בטאב חדש">↗ פתח</button>
            <div class="act-sep"></div>
            <button id="btnPrintTopic" class="act-btn ghost" type="button" title="הדפסת כל דפי הפרק">🖨 פרק</button>
          </div>
        </div>

        <div id="viewport" class="viewport">
          <button id="navPrev" class="page-nav prev" type="button" aria-label="העמוד הקודם">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><polyline points="15,5 8,12 15,19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div id="sheets" class="sheets" aria-live="polite"><!-- iframes injected by JS --></div>
          <button id="navNext" class="page-nav next" type="button" aria-label="העמוד הבא">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><polyline points="9,5 16,12 9,19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="reader-foot">
          <button id="footPrev" class="foot-nav" type="button">◄ הקודם</button>
          <button id="footNext" class="foot-nav" type="button">הבא ►</button>
        </div>
      </div>
    </main>
  </div>

  <!-- ═══ SELECTION BAR ═══ -->
  <div id="selectionBar" class="selection-bar" hidden role="region" aria-label="דפים נבחרים">
    <span id="selectionCount" class="sel-count">נבחרו 0 דפים</span>
    <div class="sel-actions">
      <button id="selPrint" class="act-btn primary" type="button">🖨 הדפס נבחרים</button>
      <button id="selPdf" class="act-btn" type="button">⬇ שמור נבחרים PDF</button>
      <button id="selClear" class="act-btn ghost" type="button">נקה בחירה</button>
    </div>
  </div>

  <script src="reader-actions.js"></script>
  <script src="catalog.js"></script>
  <script src="catalog-deep-link.js?v=__MOBILE_VERSION__"></script>
</body>
</html>
