<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>רביע ראשון</title><style>html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:#eef1f6;color:#0f172a}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:680px;background:#fff;border:1px solid #dbe1ec;border-radius:14px;padding:24px;box-shadow:0 8px 30px rgba(15,23,42,.12)}h1{margin:0 0 8px;color:#1e3a8a}.muted{color:#64748b;font-size:14px}.error{color:#b91c1c;white-space:pre-wrap}a{color:#1d4ed8}</style></head><body><main class="loading"><section class="card"><h1>רביע ראשון</h1><p id="status">טוען את 21 דפי העבודה המתוקנים…</p><p class="muted">החוברת כוללת גם קישור למפתח תשובות למורה וכלי הדפסה ל-A4.</p><noscript><p class="error">נדרש JavaScript לפתיחת החוברת.</p></noscript></section></main><script>(async()=>{const status=document.getElementById('status');const files=["assets/first-quadrant/source-v3-00.b64","assets/first-quadrant/source-v3-01.b64","assets/first-quadrant/source-v3-02.b64","assets/first-quadrant/source-v3-03.b64","assets/first-quadrant/source-v3-04.b64","assets/first-quadrant/source-v3-05.b64"];try{if(!('DecompressionStream' in window))throw new Error('הדפדפן אינו תומך בפתיחת החוברת הדחוסה. יש לפתוח בדפדפן מעודכן.');const parts=[];for(const f of files){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(`טעינת ${f} נכשלה (${r.status}).`);parts.push((await r.text()).trim());}const binary=atob(parts.join(''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(error){status.className='error';status.textContent=error instanceof Error?error.message:String(error);}})();</script></body></html>
