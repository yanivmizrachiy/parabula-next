<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parabula Next Preview</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      height: 100%;
    }

    body {
      display: grid;
      grid-template-columns: 320px 1fr;
      overflow: hidden;
    }

    .sidebar {
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 16px;
      overflow: auto;
    }

    .sidebar h1 {
      margin-top: 0;
      font-size: 18px;
    }

    .sidebar p {
      color: var(--muted);
      line-height: 1.5;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin: 16px 0;
    }

    .controls button,
    .controls select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0b1220;
      color: var(--text);
    }

    .viewer-wrap {
      overflow: auto;
      padding: 20px;
      display: grid;
      place-items: start center;
    }

    iframe {
      width: 900px;
      height: 1280px;
      border: 1px solid #1f2937;
      background: white;
      border-radius: 10px;
    }

    .status {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .ok {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1>Parabula Next Preview</h1>
    <p>זהו ה-preview הקנוני של הריפו החדש. עובדים תמיד מכאן.</p>

    <div class="controls">
      <select id="pageSelect">
        <option value="/עמוד-1.html">עמוד 1</option>
      </select>
      <button id="reloadBtn" type="button">רענון</button>
      <button id="openBtn" type="button">פתח דף ישירות</button>
    </div>

    <div class="status">
      <div>מצב: <span class="ok" id="statusText">מוכן</span></div>
      <div id="currentFile">/עמוד-1.html</div>
    </div>
  </aside>

  <main class="viewer-wrap">
    <iframe id="viewer" src="/עמוד-1.html"></iframe>
  </main>

  <script>
    const viewer = document.getElementById('viewer');
    const pageSelect = document.getElementById('pageSelect');
    const reloadBtn = document.getElementById('reloadBtn');
    const openBtn = document.getElementById('openBtn');
    const statusText = document.getElementById('statusText');
    const currentFile = document.getElementById('currentFile');

    function setPage(file) {
      viewer.src = file + '?v=' + Date.now();
      currentFile.textContent = file;
      statusText.textContent = 'עודכן';
      try {
        localStorage.setItem('preview:lastFile', file);
      } catch {}
    }

    try {
      const saved = localStorage.getItem('preview:lastFile');
      if (saved) {
        pageSelect.value = saved;
        viewer.src = saved;
        currentFile.textContent = saved;
      }
    } catch {}

    pageSelect.addEventListener('change', () => setPage(pageSelect.value));
    reloadBtn.addEventListener('click', () => setPage(pageSelect.value));
    openBtn.addEventListener('click', () => window.open(pageSelect.value, '_blank'));

    let reloadTimer = null;
    const es = new EventSource('/events');
    es.addEventListener('reload', () => {
      if (reloadTimer) clearTimeout(reloadTimer);
      reloadTimer = setTimeout(() => {
        setPage(pageSelect.value);
      }, 180);
    });
  </script>
</body>
</html>
