<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parabula Next Preview</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111827;
      --panel-2: #0f172a;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #3b82f6;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: 360px 1fr;
      overflow: hidden;
    }

    aside {
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .top {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }

    .top h1 {
      margin: 0 0 8px 0;
      font-size: 18px;
    }

    .top .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .toolbar {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .toolbar input,
    .toolbar select,
    .toolbar button,
    .toolbar a {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0b1220;
      color: var(--text);
      padding: 10px 12px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .toolbar a.external {
      background: #0a1f14;
      border-color: #14532d;
      color: #bbf7d0;
    }

    .toolbar button.primary {
      background: #0b1f3a;
      border-color: #1d4ed8;
      color: #dbeafe;
    }

    .toolbar button.good {
      background: #052e16;
      border-color: #166534;
      color: #dcfce7;
    }

    .list {
      padding: 12px;
      overflow: auto;
      display: grid;
      gap: 14px;
    }

    .topic {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255,255,255,0.02);
    }

    .topic-header {
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .pages {
      display: grid;
      gap: 8px;
      padding: 10px;
    }

    .page-btn {
      text-align: right;
      width: 100%;
      border: 1px solid var(--line);
      background: #0b1220;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .page-btn:hover {
      border-color: var(--accent-2);
    }

    .page-btn.active {
      border-color: var(--accent);
      background: #052e16;
      color: #dcfce7;
    }

    .page-num {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    main.viewer-shell {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      min-height: 0;
    }

    .viewer-topbar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: #09111f;
    }

    .viewer-title {
      min-width: 0;
    }

    .viewer-title strong {
      display: block;
      font-size: 15px;
    }

    .viewer-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .viewer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .viewer-actions button,
    .viewer-actions a {
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0b1220;
      color: var(--text);
      padding: 9px 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .viewer-actions a.real-site {
      background: #0a1f14;
      border-color: #166534;
      color: #dcfce7;
    }

    .viewer-wrap {
      overflow: auto;
      padding: 20px;
      display: grid;
      place-items: start center;
    }

    iframe {
      width: 980px;
      height: 1320px;
      border: 1px solid #1f2937;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  <aside>
    <div class="top">
      <h1>Parabula Preview</h1>
      <div class="meta">
        <div id="summaryText">טוען דפים...</div>
        <div>תצוגה מקדימה קבועה לעריכה, בדיקה והדפסה.</div>
      </div>

      <div class="toolbar">
        <input id="searchBox" type="search" placeholder="חיפוש לפי כותרת או מספר עמוד" />
        <select id="topicFilter">
          <option value="__all__">כל הנושאים</option>
        </select>
        <button class="primary" id="reloadCurrentBtn" type="button">רענן עמוד נוכחי</button>
        <button class="good" id="openPageBtn" type="button">פתח עמוד ישירות</button>
        <a class="external" id="openSiteHome" href="/" target="_blank" rel="noreferrer">פתח אתר חיצוני</a>
      </div>
    </div>

    <div class="list" id="topicsList"></div>
  </aside>

  <main class="viewer-shell">
    <div class="viewer-topbar">
      <div class="viewer-title">
        <strong id="currentTitle">לא נבחר עמוד</strong>
        <span id="currentMeta">—</span>
      </div>

      <div class="viewer-actions">
        <button id="prevBtn" type="button">הקודם</button>
        <button id="nextBtn" type="button">הבא</button>
        <a id="openRealSiteBtn" class="real-site" href="/" target="_blank" rel="noreferrer">פתח באתר האמיתי</a>
      </div>
    </div>

    <div class="viewer-wrap">
      <iframe id="viewer" src="about:blank"></iframe>
    </div>
  </main>

  <script type="module" src="./index.js"></script>
</body>
</html>
