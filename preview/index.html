<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parabula Next Preview</title>
  <link rel="stylesheet" href="./reader.css" />
</head>
<body>
  <aside>
    <div class="top">
      <h1>Parabula Preview</h1>
      <div class="meta">
        <div id="summaryText">טוען דפים...</div>
        <div>תצוגה מקדימה קבועה לעריכה, בדיקה והדפסה.</div>
      </div>

      <div class="toolbar">
        <input id="searchBox" type="search" placeholder="חיפוש לפי כותרת או מספר עמוד" />
        <select id="topicFilter">
          <option value="__all__">כל הנושאים</option>
        </select>
        <button class="primary" id="reloadCurrentBtn" type="button">רענן עמוד נוכחי</button>
        <button class="good" id="openPageBtn" type="button">פתח עמוד ישירות</button>
        <a class="external" id="openSiteHome" href="/" target="_blank" rel="noreferrer">פתח אתר חיצוני</a>
      </div>
    </div>

    <div class="list" id="topicsList"></div>
  </aside>

  <main class="viewer-shell">
    <div class="viewer-topbar">
      <div class="viewer-title">
        <strong id="currentTitle">לא נבחר עמוד</strong>
        <span id="currentMeta">—</span>
      </div>

      <div class="viewer-actions">
        <button id="prevBtn" type="button">הקודם</button>
        <button id="nextBtn" type="button">הבא</button>
        <a id="openRealSiteBtn" class="real-site" href="/" target="_blank" rel="noreferrer">פתח באתר האמיתי</a>
      </div>
    </div>

    <div class="viewer-wrap">
      <iframe id="viewer" src="about:blank"></iframe>
    </div>
  </main>

  <script>
    const viewer = document.getElementById('viewer');
    const topicsList = document.getElementById('topicsList');
    const searchBox = document.getElementById('searchBox');
    const topicFilter = document.getElementById('topicFilter');
    const summaryText = document.getElementById('summaryText');
    const currentTitle = document.getElementById('currentTitle');
    const currentMeta = document.getElementById('currentMeta');
    const openPageBtn = document.getElementById('openPageBtn');
    const openSiteHome = document.getElementById('openSiteHome');
    const openRealSiteBtn = document.getElementById('openRealSiteBtn');
    const reloadCurrentBtn = document.getElementById('reloadCurrentBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let db = null;
    let flatPages = [];
    let currentIndex = -1;
    let reloadTimer = null;

    function normalize(s) {
      return String(s || '').toLowerCase().trim();
    }

    function render() {
      if (!db) return;

      const q = normalize(searchBox.value);
      const topicValue = topicFilter.value;

      const filteredTopics = db.topics
        .map(topic => ({
          ...topic,
          pages: topic.pages.filter(p => {
            const matchesTopic = topicValue === '__all__' || p.topic === topicValue;
            const hay = normalize(`${p.title} ${p.file} ${p.number} ${p.topic}`);
            const matchesSearch = !q || hay.includes(q);
            return matchesTopic && matchesSearch;
          })
        }))
        .filter(t => t.pages.length > 0);

      topicsList.innerHTML = '';

      const visiblePages = filteredTopics.flatMap(t => t.pages).sort((a, b) => a.number - b.number);
      flatPages = visiblePages;

      summaryText.textContent = `${db.totalPages} דפים, ${db.topics.length} נושאים, מוצגים כעת ${visiblePages.length} דפים`;

      for (const topic of filteredTopics) {
        const section = document.createElement('section');
        section.className = 'topic';

        const header = document.createElement('div');
        header.className = 'topic-header';
        header.innerHTML = `<span>${topic.name}</span><span>${topic.pages.length}</span>`;
        section.appendChild(header);

        const pagesWrap = document.createElement('div');
        pagesWrap.className = 'pages';

        for (const page of topic.pages) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'page-btn';
          btn.dataset.file = page.file;
          btn.innerHTML = `<div class="page-num">עמוד ${page.number}</div><div>${page.title}</div>`;
          btn.addEventListener('click', () => setCurrentPage(page.file));
          pagesWrap.appendChild(btn);
        }

        section.appendChild(pagesWrap);
        topicsList.appendChild(section);
      }

      syncActiveButton();
      syncPrevNextState();
    }

    function syncActiveButton() {
      document.querySelectorAll('.page-btn').forEach(btn => {
        btn.classList.toggle('active', currentIndex >= 0 && flatPages[currentIndex] && btn.dataset.file === flatPages[currentIndex].file);
      });
    }

    function syncPrevNextState() {
      prevBtn.disabled = currentIndex <= 0;
      nextBtn.disabled = currentIndex < 0 || currentIndex >= flatPages.length - 1;
    }

    function setCurrentPage(file) {
      const idx = flatPages.findIndex(p => p.file === file);
      const page = idx >= 0 ? flatPages[idx] : db.topics.flatMap(t => t.pages).find(p => p.file === file);
      if (!page) return;

      currentIndex = flatPages.findIndex(p => p.file === page.file);
      if (currentIndex < 0) {
        flatPages = db.topics.flatMap(t => t.pages).sort((a, b) => a.number - b.number);
        currentIndex = flatPages.findIndex(p => p.file === page.file);
      }

      viewer.src = page.previewPath + '?v=' + Date.now();
      currentTitle.textContent = page.title;
      currentMeta.textContent = `${page.topic} · עמוד ${page.number} · ${page.file}`;
      openRealSiteBtn.href = page.siteUrl;
      openPageBtn.onclick = () => window.open(page.previewPath, '_blank');
      openSiteHome.href = db.siteUrl;
      localStorage.setItem('preview:lastFile', page.file);
      syncActiveButton();
      syncPrevNextState();
    }

    reloadCurrentBtn.addEventListener('click', () => {
      if (currentIndex >= 0 && flatPages[currentIndex]) {
        setCurrentPage(flatPages[currentIndex].file);
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        setCurrentPage(flatPages[currentIndex - 1].file);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex >= 0 && currentIndex < flatPages.length - 1) {
        setCurrentPage(flatPages[currentIndex + 1].file);
      }
    });

    searchBox.addEventListener('input', render);
    topicFilter.addEventListener('change', render);

    async function boot() {
      const res = await fetch('/meta/topics.json?v=' + Date.now());
      db = await res.json();

      for (const topic of db.topics) {
        const opt = document.createElement('option');
        opt.value = topic.name;
        opt.textContent = `${topic.name} (${topic.count})`;
        topicFilter.appendChild(opt);
      }

      render();

      const saved = localStorage.getItem('preview:lastFile');
      const all = db.topics.flatMap(t => t.pages).sort((a, b) => a.number - b.number);
      if (saved && all.some(p => p.file === saved)) {
        setCurrentPage(saved);
      } else if (all.length > 0) {
        setCurrentPage(all[0].file);
      }
    }

    boot();

    const es = new EventSource('/events');
    es.addEventListener('reload', () => {
      if (reloadTimer) clearTimeout(reloadTimer);
      reloadTimer = setTimeout(async () => {
        try {
          const prevFile = currentIndex >= 0 && flatPages[currentIndex] ? flatPages[currentIndex].file : null;
          const res = await fetch('/meta/topics.json?v=' + Date.now());
          db = await res.json();
          topicFilter.innerHTML = '<option value="__all__">כל הנושאים</option>';
          for (const topic of db.topics) {
            const opt = document.createElement('option');
            opt.value = topic.name;
            opt.textContent = `${topic.name} (${topic.count})`;
            topicFilter.appendChild(opt);
          }
          render();
          if (prevFile) setCurrentPage(prevFile);
        } catch {}
      }, 220);
    });
  </script>
</body>
</html>
