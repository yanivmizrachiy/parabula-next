<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09111f" />
  <title>אפליקציית הדפים של יניב</title>
  <link rel="manifest" href="./mobile-app.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./mobile.css" />
  <link rel="stylesheet" href="./ux-polish.css" />
  <link rel="stylesheet" href="./mobile-app.css" />
</head>
<body>
  <div class="mobile-app-shell">
    <header class="mobile-app-header">
      <div class="mobile-app-title-wrap">
        <strong>אפליקציית הדפים של יניב</strong>
        <span id="appSummary">טוען נושאים…</span>
      </div>
      <div class="mobile-app-header-actions">
        <a class="mobile-app-chip" href="./mobile-app-install.html">התקנה</a>
        <a class="mobile-app-chip" href="./print.html">PDF</a>
      </div>
    </header>

    <section id="mobileWelcomeCard" class="mobile-welcome-card">
      <div class="mobile-welcome-copy">
        <strong>ברוך הבא לאפליקציית הדפים</strong>
        <span id="mobileResumeMeta">אפשר להמשיך מהמקום האחרון או להתחיל מחדש.</span>
      </div>
      <div class="mobile-welcome-actions">
        <button id="resumeLastBtn" type="button">המשך מהמקום האחרון</button>
        <button id="startBookBtn" type="button">התחל מההתחלה</button>
      </div>
    </section>

    <section class="mobile-topic-strip-wrap">
      <div id="topicStrip" class="mobile-topic-strip" aria-label="כל הנושאים"></div>
    </section>

    <main class="mobile-main-grid">
      <aside class="mobile-topic-panel">
        <div class="mobile-panel-head">
          <strong id="currentTopicTitle">נושאים</strong>
          <span id="currentTopicMeta">—</span>
        </div>
        <div class="mobile-search-row">
          <input id="globalSearch" type="search" placeholder="חיפוש לפי נושא, כותרת או מספר עמוד" />
        </div>
        <div id="topicPages" class="mobile-topic-pages"></div>
      </aside>

      <section class="mobile-preview-panel">
        <div class="mobile-preview-head">
          <div class="mobile-preview-copy">
            <strong id="currentPageTitle">טוען…</strong>
            <span id="currentPageMeta">—</span>
          </div>
          <div class="mobile-preview-actions">
            <button id="prevPageBtn" type="button">הקודם</button>
            <button id="nextPageBtn" type="button">הבא</button>
            <button id="nextTopicBtn" type="button">נושא הבא</button>
            <button id="openLiveBtn" type="button">פתח</button>
            <button id="printBtn" type="button">הדפס / PDF</button>
            <button id="openPrintCenterBtn" type="button">מרכז PDF</button>
            <button id="openTopicHomeBtn" type="button">תחילת נושא</button>
            <button id="openInstallBtn" type="button">התקנה</button>
            <button id="openBookStartBtn" type="button">תחילת ספר</button>
            <button id="openHubBtn" type="button">מרכז</button>
          </div>
        </div>
        <div class="mobile-book-progress">
          <span id="topicProgress">—</span>
          <span id="globalProgress">—</span>
        </div>
        <div id="mobileLoadingState" class="mobile-loading-state" hidden>טוען דף…</div>
        <div class="mobile-a4-stage">
          <div class="mobile-a4-frame">
            <iframe id="mobilePageFrame" title="Worksheet mobile preview" src="about:blank"></iframe>
          </div>
        </div>
      </section>
    </main>

    <nav class="mobile-app-bottom-nav" aria-label="ניווט מהיר">
      <button id="bottomPrevBtn" type="button">הקודם</button>
      <button id="bottomNextBtn" type="button">הבא</button>
      <button id="bottomOpenBtn" type="button">פתח</button>
      <button id="bottomPrintBtn" type="button">PDF</button>
      <button id="bottomTopicBtn" type="button">נושא הבא</button>
      <button id="bottomTopicHomeBtn" type="button">תחילת נושא</button>
      <button id="bottomBookStartBtn" type="button">תחילת ספר</button>
      <button id="bottomHubBtn" type="button">מרכז</button>
    </nav>
  </div>
  <script src="./mobile-app.js"></script>
</body>
</html>
