<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09111f" />
  <title>Parabula Print Center</title>
  <link rel="stylesheet" href="./mobile.css" />
  <link rel="stylesheet" href="./print.css" />
  <link rel="stylesheet" href="./ux-polish.css" />
</head>
<body>
  <div class="print-shell">
    <section class="print-panel">
      <div class="print-topnav">
        <a href="./app.html">חזרה למרכז</a>
        <a href="./topics.html">חזרה לנושאים</a>
        <a href="./equations.html">משוואות</a>
        <button id="printNowBtn" type="button">הדפס עכשיו</button>
      </div>
      <h1>מרכז הדפסה</h1>
      <p>בחר דפים אמיתיים מהריפו, פתח אותם ברצף, ואז השתמש בדפדפן ל־Print / Save as PDF.</p>
      <div class="selection-summary" id="selectionSummary">עדיין לא נבחרו דפים</div>
      <div class="print-actions">
        <input id="searchBox" type="search" placeholder="חיפוש לפי כותרת, נושא או מספר עמוד" />
        <select id="topicFilter">
          <option value="__all__">כל הנושאים</option>
        </select>
        <div class="print-toolbar">
          <button id="restoreSelectionBtn" type="button">שחזר בחירה אחרונה</button>
          <button id="selectVisibleBtn" type="button">בחר מוצגים</button>
          <button id="clearBtn" type="button">נקה</button>
          <button id="openSelectedBtn" class="primary" type="button">פתח נבחרים</button>
        </div>
      </div>
      <div id="selectionList" class="selection-list"></div>
    </section>
    <section id="printView" class="print-view" aria-label="תצוגת הדפסה רציפה"></section>
  </div>
  <script src="./print.js"></script>
</body>
</html>
