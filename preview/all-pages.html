<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כל הדפים — parabula-next</title>
  <link rel="stylesheet" href="./all-pages.css" />
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <h1>כל הדפים</h1>
        <p>תצוגה נוחה של כל הדפים שנוצרו, עם חיפוש, סינון, פתיחה, העתקת קישור והדפסה</p>
      </div>
      <div class="hero-stats">
        <span id="totalPagesBadge" class="badge">0 דפים</span>
        <span id="totalTopicsBadge" class="badge soft">0 נושאים</span>
      </div>
    </header>

    <section class="toolbar">
      <input id="searchBox" type="search" placeholder="חיפוש לפי שם דף, נושא או מספר עמוד" />
      <select id="topicFilter">
        <option value="__all__">כל הנושאים</option>
      </select>
      <button id="clearBtn" type="button">נקה</button>
      <button id="printSelectedBtn" class="primary" type="button">הדפס בחירה</button>
      <button id="goTopicsBtn" type="button">חזור לנושאים</button>
    </section>

    <section class="selectionBar">
      <div id="selectionInfo">לא נבחרו דפים</div>
      <div class="selectionActions">
        <button id="clearSelectionBtn" type="button">נקה בחירה</button>
        <button id="copySelectionBtn" type="button">העתק קישורי בחירה</button>
      </div>
    </section>

    <main class="layout">
      <section>
        <div id="pagesGrid" class="pages-grid"></div>
      </section>
    </main>
  </div>

  <script src="./all-pages.js"></script>
</body>
</html>
